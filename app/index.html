  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    .shell { max-width: 560px; margin: 0 auto; }

    /* 상단 */
    .top { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .top-in { display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 18px; padding-top: env(safe-area-inset-top); }
    .top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo svg { width: 30px; height: 30px; }
    .top-act { display: flex; gap: 4px; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; cursor: pointer; text-decoration: none; }
    .icon-btn svg, .tab svg, .row-act svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* 화면 */
    .view[hidden] { display: none; }
    .sec { padding: 6px 0 4px; }
    .sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 8px; }
    .sec-h h2 { margin: 0; font-size: 16px; font-weight: 700; color: var(--ink-2); }
    .sec-h a, .sec-h button { font-size: 15.5px; color: var(--ssaka-deep); text-decoration: none; border: 0; background: none; cursor: pointer; font-weight: 700; padding: 6px 0; }
    .divider { height: 8px; background: var(--bg-2); margin: 6px 0; }

    /* 목록 행 (카톡 친구/채팅 목록처럼) */
    .row { display: flex; align-items: center; gap: 14px; padding: 10px 18px; text-decoration: none; min-height: 72px; }
    .row:active { background: var(--bg-2); }
    .ava { flex: none; width: 50px; height: 50px; border-radius: 19px; overflow: hidden; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; background: var(--ssaka); }
    .ava img { width: 100%; height: 100%; object-fit: cover; }
    .row.me { padding-top: 14px; padding-bottom: 14px; }
    .row.me .ava { width: 64px; height: 64px; border-radius: 24px; font-size: 26px; }
    .row-txt { min-width: 0; flex: 1; display: grid; gap: 3px; }
    .row-t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.me .row-t { font-size: 18px; }
    .row-s { font-size: 15px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-r { flex: none; display: grid; justify-items: end; gap: 6px; font-size: 14px; color: var(--ink-2); }
    .new { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ssaka); color: #fff; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; }
    .row-r { display: flex; gap: 6px; align-items: center; }
    .row-act { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: var(--ssaka-soft); color: var(--ssaka-deep); border-radius: 12px; cursor: pointer; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--bg-2); color: var(--ink-2); }
    .tag.ok { background: var(--ssaka-soft); color: var(--ssaka-deep); }
    .tag.off { text-decoration: line-through; }

    /* 첫 화면 안내 */
    .hero { margin: 8px 18px 6px; padding: 20px 20px 18px; border-radius: 22px; background: var(--ssaka-soft); color: var(--ssaka-deep); position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.5); }
    .hero b { display: block; font-size: 22px; line-height: 1.3; letter-spacing: -0.02em; position: relative; z-index: 1; }
    .hero p { margin: 8px 0 16px; font-size: 14.5px; opacity: .95; position: relative; z-index: 1; }
    .hero a { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 18px; border-radius: 999px; background: var(--ssaka); color: #fff; font-weight: 800; text-decoration: none; }

    /* 어디야? 바로가기 */
    .inst { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
    .inst-box { width: 100%; max-width: 480px; background: #fff; border-radius: 24px 24px 0 0; padding: 26px 22px calc(22px + env(safe-area-inset-bottom)); }
    .inst-box img { width: 72px; height: 72px; border-radius: 18px; display: block; }
    .inst-box h2 { margin: 14px 0 6px; font-size: 22px; }
    .inst-box p { margin: 0 0 14px; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
    .inst-box ol { margin: 0 0 16px; padding-left: 20px; font-size: 16px; line-height: 1.8; }
    .inst-box .go { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: var(--ssaka); color: #fff; font: inherit; font-size: 17px; font-weight: 800; text-decoration: none; cursor: pointer; }
    .inst-box .later { display: block; width: 100%; min-height: 46px; margin-top: 8px; border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 15px; cursor: pointer; }
    .camp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 4px 18px 12px; }
    .camp a { position: relative; display: flex; flex-direction: column; min-height: 168px; padding: 16px 14px; border-radius: 20px; text-decoration: none; overflow: hidden; color: #1a1a1a; }
    .camp b { font-size: 17px; line-height: 1.3; letter-spacing: -0.02em; word-break: keep-all; }
    .camp span { margin-top: 6px; font-size: 15px; line-height: 1.4; opacity: .85; word-break: keep-all; }
    .camp i { position: absolute; right: 10px; bottom: 6px; font-style: normal; font-size: 52px; line-height: 1; }
    .camp a.dark { color: #fff; }
    .camp a:focus-visible, .svc button:focus-visible, .svc a:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 2px; }
    .svc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 4px; margin: 6px 14px 10px; padding: 18px 6px; background: #fff; border-radius: 22px; }
    .svc a, .svc button { position: relative; display: grid; justify-items: center; gap: 7px; padding: 4px 0; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: none; cursor: pointer; word-break: keep-all; text-align: center; line-height: 1.25; }
    .svc i { font-style: normal; width: 50px; height: 50px; border-radius: 17px; display: grid; place-items: center; font-size: 25px; background: var(--tint, var(--bg-2)); }
    .svc .soon i { filter: grayscale(.35); opacity: .75; }
    .svc em { position: absolute; top: -4px; right: 10%; font-style: normal; font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: var(--ssaka); color: #fff; }
    .svc-cap { margin: 2px 22px 0; font-size: 13.5px; color: var(--ink-2); }
    .eo-hero { position: relative; overflow: hidden; margin: 6px 18px 12px; padding: 13px 16px 11px; border-radius: 26px; background: linear-gradient(135deg, rgba(200,22,47,.18) 0%, rgba(100,8,22,.42) 100%), url(../img/eodiya-cherry3.jpg) center/cover, #8E0F22; color: #fff; box-shadow: 0 18px 36px -20px rgba(142,15,34,.9); text-shadow: 0 1px 4px rgba(0,0,0,.7); }
    .eo-hero .pin { position: absolute; right: 16px; top: 8px; width: 52px; height: 62px; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,.28)); }
    .eo-hero .pin-guy { display: block; transform-origin: 50% 100%; animation: pinDance 1.2s ease-in-out infinite; }
    .eo-hero .pin-guy .pg-eyes { transform-origin: 30px 23.5px; animation: pinBlink 3.6s infinite; }
    .eo-hero .pin .nt { position: absolute; font-style: normal; font-weight: 900; color: #FFE27A; font-size: 17px; opacity: 0; animation: noteUp 2.4s ease-out infinite; }
    .eo-hero .pin .n1 { left: -14px; top: 18px; } .eo-hero .pin .n2 { left: -6px; top: 2px; color: #fff; animation-delay: 1.2s; }
    @keyframes pinDance { 0%,100% { transform: translateY(0) rotate(-10deg); } 25% { transform: translateY(-7px) rotate(0deg) scale(1.04,.96); } 50% { transform: translateY(0) rotate(10deg); } 75% { transform: translateY(-7px) rotate(0deg) scale(1.04,.96); } }
    @keyframes pinBlink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    @keyframes noteUp { 0% { opacity: 0; transform: translate(0,6px) rotate(-10deg); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-12px,-22px) rotate(12deg); } }
    @media (prefers-reduced-motion: reduce) { .eo-hero .pin-guy, .eo-hero .pin-guy .pg-eyes, .eo-hero .pin .nt { animation: none; } }
    .eo-hero h2 { margin: 0; font-size: 38px; line-height: 1.05; font-weight: 900; letter-spacing: -0.04em; }
    .eo-hero p { margin: 4px 0 10px; line-height: 1.3; font-size: 17.5px; font-weight: 700; opacity: .95; word-break: keep-all; padding-right: 70px; }
    .eo-hero .eo-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .eo-hero .eo-btns a { display: grid; place-items: center; align-content: center; gap: 2px; min-height: 62px; padding: 5px 4px; border-radius: 16px; background: #fff; color: #8E0F22; font-size: 22px; font-weight: 900; text-decoration: none; letter-spacing: -0.03em; line-height: 1.15; text-align: center; }
    .eo-hero .eo-btns a small { display: block; font-size: 15.5px; font-weight: 800; color: #9a5a63; letter-spacing: 0; }
    .eo-hero .eo-btns a, .eo-hero .eo-btns a * { text-shadow: none; } /* 단추 글씨는 그림자 없이 또렷하게 */
    .eo-hero .eo-btns a.alt { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6); }
    .eo-hero .eo-btns a.alt small { color: rgba(255,255,255,.85); }
    .eo-hero .eo-btns.three { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .eo-hero .eo-btns.three a { padding: 5px 2px; white-space: nowrap; }
    .eo-hero .eo-btns a.play { background: #FFE27A; color: #5a3b00; }
    .eo-hero .eo-btns a.play small { color: #7a5a10; }
    .eo-hero a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .eo-hero .eo-btns a > span { white-space: nowrap; } .eo-hero .eo-btns a small { word-break: keep-all; line-height: 1.2; }
    @media (max-width: 380px) { .eo-hero { padding: 11px 12px 9px; } .eo-hero p { font-size: 16.5px; padding-right: 50px; } .eo-hero .eo-btns { gap: 8px; } .eo-hero .eo-btns a { font-size: 20px; letter-spacing: -0.04em; } .eo-hero .eo-btns a small { font-size: 15px; letter-spacing: -0.03em; } .eo-hero .eo-btns a.play img { width: 22px; height: 22px; vertical-align: -5px !important; } }
    .si-pad { padding: 0 18px; }
    .home-install-bottom{margin:18px 18px 28px;padding:14px;border:1px solid #f0d9dd;border-radius:20px;background:#fff8f9}.home-install-bottom .big{width:100%;min-height:54px;font-size:17px;font-weight:900;font-family:inherit;border:0;border-radius:16px;background:#B3132B;color:#fff;cursor:pointer;box-shadow:0 10px 22px -12px rgba(179,19,43,.9)}.home-install-bottom .big:active{transform:scale(.98)}
    .mk { position: relative; overflow: hidden; display: block; margin: 0 18px 20px; padding: 12px 16px 10px; border-radius: 26px; background: linear-gradient(100deg, #124A3B 0%, #17573F 30%, #2A7350 55%, #5C9A55 80%, #8DB85E 100%); color: #fff; text-decoration: none; box-shadow: 0 18px 36px -20px rgba(16,64,50,.85); -webkit-tap-highlight-color: transparent; }
    .mk:active { transform: scale(.985); }
    /* 백화점식 추천 카드 (사진 칸 + [이름] 설명) */
    .camp2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; padding: 4px 18px 14px; }
    .camp2 a { display: block; text-decoration: none; color: #1a1a1a; -webkit-tap-highlight-color: transparent; }
    .camp2 a:active .ph { transform: scale(.97); }
    .camp2 .ph { position: relative; display: grid; place-items: center; aspect-ratio: 1 / 1; border-radius: 18px; overflow: hidden; transition: transform .15s; box-shadow: 0 10px 22px -16px rgba(0,0,0,.6); }
    .camp2 .ph strong { position: relative; z-index: 1; padding: 0 8px; white-space: pre-line; text-align: center; color: #fff; font-size: 30px; line-height: 1.02; font-weight: 900; letter-spacing: -0.03em; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
    .camp2 .ph.pic { place-items: end start; }
    .camp2 .ph.pic strong { padding: 0 12px 12px; text-align: left; font-size: 27px; }
    .camp2 .ph i { position: absolute; right: 8px; bottom: 4px; font-style: normal; font-size: 34px; opacity: .9; }
    .camp2 b { display: block; margin-top: 8px; font-size: 16.5px; font-weight: 900; letter-spacing: -0.02em; }
    .camp2 .cap { display: block; margin-top: 1px; font-size: 15.5px; line-height: 1.35; color: #333; word-break: keep-all; }
    .camp2 a:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 3px; border-radius: 18px; }
    /* 첫눈 인사 칸: 파란 밤하늘 + 크리스마스트리 + 하얀 눈 내림 */
    .camp2 .ph.snow { place-items: start center; }
    .camp2 .ph.snow strong { padding-top: 8%; font-size: 26px; z-index: 3; }
    .camp2 .ph.snow .tree { position: absolute; left: 50%; bottom: 0; width: 54%; transform: translateX(-50%); z-index: 2; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
    .camp2 .ph.snow .tree .star { transform-origin: 50px 9px; animation: tstar 1.6s ease-in-out infinite; }
    .camp2 .ph.snow .tree .bl { animation: tblink 1.8s ease-in-out infinite; }
    .camp2 .ph.snow .tree .bl:nth-of-type(2n) { animation-delay: .6s; }
    .camp2 .ph.snow .tree .bl:nth-of-type(3n) { animation-delay: 1.2s; }
    .camp2 .ph.snow .ground { position: absolute; left: -10%; right: -10%; bottom: -14%; height: 26%; border-radius: 50%; background: #F4F8FF; z-index: 1; }
    .camp2 .ph.snow .fl { position: absolute; top: -10px; border-radius: 50%; background: #fff; z-index: 4; pointer-events: none; animation: tsnow linear infinite; }
    @keyframes tsnow { 0% { transform: translate(0,-10px); opacity: 0; } 10% { opacity: .95; } 50% { transform: translate(8px,90px); } 100% { transform: translate(-4px,200px); opacity: .9; } }
    @keyframes tstar { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.25); opacity: .75; } }
    @keyframes tblink { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { .camp2 .ph.snow .fl, .camp2 .ph.snow .tree * { animation: none; } }
    /* 오늘의 싸바 오른쪽 날씨 (백화점 영업시간 칸의 기온처럼) */
    .wr.today .tw { margin-left: auto; flex: none; display: grid; justify-items: end; line-height: 1; text-shadow: 0 0 2px rgba(0,0,0,.9), 0 2px 6px rgba(0,0,0,.8); }
    .wr.today .tw b { font-size: 34px; font-weight: 900; letter-spacing: -0.04em; }
    .wr.today .tw small { margin-top: 4px; font-size: 15px; font-weight: 800; }
    /* 오늘의 놀이터 — 앱스토어 투데이 카드처럼 */
    .tdy { display: block; margin: 4px 18px 14px; border-radius: 26px; overflow: hidden; text-decoration: none; color: #fff; box-shadow: 0 18px 36px -22px rgba(0,0,0,.7); -webkit-tap-highlight-color: transparent; }
    .tdy:active { transform: scale(.985); }

    .tdy .art h3 { margin: 2px 0 4px; font-size: 34px; line-height: 1.1; font-weight: 900; letter-spacing: -0.04em; text-shadow: 0 2px 8px rgba(0,0,0,.45); }
    .tdy .art p { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.35; text-shadow: 0 1px 5px rgba(0,0,0,.55); word-break: keep-all; }

    .tdy .bar i { display: grid; place-items: center; flex: none; width: 52px; height: 52px; border-radius: 14px; background: #fff; font-style: normal; font-size: 28px; box-shadow: 0 4px 10px rgba(0,0,0,.2); }

    .tdy .bar, .tdy .bar * { text-shadow: 0 1px 3px rgba(0,0,0,.35); }
    .tdy .bar i { text-shadow: none; }

<script>
(function () {
  var D = window.SsakaDesigns, S = window.SsakaStore;
  var $ = function (id) { return document.getElementById(id); };
  var TITLES = { home: '홈', alim: '싸바알림', blog: '싸바알림', inbox: '받은 카드', resv: '예약', more: '더보기' };
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2000); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function when(ts) {
    if (!ts) return '';
    var d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) {
      var h = d.getHours(), m = d.getMinutes();
      return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m;
    }
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return '어제';
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  function avatar(item) {
    var a = el('span', 'ava');
    var dz = item.design && D.get(item.design);
    if (dz) { a.style.background = dz.colors.accent; a.style.color = dz.colors.onAccent; }
    if (item.image) { var i = el('img'); i.src = item.image; i.alt = ''; i.loading = 'lazy'; a.appendChild(i); }
    else a.textContent = (item.title || '싸').trim().charAt(0);
    return a;
  }
  function cardRow(item, opts) {
    var r = el('a', 'row' + (opts && opts.me ? ' me' : ''));
    r.href = item.url;
    r.appendChild(avatar(item));
    var t = el('span', 'row-txt');
    t.appendChild(el('span', 'row-t', item.title || '이름 없는 카드'));
    t.appendChild(el('span', 'row-s', item.subtitle || (opts && opts.me ? '내 카드' : '')));
    r.appendChild(t);
    var right = el('span', 'row-r');
    if (opts && opts.share) {
      var dq = ''; try { dq = new URL(item.url).searchParams.get('d') || ''; } catch (e) {}
      if (dq) {
        var ed = el('button', 'row-act'); ed.type = 'button'; ed.setAttribute('aria-label', item.title + ' 수정하기');
        ed.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
        ed.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); location.href = '../make/?edit=' + encodeURIComponent(dq); });
        right.appendChild(ed);
      }
      var b = el('button', 'row-act'); b.type = 'button'; b.setAttribute('aria-label', item.title + ' 링크 복사');

  function homeWeather(box) {
    var c = null; try { c = JSON.parse(localStorage.getItem('sava-wx') || 'null'); } catch (e) {}
    if (!c || !c[1]) c = ['광주', 35.1595, 126.8526];
    function ic(n) { return n === 0 ? '☀️' : n <= 2 ? '🌤️' : n === 3 ? '☁️' : n <= 48 ? '🌫️' : n <= 67 ? '🌧️' : n <= 77 ? '❄️' : n <= 82 ? '🌦️' : n <= 86 ? '🌨️' : '⛈️'; }
    var key = 'sava-home-wx', cache = null; try { cache = JSON.parse(sessionStorage.getItem(key) || 'null'); } catch (e) {}
    function show(t, code) {
      if (box.classList.contains('wr')) {
        var em = box.querySelector('em'); if (em) em.remove();
        var tw = el('span', 'tw'); tw.innerHTML = '<b></b><small></small>';
        tw.querySelector('b').textContent = ic(code) + ' ' + Math.round(t) + '°'; tw.querySelector('small').textContent = c[0] + ' · 보기 ›';
        box.appendChild(tw); box.querySelector('i').textContent = ic(code); return;
      }
      var tx = box.querySelector('.tx'); if (!tx) return;
      var wx = el('span', 'wx'); wx.innerHTML = '<span></span><small></small>';
      wx.firstChild.textContent = ic(code) + ' ' + Math.round(t) + '°'; wx.querySelector('small').textContent = c[0];
      tx.appendChild(wx);
      var bi = box.querySelector('.bar i'); if (bi) bi.textContent = ic(code);
      var bs = box.querySelector('.bar small'); if (bs) bs.textContent = c[0] + ' ' + Math.round(t) + '°';
    }
    if (cache && cache.city === c[0] && Date.now() - cache.at < 30 * 60e3) return show(cache.t, cache.code);
    if (!window.fetch) return;
    fetch('https://api.open-meteo.com/v1/forecast?latitude=' + c[1] + '&longitude=' + c[2] + '&current=temperature_2m,weather_code&timezone=Asia%2FSeoul')
      .then(function (r) { return r.json(); })
      .then(function (w) { var t = w.current.temperature_2m, code = w.current.weather_code; try { sessionStorage.setItem(key, JSON.stringify({ city: c[0], t: t, code: code, at: Date.now() })); } catch (e) {} show(t, code); })
      .catch(function () {});
  }

    var m = el('div', 'more');

    [['🗂️ 내 작업 관리', '/app/manage/', '카드·블로그 글'], ['💌 받은 카드', '#inbox', nNew ? '새 카드 ' + nNew : (nIn ? nIn + '장' : '')], ['📅 내 예약', '#resv', nRv ? nRv + '건' : ''], ['🛒 내 주문', '/app/orders/', '김치 등 상품']].forEach(function (x) {

        // 김치 주문 관리 (관리자만 내용이 보임)
        var od = el('a', ''); od.href = '/app/orders/?admin=1'; od.appendChild(document.createTextNode('🥬 주문 관리')); od.appendChild(el('span', '', '관리자'));
        var ad = el('a', ''); ad.href = '/admin/'; ad.appendChild(document.createTextNode('🔑 싸바 관리자 화면')); ad.appendChild(el('span', '', '대표 전용'));

    }).catch(function () {});
    [['💡 의견 보내기 · 채택되면 7,000원 쿠폰', '../idea/', '순천만'], ['만들기 화면', '../make/', '새 카드'], ['카드 예시 보기', '../demo/?card=actor', '샘플'], ['싸바 이야기', '../?story=1', '싸바 소개'], ['개인정보처리방침', '../privacy/', ''], ['이용약관', '../terms/', '']].forEach(function (x) {

  function refreshDots() {
    var tab = document.querySelector('.tab[data-v="more"]');
    var dot = tab.querySelector('.dot');

    if (n && !dot) { dot = el('span', 'dot'); dot.setAttribute('aria-label', '새 카드 ' + n + '개'); tab.appendChild(dot); }
    if (!n && dot) dot.remove();

  function show(name) {
    document.querySelectorAll('.view').forEach(function (x) { x.hidden = x.id !== 'v-' + (name === 'blog' ? 'alim' : name); });
    // 홈 와인 바탕(13번)은 대표님이 '체리색 바탕은 아니네' 해서 꺼 둠 (11-21) — CSS html.home-wine 는 남겨 둠
    document.documentElement.classList.remove('home-wine');
    document.documentElement.classList.toggle('home-apricot', name === 'home');
    document.querySelectorAll('.tab[data-v]').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.v === (name === 'inbox' || name === 'resv' ? 'more' : name === 'blog' ? 'alim' : name) ? 'true' : 'false'); });
    document.querySelector('.top h1').textContent = TITLES[name];
    ({ home: renderHome, alim: renderAlim, blog: function () { alimTab = 'blog'; renderAlim(); }, inbox: renderInbox, resv: renderResv, more: renderMore })[name]();

    window.scrollTo(0, 0);
  }
  function renderAll() { show(current); refreshDots(); }
  document.querySelectorAll('.tab[data-v]').forEach(function (t) { t.addEventListener('click', function () { current = t.dataset.v; show(current); }); });
  var wantInstall = /[?&]install=1/.test(location.search);
  var current = (location.hash || '').slice(1);
  if (!TITLES[current]) current = 'home';
  renderAll();

  // 🔄 업데이트 (홈 위쪽 늘 보이게, 새 버전이 있으면 빨갛게 '새 버전!')
  (function () {
    var b = document.getElementById('updBtn'); if (!b) return;
    b.addEventListener('click', function () { toast('최신 버전을 불러와요…'); if (window.SsakaInstall) SsakaInstall.update(); else location.reload(); });

      fetch('/version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
        var cur = window.SsakaInstall && SsakaInstall.version;
        var isNew = j && j.v && cur && j.v !== cur;

      }).catch(function () {});
    }
    check(); document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  })();
  // 로그인했으면: 다른 폰에서 만든 내 카드도 목록에 가져오기
  fetch('/api/card?mine=1', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.items && S.mergeMine && S.mergeMine(j.items) && (current === 'home' || current === 'alim')) renderAll();
  }).catch(function () {});
  // 화면 안의 #alim 같은 링크로도 화면 바꾸기
  window.addEventListener('hashchange', function () { var h = (location.hash || '').slice(1); if (TITLES[h] && h !== current) { current = h; show(current); } });

  // ---------- 싸바카드 설치하기 (홈 화면에 추가) ----------
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; var b = document.getElementById('instGo'); if (b) b.textContent = '📲 지금 설치하기'; });
  function installSheet() {
    if (window.SsakaInstall) return SsakaInstall.open();
    var ua = navigator.userAgent, inKakao = /KAKAOTALK/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
    var standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    var w = el('div', 'inst'); w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-label', '싸바카드 설치하기');

    } else if (inKakao) {
      b.appendChild(el('p', '', '카톡 안에서는 홈 화면에 추가할 수 없어요. 아래 버튼으로 ' + (ios ? '사파리' : '크롬') + '에서 연 뒤 설치하세요.'));

    } else if (ios) {
