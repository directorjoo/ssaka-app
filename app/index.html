  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    .shell { max-width: 560px; margin: 0 auto; }

    /* 상단 */
    .top { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .top-in { display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 18px; padding-top: env(safe-area-inset-top); }
    .top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo svg { width: 30px; height: 30px; }
    .top-act { display: flex; gap: 4px; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; cursor: pointer; text-decoration: none; }
    .icon-btn svg, .tab svg, .row-act svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* 화면 */
    .view[hidden] { display: none; }
    .sec { padding: 6px 0 4px; }
    .sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 8px; }
    .sec-h h2 { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
    .sec-h a, .sec-h button { font-size: 13.5px; color: var(--ssaka-deep); text-decoration: none; border: 0; background: none; cursor: pointer; font-weight: 700; padding: 6px 0; }
    .divider { height: 8px; background: var(--bg-2); margin: 6px 0; }

    /* 목록 행 (카톡 친구/채팅 목록처럼) */
    .row { display: flex; align-items: center; gap: 14px; padding: 10px 18px; text-decoration: none; min-height: 72px; }
    .row:active { background: var(--bg-2); }
    .ava { flex: none; width: 50px; height: 50px; border-radius: 19px; overflow: hidden; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; background: var(--ssaka); }
    .ava img { width: 100%; height: 100%; object-fit: cover; }
    .row.me { padding-top: 14px; padding-bottom: 14px; }
    .row.me .ava { width: 64px; height: 64px; border-radius: 24px; font-size: 26px; }
    .row-txt { min-width: 0; flex: 1; display: grid; gap: 3px; }
    .row-t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.me .row-t { font-size: 18px; }
    .row-s { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-r { flex: none; display: grid; justify-items: end; gap: 6px; font-size: 12px; color: var(--ink-2); }
    .new { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ssaka); color: #fff; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; }
    .row-r { display: flex; gap: 6px; align-items: center; }
    .row-act { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: var(--ssaka-soft); color: var(--ssaka-deep); border-radius: 12px; cursor: pointer; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--bg-2); color: var(--ink-2); }
    .tag.ok { background: var(--ssaka-soft); color: var(--ssaka-deep); }
    .tag.off { text-decoration: line-through; }

    /* 첫 화면 안내 */
    .hero { margin: 8px 18px 6px; padding: 20px 20px 18px; border-radius: 22px; background: var(--ssaka-soft); color: var(--ssaka-deep); position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.5); }
    .hero b { display: block; font-size: 22px; line-height: 1.3; letter-spacing: -0.02em; position: relative; z-index: 1; }
    .hero p { margin: 8px 0 16px; font-size: 14.5px; opacity: .95; position: relative; z-index: 1; }
    .hero a { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 18px; border-radius: 999px; background: var(--ssaka); color: #fff; font-weight: 800; text-decoration: none; }

    /* 어디야? 바로가기 */
    .inst { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; justify-content: center; }
    .inst-box { width: 100%; max-width: 480px; background: #fff; border-radius: 24px 24px 0 0; padding: 26px 22px calc(22px + env(safe-area-inset-bottom)); }
    .inst-box img { width: 72px; height: 72px; border-radius: 18px; display: block; }
    .inst-box h2 { margin: 14px 0 6px; font-size: 22px; }
    .inst-box p { margin: 0 0 14px; color: var(--ink-2); font-size: 15px; line-height: 1.55; }
    .inst-box ol { margin: 0 0 16px; padding-left: 20px; font-size: 16px; line-height: 1.8; }
    .inst-box .go { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 54px; border: 0; border-radius: 14px; background: var(--ssaka); color: #fff; font: inherit; font-size: 17px; font-weight: 800; text-decoration: none; cursor: pointer; }
    .inst-box .later { display: block; width: 100%; min-height: 46px; margin-top: 8px; border: 0; background: none; color: var(--ink-2); font: inherit; font-size: 15px; cursor: pointer; }
    .camp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; padding: 4px 18px 12px; }
    .camp a { position: relative; display: flex; flex-direction: column; min-height: 168px; padding: 16px 14px; border-radius: 20px; text-decoration: none; overflow: hidden; color: #1a1a1a; }
    .camp b { font-size: 17px; line-height: 1.3; letter-spacing: -0.02em; word-break: keep-all; }
    .camp span { margin-top: 6px; font-size: 13px; line-height: 1.4; opacity: .85; word-break: keep-all; }
    .camp i { position: absolute; right: 10px; bottom: 6px; font-style: normal; font-size: 52px; line-height: 1; }
    .camp a.dark { color: #fff; }
    .camp a:focus-visible, .svc button:focus-visible, .svc a:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 2px; }
    .svc { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 4px; margin: 6px 14px 10px; padding: 18px 6px; background: #fff; border-radius: 22px; }
    .svc a, .svc button { position: relative; display: grid; justify-items: center; gap: 7px; padding: 4px 0; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 700; color: var(--ink); text-decoration: none; cursor: pointer; word-break: keep-all; text-align: center; line-height: 1.25; }
    .svc i { font-style: normal; width: 50px; height: 50px; border-radius: 17px; display: grid; place-items: center; font-size: 25px; background: var(--tint, var(--bg-2)); }
    .svc .soon i { filter: grayscale(.35); opacity: .75; }
    .svc em { position: absolute; top: -4px; right: 10%; font-style: normal; font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: var(--ssaka); color: #fff; }
    .svc-cap { margin: 2px 22px 0; font-size: 13.5px; color: var(--ink-2); }
    .eo-hero { position: relative; overflow: hidden; margin: 6px 18px 12px; padding: 22px 20px 18px; border-radius: 26px; background: linear-gradient(135deg, #C8162F 0%, #8E0F22 100%); color: #fff; box-shadow: 0 18px 36px -20px rgba(142,15,34,.9); }
    .eo-hero .pin { position: absolute; right: 14px; top: 10px; font-size: 58px; line-height: 1; filter: drop-shadow(0 8px 10px rgba(0,0,0,.25)); }
    .eo-hero h2 { margin: 0; font-size: 34px; line-height: 1.05; font-weight: 900; letter-spacing: -0.04em; }
    .eo-hero p { margin: 8px 0 16px; font-size: 15px; opacity: .95; word-break: keep-all; padding-right: 70px; }
    .eo-hero .eo-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .eo-hero .eo-btns a { display: grid; place-items: center; align-content: center; gap: 4px; min-height: 86px; padding: 8px 4px; border-radius: 18px; background: #fff; color: #8E0F22; font-size: 18px; font-weight: 900; text-decoration: none; letter-spacing: -0.02em; line-height: 1.15; text-align: center; }
    .eo-hero .eo-btns a small { display: block; font-size: 12px; font-weight: 700; color: #9a5a63; letter-spacing: 0; }
    .eo-hero .eo-btns a.alt { background: rgba(255,255,255,.16); color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6); }
    .eo-hero .eo-btns a.alt small { color: rgba(255,255,255,.85); }
    .eo-hero .eo-btns a.play { background: #FFE27A; color: #5a3b00; }
    .eo-hero .eo-btns a.play small { color: #7a5a10; }
    .eo-hero a:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .si-pad { padding: 0 18px; }
    .home-install-bottom{margin:18px 18px 28px;padding:14px;border:1px solid #f0d9dd;border-radius:20px;background:#fff8f9}.home-install-bottom .big{width:100%;min-height:54px;font-size:17px;font-weight:900;font-family:inherit;border:0;border-radius:16px;background:#B3132B;color:#fff;cursor:pointer;box-shadow:0 10px 22px -12px rgba(179,19,43,.9)}.home-install-bottom .big:active{transform:scale(.98)}
    .mk { position: relative; overflow: hidden; display: block; margin: 0 18px 12px; padding: 12px 16px 10px; border-radius: 26px; background: linear-gradient(135deg, #2F7A62 0%, #155040 100%); color: #fff; text-decoration: none; box-shadow: 0 18px 36px -20px rgba(16,64,50,.85); -webkit-tap-highlight-color: transparent; }
    .mk:active { transform: scale(.985); }
    .wr { display: flex; align-items: center; gap: 12px; margin: 0 18px 12px; padding: 14px 16px; border-radius: 22px; background: linear-gradient(135deg, #2E5FA8, #1B3F7A); color: #fff; text-decoration: none; box-shadow: 0 14px 30px -20px rgba(20,50,110,.9); -webkit-tap-highlight-color: transparent; }
    .wr:active { transform: scale(.985); }
    .wr i { font-style: normal; font-size: 34px; line-height: 1; }
    .wr b { display: block; font-size: 19px; font-weight: 900; letter-spacing: -.03em; }
    .wr span { display: block; font-size: 13px; opacity: .88; margin-top: 3px; line-height: 1.4; word-break: keep-all; }
    .wr em { margin-left: auto; font-style: normal; flex: none; padding: 9px 12px; border-radius: 14px; background: #fff; color: #1B3F7A; font-size: 14px; font-weight: 900; }
    .mk p small { display: block; margin-top: 2px; font-size: 16px; line-height: 1.15; font-weight: 900; opacity: 1; }
    .mk .kk { font-size: 12px; font-weight: 800; letter-spacing: .14em; opacity: .85; }
    .mk h2 { color: #F4E7C8; margin: 0; font-size: 30px; line-height: 1.05; font-weight: 900; letter-spacing: -0.04em; }
    .mk p { margin: 5px 0 9px; font-size: 13px; line-height: 1.3; font-weight: 750; opacity: .98; word-break: keep-all; padding-right: 118px; }
    .mk-main { display: block; color: inherit; text-decoration: none; }
    .mk-main:active { opacity: .92; }
    .mk .ad { position: absolute; right: 8px; top: 6px; width: 126px; height: 145px; pointer-events: none; }
    .mk .mini { position: absolute; left: 16px; top: 5px; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 96px; height: 96px; border-radius: 16px; overflow: hidden; background: #3a1a12 url(../img/gatkimchi-sign.jpg) center/cover no-repeat; border: 3px solid #fff; color: #fff; text-decoration: none; box-shadow: 0 10px 22px rgba(0,0,0,.35); padding: 4px; pointer-events: auto; transform-origin: 50% 120%; animation: mkWave 1.6s ease-in-out infinite; }
    .mk .mini::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(40,0,6,.5) 0%, rgba(40,0,6,.15) 75%); z-index: 0; }
    .mk .dance { position: absolute; left: 150px; right: auto; top: 4px; bottom: auto; z-index: 1; width: 60px; height: 54px; transform: none; animation: none; pointer-events: none; }
    @keyframes mkWave { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
    @keyframes mkHop { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(5deg); } }
    @media (prefers-reduced-motion: reduce) { .mk .mini, .mk .dance { animation: none; } }
    .mk .mini::before { display: none; }
    @font-face { font-family: 'SavaSign'; src: url(../fonts/black-han-sans-0.woff2) format('woff2'); unicode-range: U+AE40,U+C5B8,U+D2B9; font-display: swap; }
    @font-face { font-family: 'SavaSign'; src: url(../fonts/black-han-sans-1.woff2) format('woff2'); unicode-range: U+D310; font-display: swap; }
    @font-face { font-family: 'SavaSign'; src: url(../fonts/black-han-sans-2.woff2) format('woff2'); unicode-range: U+B2C8,U+CE58; font-display: swap; }
    .mk .mini .w { position: relative; z-index: 1; display: block; width: 100%; text-align: center; margin-top: 0; font-family: 'SavaSign', var(--font, sans-serif); font-size: 25px; font-weight: 400; color: #fff; -webkit-text-stroke: .6px rgba(90,0,12,.6); text-shadow: 0 2px 6px rgba(0,0,0,.75), 0 0 2px rgba(0,0,0,.9); letter-spacing: -.02em; line-height: 1.12; word-break: keep-all; }
    .mk .mini .w.long { font-size: 14px; }
    .mk .mini .w .w1 { display: block; font-size: 21px; white-space: nowrap; }
    .mk .mini .w .w2 { display: block; font-size: 25px; color: #B3132B; -webkit-text-stroke: 0; text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff, 0 -2px 0 #fff, 0 2px 0 #fff, -2px 0 0 #fff, 2px 0 0 #fff, 0 3px 8px rgba(0,0,0,.6); margin-top: 2px; }
    .mk .kinds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 10px; }
    .mk .kinds a { display: grid; place-items: center; min-height: 46px; border-radius: 14px; background: rgba(255,255,255,.16); color: #fff; text-decoration: none; font-size: 14px; font-weight: 800; line-height: 1.15; text-align: center; }
    .mk .go-row { position: relative; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .mk .go { display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 40px; padding: 4px 3px; border-radius: 15px; background: #EBD9B0; color: #123F33; font-size: 18px; line-height: 1.1; font-weight: 900; text-decoration: none; letter-spacing: -0.04em; text-align: center; white-space: nowrap; }
    .mk .go .pencil { display: inline-flex; align-items: center; justify-content: center; width: 25px; height: 25px; flex: none; animation: pencilRun .8s ease-in-out infinite; } .mk .go .pencil svg { display: block; width: 25px; height: 25px; }
    .mk .go .cart { display: inline-block; font-size: 20px; filter: brightness(.48) saturate(1.55) contrast(1.2); transform-origin: 50% 80%; animation: cartRun .65s ease-in-out infinite; }
    @keyframes pencilRun { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes cartRun { 0%,100% { transform: translateX(0) rotate(-5deg); } 50% { transform: translateX(3px) rotate(5deg); } }
    @media (max-width: 360px) {
      .mk { padding: 10px 12px 9px; }
      .mk h2 { font-size: 27px; }
      .mk p { font-size: 12px; padding-right: 108px; }
      .mk p small { font-size: 15px; }
      .mk .mini { width: 88px; height: 88px; left: 20px; } .mk .mini .w .w1 { font-size: 19px; } .mk .mini .w .w2 { font-size: 23px; }
      .mk .dance { left: 134px; right: auto; top: 2px; width: 56px; height: 50px; transform: none; }
      .mk .go { font-size: 16px; }
    }
    .story { margin: 0 18px 12px; padding: 16px 16px 14px; border-radius: 22px; background: #FFF7E6; box-shadow: inset 0 0 0 1.5px #F3D9A4; }
    .story .st-top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .story .st-top img { width: 46px; height: 46px; flex: none; }
    .story .st-top b { display: block; font-size: 20px; font-weight: 900; letter-spacing: -0.03em; color: #3a2a00; }
    .story .st-top span { font-size: 13.5px; color: #7a6230; word-break: keep-all; }
    .story .st-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .story .st-btns a, .story .st-btns button { display: grid; place-items: center; min-height: 54px; border: 0; border-radius: 15px; font: inherit; font-size: 16.5px; font-weight: 900; text-decoration: none; cursor: pointer; letter-spacing: -0.02em; }
    .story .st-btns a { background: #B3132B; color: #fff; }
    .story .st-btns button { background: #FEE500; color: #3a1d1d; }
    .play-h { margin: 6px 22px 8px; font-size: 15.5px; font-weight: 900; letter-spacing: -0.02em; color: var(--ssaka-deep, #8E0A1C); }
    .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 0 18px 14px; }
    .tile { display: grid; justify-items: center; align-content: center; gap: 3px; min-height: 98px; padding: 10px 4px; border-radius: 20px; text-decoration: none; text-align: center; }
    .tile i { font-style: normal; font-size: 30px; line-height: 1.1; font-weight: 900; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; }
    .tile i u { text-decoration: none; color: inherit; opacity: .8; }
    .tile b { font-size: 14.5px; font-weight: 900; letter-spacing: -0.03em; }
    .tile span { font-size: 11.5px; font-weight: 700; opacity: .8; }
    .tile.t1 { background: #B3132B; color: #fff; box-shadow: none; }
    .tile.t1 i { font-size: 24px; }
    .tile.t2 { background: #FFD84D; color: #1A1A1A; box-shadow: inset 0 0 0 2px #1A1A1A; }
    .tile.t5 { grid-column: 1 / -1; grid-template-columns: 64px 1fr; justify-items: start; text-align: left; column-gap: 12px; background: #FFF1F3; color: #8a0f22; box-shadow: inset 0 0 0 2px #F7C6CF; }
    .tile.t5 img { grid-row: span 2; border-radius: 12px; }
    .tile.t5 b { font-size: 16.5px; align-self: end; }
    .tile.t5 span { align-self: start; }
    .tile.t4 { background: #1F5FAF; color: #fff; box-shadow: inset 0 0 0 3px #5A3420; }
    .tile.t3 { background: #fff; color: #B3132B; box-shadow: inset 0 0 0 2px #B3132B; }
    .eodiya { display: flex; align-items: center; gap: 14px; margin: 10px 18px 4px; padding: 16px; border-radius: 20px; background: var(--ssaka-soft); text-decoration: none; }
    .eodiya i { font-style: normal; width: 52px; height: 52px; border-radius: 18px; background: var(--ssaka); display: grid; place-items: center; font-size: 26px; flex: none; }
    .eodiya b { display: block; font-size: 19px; color: var(--ssaka-deep); letter-spacing: -0.02em; }
    .eodiya span { font-size: 13.5px; color: var(--ink-2); }
    .eodiya:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 2px; }

    /* 업종 바로가기 */
    .grp { margin: 14px 22px 2px; font-size: 15.5px; font-weight: 900; letter-spacing: -0.02em; color: var(--ssaka-deep, #8E0A1C); }
    .inds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 6px; padding: 4px 12px 10px; }
    .ind { display: grid; justify-items: center; gap: 6px; padding: 10px 2px; border-radius: 14px; text-decoration: none; font-size: 15px; font-weight: 700; line-height: 1.25; color: var(--text, #1a1a1a); text-align: center; word-break: keep-all; }
    .ind:active { background: var(--bg-2); }
    .ind { position: relative; font-size: 14px; }
    .ind.soon i { filter: saturate(.55); opacity: .7; }
    .ind.soon { color: var(--ink-2); }
    .ind em { position: absolute; top: 2px; right: 6%; font-style: normal; font-size: 10.5px; font-weight: 800; padding: 1px 6px; border-radius: 999px; background: #3B4250; color: #fff; }
    .grp small { margin-left: 4px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
    .ind i { font-style: normal; width: 56px; height: 56px; border-radius: 20px; background: var(--tint, var(--bg-2)); display: grid; place-items: center; font-size: 28px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.06); }

    .empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }

<script>
(function () {
  var D = window.SsakaDesigns, S = window.SsakaStore;

  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2000); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function when(ts) {
    if (!ts) return '';
    var d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) {
      var h = d.getHours(), m = d.getMinutes();
      return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m;
    }
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return '어제';
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  function avatar(item) {
    var a = el('span', 'ava');

    else a.textContent = (item.title || '싸').trim().charAt(0);
    return a;
  }
  function cardRow(item, opts) {
    var r = el('a', 'row' + (opts && opts.me ? ' me' : ''));

    r.appendChild(avatar(item));
    var t = el('span', 'row-txt');
    t.appendChild(el('span', 'row-t', item.title || '이름 없는 카드'));

    r.appendChild(t);
    var right = el('span', 'row-r');
    if (opts && opts.share) {
      var dq = ''; try { dq = new URL(item.url).searchParams.get('d') || ''; } catch (e) {}
      if (dq) {
        var ed = el('button', 'row-act'); ed.type = 'button'; ed.setAttribute('aria-label', item.title + ' 수정하기');
        ed.innerHTML = '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>';
        ed.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); location.href = '../make/?edit=' + encodeURIComponent(dq); });
        right.appendChild(ed);
      }
      var b = el('button', 'row-act'); b.type = 'button'; b.setAttribute('aria-label', item.title + ' 링크 복사');
      b.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
      b.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        (navigator.clipboard ? navigator.clipboard.writeText(item.url) : Promise.reject()).then(function () { toast('링크를 복사했어요'); }, function () { prompt('링크를 복사하세요', item.url); });
      });
      right.appendChild(b);
    } else {
      right.appendChild(el('span', '', when(item.at)));
      if (item.unread) right.appendChild(el('span', 'new', 'N'));
    }
    r.appendChild(right);
    return r;
  }
  function secHead(title, link) {
    var h = el('div', 'sec-h'); h.appendChild(el('h2', '', title));

  function empty(title, text, cta) {
    var e = el('div', 'empty'); e.appendChild(el('b', '', title)); e.appendChild(document.createTextNode(text));
    if (cta) { e.appendChild(document.createElement('br')); var a = el('a', '', cta.text); a.href = cta.href; e.appendChild(a); }
    return e;
  }

  // ---------- 시즌 캠페인 (날짜에 맞춰 바뀜) ----------
  function campaigns() {
    var now = new Date(), m = now.getMonth() + 1, d = now.getDate();
    var all = [
      { from: [11, 1], to: [12, 31], t: '첫눈 오면 보내는 카드', s: '눈 내리는 인사 카드', e: '❄️', bg: '#E2EEFB', href: '../make/?ind=greeting&season=snow' },
      { from: [11, 10], to: [12, 31], t: '송년회 공지, 카드 한 장으로', s: '장소 · 회비 · 참석·불참 답장까지', e: '🥂', bg: '#FFE0E6', href: '../make/?ind=party&season=yearend' },
      { from: [11, 15], to: [1, 31], t: '겨울방학 특강 모집', s: '학부모 단톡·인스타에 바로', e: '📚', bg: '#FFF3B8', href: '../make/?ind=academy&season=snow' },
      { from: [12, 1], to: [12, 26], t: '크리스마스 카드', s: '연인 · 가족 · 단골손님께', e: '🎄', bg: '#1f4d3a', dark: true, href: '../make/?ind=greeting&season=xmas' },
      { from: [12, 15], to: [2, 10], t: '새해 인사 미리 만들기', s: '신년회 초대도 함께', e: '🎉', bg: '#FFEFD1', href: '../make/?ind=greeting&season=newyear' },
      { from: [1, 10], to: [2, 10], t: '설 연휴, 엄마 나 도착했어', s: '어디야?로 한 번에', e: '🚗', bg: '#FBE9EC', href: '../eodiya/' }
    ];
    function key(md) { return md[0] * 100 + md[1]; }
    var today = m * 100 + d;
    all = all.filter(function (c) { var mi = /ind=([a-z]+)/.exec(c.href); return !mi || !D.isOpen || D.isOpen(mi[1]); });
    var on = all.filter(function (c) {
      var a = key(c.from), b = key(c.to);
      return a <= b ? (today >= a && today <= b) : (today >= a || today <= b);
    });
    if (on.length < 2) on = all.slice(0, 4);
    var g = el('div', 'camp');
    on.slice(0, 4).forEach(function (c) {
      var a = el('a', c.dark ? 'dark' : ''); a.href = c.href; a.style.background = c.bg;
      a.appendChild(el('b', '', c.t)); a.appendChild(el('span', '', c.s));
      var i = el('i', '', c.e); i.setAttribute('aria-hidden', 'true'); a.appendChild(i);
      g.appendChild(a);
    });
    return g;
  }

  // ---------- 업종별로 바로 만들기 (싸바알림 화면) ----------
  // 업종마다 또렷이 구분되는 파스텔 바탕 (이모지가 잘 보이도록 밝게)
  var TINT = { actor: '#FFE8B8', director: '#E9DDFB', freelancer: '#DDF1FF', sales: '#E3E8F0', realty: '#E4F5DC', restaurant: '#FFE1CF',
    cafe: '#F1E2D3', beauty: '#FBDCEB', toefl: '#D7ECFF', bigacademy: '#DDE3FF', academy: '#FFF3B8', entrance: '#FFD9D9', tutor: '#E2F7EE',
    arts: '#FDE2F7', fitness: '#D9F5E6', flower: '#FFE4EC', stay: '#D5F3F5', club: '#E1F0D5', alumni: '#EDE4FF', party: '#FFE0E6',
    greeting: '#E2EEFB', event: '#FFEFD1', kid: '#FFF5C7', senior: '#E6EEE0' };
  function indTile(ind) {
    var open = isOpen(ind.id);
    var a = el('a', 'ind' + (open ? '' : ' soon')); a.href = '../make/?ind=' + ind.id;
    if (TINT[ind.id]) a.style.setProperty('--tint', TINT[ind.id]);
    a.appendChild(el('i', '', ind.emoji)); a.appendChild(document.createTextNode(ind.label));

    a.addEventListener('click', function (e) { e.preventDefault(); howSheet(ind.id); });
    return a;
  }
  // 업종별로 바로 만들기 — 27개 업종을 모두 보여 줌 (아직 안 연 업종은 '준비 중')
  function industries(v) {
    var ORDER = ['meet', 'shop', 'edu', 'pro'];
    var all = (D.ALL_GROUPS || D.GROUPS || []).slice().sort(function (a, b) { return ORDER.indexOf(a.id) - ORDER.indexOf(b.id); });

      v.appendChild(g);

  }
  function isOpen(id) { return !D.isOpen || D.isOpen(id); }
  function soon(label) { toast(label + ' 카드는 곧 열려요! 지금은 모임·행사·안부와 음식점 카드를 만들 수 있어요'); }

  // ---------- 어떻게 만들까요? (아래에서 올라오는 창) ----------
  function howSheet(id) {
    var ind = D.industry(id); if (!ind) return;
    if (!isOpen(id)) return soon(ind.label);
    var w = el('div', 'inst'); w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-label', '어떻게 만들까요');
    var b = el('div', 'inst-box');

    b.appendChild(el('p', '', '어떻게 만들까요?'));
    var base = '../make/?ind=' + id;
    [['main', '⚡', '바로 만들기', '몇 칸만 채우면 카드가 완성돼요', base],
     ['', '🎨', '디자인 먼저 고르기', ind.label + ' 디자인 중에서 골라요', base + '#gallery'],

      var a = el('a', 'al-opt' + (o[0] ? ' ' + o[0] : '')); a.href = o[4];
      a.innerHTML = '<i aria-hidden="true">' + o[1] + '</i><div><b>' + o[2] + '</b><span>' + o[3] + '</span></div>';
      b.appendChild(a);
    });
    var later = el('button', 'later', '닫기'); later.type = 'button'; b.appendChild(later);
    function shut() { w.remove(); }
    later.addEventListener('click', shut);
    w.addEventListener('click', function (e) { if (e.target === w) shut(); });
    w.appendChild(b); document.body.appendChild(w);
    later.focus();
  }

  // ---------- 싸바알림 (만들기) ----------
  // 찾기 칸에 쓰는 말 → 업종
  var WORDS = { restaurant: '식당 가게 메뉴 메뉴판 음식 맛집 예약 홍보 오픈', cafe: '카페 커피 빵 베이커리', party: '송년 신년 회식 모임 연말', club: '산악 등산 동호회 모임 공지 산행',
    alumni: '동창 동문 향우 동기', event: '행사 초대 초대장 결혼 돌잔치 개업 생일', greeting: '인사 새해 연말 첫눈 크리스마스 설 추석 안부', actor: '프로필 배우 모델 오디션',
    director: '감독 크리에이터 유튜버', beauty: '미용 네일 헤어', toefl: '토플 어학원 영어', academy: '학원 보습 내신', fitness: '헬스 필라테스 운동', flower: '꽃 공방', stay: '숙박 펜션' };
  function renderAlim() {

  function show(name) {
    document.querySelectorAll('.view').forEach(function (x) { x.hidden = x.id !== 'v-' + name; });
    document.querySelectorAll('.tab[data-v]').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.v === (name === 'inbox' || name === 'resv' ? 'more' : name) ? 'true' : 'false'); });
    document.querySelector('.top h1').textContent = TITLES[name];
    ({ home: renderHome, alim: renderAlim, inbox: renderInbox, resv: renderResv, more: renderMore })[name]();
    try { history.replaceState(null, '', name === 'home' ? location.pathname : '#' + name); } catch (e) {}
    window.scrollTo(0, 0);
  }
  function renderAll() { show(current); refreshDots(); }
  document.querySelectorAll('.tab[data-v]').forEach(function (t) { t.addEventListener('click', function () { current = t.dataset.v; show(current); }); });
  var wantInstall = /[?&]install=1/.test(location.search);
  var current = (location.hash || '').slice(1);
  if (!TITLES[current]) current = 'home';
  renderAll();

  // 🔄 업데이트 (홈 위쪽 늘 보이게, 새 버전이 있으면 빨갛게 '새 버전!')
  (function () {
    var b = document.getElementById('updBtn'); if (!b) return;
    b.addEventListener('click', function () { toast('최신 버전을 불러와요…'); if (window.SsakaInstall) SsakaInstall.update(); else location.reload(); });
    function check() {
      fetch('/version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
        var cur = window.SsakaInstall && SsakaInstall.version;
        var isNew = j && j.v && cur && j.v !== cur;
        b.hidden = false; b.classList.toggle('new', !!isNew); b.textContent = isNew ? '🔄 새 버전!' : '🔄 최신버전';
      }).catch(function () {});
    }
    check(); document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
  })();
  // 로그인했으면: 다른 폰에서 만든 내 카드도 목록에 가져오기
  fetch('/api/card?mine=1', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (j && j.items && S.mergeMine && S.mergeMine(j.items) && (current === 'home' || current === 'alim')) renderAll();
  }).catch(function () {});
  // 화면 안의 #alim 같은 링크로도 화면 바꾸기
  window.addEventListener('hashchange', function () { var h = (location.hash || '').slice(1); if (TITLES[h] && h !== current) { current = h; show(current); } });

  // ---------- 싸바카드 설치하기 (홈 화면에 추가) ----------
  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; var b = document.getElementById('instGo'); if (b) b.textContent = '📲 지금 설치하기'; });
  function installSheet() {
    if (window.SsakaInstall) return SsakaInstall.open();
    var ua = navigator.userAgent, inKakao = /KAKAOTALK/i.test(ua), ios = /iPhone|iPad|iPod/i.test(ua);
    var standalone = window.matchMedia && matchMedia('(display-mode: standalone)').matches || navigator.standalone;
    var w = el('div', 'inst'); w.setAttribute('role', 'dialog'); w.setAttribute('aria-modal', 'true'); w.setAttribute('aria-label', '싸바카드 설치하기');
    var b = el('div', 'inst-box');
    var ic = el('img'); ic.src = '../img/icon-192.png'; ic.alt = ''; b.appendChild(ic);
    b.appendChild(el('h2', '', standalone ? '이미 설치되어 있어요 🍒' : '싸바카드 설치하기'));
    if (standalone) {
      b.appendChild(el('p', '', '홈 화면의 싸바카드로 언제든 카드를 만들고, 받은 카드를 모아 볼 수 있어요.'));
    } else if (inKakao) {
      b.appendChild(el('p', '', '카톡 안에서는 홈 화면에 추가할 수 없어요. 아래 버튼으로 ' + (ios ? '사파리' : '크롬') + '에서 연 뒤 설치하세요.'));
      var ex = el('a', 'go', (ios ? '사파리' : '크롬') + '에서 열기'); ex.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(location.origin + location.pathname + '?install=1'); b.appendChild(ex);
    } else if (ios) {
      b.appendChild(el('p', '', '앱스토어 없이 홈 화면에 바로 추가돼요. 용량도 거의 안 들어요.'));
      var ol = el('ol'); ['아래 주소창 옆 ••• (또는 공유 버튼 □↑)을 누르세요', '"공유" → "홈 화면에 추가"를 누르세요 (안 보이면 아래로 내려서 "더 보기")', '오른쪽 위 "추가"를 누르면 끝!'].forEach(function (t) { ol.appendChild(el('li', '', t)); }); b.appendChild(ol);
    } else {
      b.appendChild(el('p', '', '플레이스토어 없이 홈 화면에 바로 추가돼요. 용량도 거의 안 들어요.'));
      var go = el('button', 'go', deferred ? '📲 지금 설치하기' : '📲 설치하기'); go.type = 'button'; go.id = 'instGo';
      go.addEventListener('click', function () {
        if (deferred) { deferred.prompt(); deferred.userChoice.then(function () { deferred = null; shut(); }); }
        else toast('크롬 메뉴(⋮) → "홈 화면에 추가"를 눌러 주세요');
      });
      b.appendChild(go);
    }
    var later = el('button', 'later', '나중에 할게요'); later.type = 'button'; b.appendChild(later);
    function shut() { w.remove(); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    later.addEventListener('click', shut);
    w.addEventListener('click', function (e) { if (e.target === w) shut(); });
    w.appendChild(b); document.body.appendChild(w);
  }
  if (wantInstall && !window.SsakaInstall) installSheet();
  window.addEventListener('pageshow', function (e) { if (e.persisted) renderAll(); });
})();
</script>
