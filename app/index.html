<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>싸카</title>
  <meta property="og:title" content="싸카 — 앱 없이 카톡으로 보내는 카드">
  <meta property="og:description" content="명함 · 가게 홍보 · 모임 공지 · 초대장을 10초 만에">
  <meta property="og:image" content="https://directorjoo.github.io/ssaka-app/img/ssaka-share.png">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../img/favicon.png">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="싸카">
  <link rel="stylesheet" href="../css/brand.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
    body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
    button { font: inherit; color: inherit; }
    a { color: inherit; }
    .shell { max-width: 560px; margin: 0 auto; }

    /* 상단 */
    .top { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.94); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .top-in { display: flex; align-items: center; justify-content: space-between; height: 58px; padding: 0 18px; padding-top: env(safe-area-inset-top); }
    .top h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
    .logo { display: flex; align-items: center; gap: 8px; }
    .logo svg { width: 30px; height: 30px; }
    .top-act { display: flex; gap: 4px; }
    .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: none; border-radius: 12px; cursor: pointer; text-decoration: none; }
    .icon-btn svg, .tab svg, .row-act svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    /* 화면 */
    .view[hidden] { display: none; }
    .sec { padding: 6px 0 4px; }
    .sec-h { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 18px 8px; }
    .sec-h h2 { margin: 0; font-size: 13.5px; font-weight: 700; color: var(--ink-2); }
    .sec-h a, .sec-h button { font-size: 13.5px; color: var(--ssaka-deep); text-decoration: none; border: 0; background: none; cursor: pointer; font-weight: 700; padding: 6px 0; }
    .divider { height: 8px; background: var(--bg-2); margin: 6px 0; }

    /* 목록 행 (카톡 친구/채팅 목록처럼) */
    .row { display: flex; align-items: center; gap: 14px; padding: 10px 18px; text-decoration: none; min-height: 72px; }
    .row:active { background: var(--bg-2); }
    .ava { flex: none; width: 50px; height: 50px; border-radius: 19px; overflow: hidden; display: grid; place-items: center; font-weight: 800; font-size: 20px; color: #fff; background: var(--ssaka); }
    .ava img { width: 100%; height: 100%; object-fit: cover; }
    .row.me { padding-top: 14px; padding-bottom: 14px; }
    .row.me .ava { width: 64px; height: 64px; border-radius: 24px; font-size: 26px; }
    .row-txt { min-width: 0; flex: 1; display: grid; gap: 3px; }
    .row-t { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row.me .row-t { font-size: 18px; }
    .row-s { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .row-r { flex: none; display: grid; justify-items: end; gap: 6px; font-size: 12px; color: var(--ink-2); }
    .new { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--ssaka); color: #fff; font-size: 11.5px; font-weight: 800; display: grid; place-items: center; }
    .row-act { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: var(--ssaka-soft); color: var(--ssaka-deep); border-radius: 12px; cursor: pointer; }
    .tag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11.5px; font-weight: 700; background: var(--bg-2); color: var(--ink-2); }
    .tag.ok { background: var(--ssaka-soft); color: var(--ssaka-deep); }
    .tag.off { text-decoration: line-through; }

    /* 첫 화면 안내 */
    .hero { margin: 8px 18px 6px; padding: 22px 20px 20px; border-radius: 22px; background: var(--ssaka); color: #fff; position: relative; overflow: hidden; }
    .hero::after { content: ""; position: absolute; right: -40px; top: -40px; width: 170px; height: 170px; border-radius: 50%; background: rgba(255,255,255,.13); }
    .hero b { display: block; font-size: 22px; line-height: 1.3; letter-spacing: -0.02em; position: relative; z-index: 1; }
    .hero p { margin: 8px 0 16px; font-size: 14.5px; opacity: .95; position: relative; z-index: 1; }
    .hero a { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 6px; min-height: 46px; padding: 0 18px; border-radius: 999px; background: #fff; color: var(--ssaka-deep); font-weight: 800; text-decoration: none; }

    /* 어디야? 바로가기 */
    .eodiya { display: flex; align-items: center; gap: 14px; margin: 10px 18px 4px; padding: 16px; border-radius: 20px; background: var(--ssaka-soft); text-decoration: none; }
    .eodiya i { font-style: normal; width: 52px; height: 52px; border-radius: 18px; background: var(--ssaka); display: grid; place-items: center; font-size: 26px; flex: none; }
    .eodiya b { display: block; font-size: 19px; color: var(--ssaka-deep); letter-spacing: -0.02em; }
    .eodiya span { font-size: 13.5px; color: var(--ink-2); }
    .eodiya:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 2px; }

    /* 업종 바로가기 */
    .inds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 6px; padding: 4px 12px 10px; }
    .ind { display: grid; justify-items: center; gap: 6px; padding: 10px 2px; border-radius: 14px; text-decoration: none; font-size: 12.5px; font-weight: 600; text-align: center; word-break: keep-all; }
    .ind:active { background: var(--bg-2); }
    .ind i { font-style: normal; width: 52px; height: 52px; border-radius: 18px; background: var(--bg-2); display: grid; place-items: center; font-size: 26px; }

    .empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }
    .empty b { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }
    .empty a { display: inline-flex; margin-top: 16px; min-height: 48px; align-items: center; padding: 0 20px; border-radius: 999px; background: var(--ssaka); color: #fff; font-weight: 800; font-size: 16px; text-decoration: none; }

    .more a, .more button { display: flex; align-items: center; justify-content: space-between; width: 100%; min-height: 56px; padding: 0 18px; border: 0; background: none; text-align: left; font-size: 16px; text-decoration: none; cursor: pointer; }
    .more a + a, .more a + button, .more button + a, .more button + button { border-top: 1px solid var(--line); }
    .more span { color: var(--ink-2); font-size: 13.5px; }
    .tip { margin: 6px 18px 0; padding: 14px 16px; border-radius: 16px; background: var(--bg-2); font-size: 14px; line-height: 1.6; color: var(--ink-2); }
    .tip b { color: var(--ink); }

    /* 하단 탭 (카톡처럼) */
    .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
    .tabs-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); height: 64px; }
    .tab { display: grid; justify-items: center; align-content: center; gap: 3px; border: 0; background: none; cursor: pointer; color: #9a9a9a; font-size: 11px; font-weight: 600; text-decoration: none; position: relative; }
    .tab[aria-selected="true"] { color: var(--ink); }
    .tab[aria-selected="true"] svg { stroke-width: 2.2; }
    .tab .dot { position: absolute; top: 8px; left: 56%; width: 8px; height: 8px; border-radius: 50%; background: var(--ssaka); }
    .tab-make i { width: 48px; height: 48px; border-radius: 17px; background: var(--ssaka); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 18px -8px rgba(242,58,78,.8); margin-top: -10px; }
    .tab-make i svg { stroke-width: 2.4; }
    .tab-make { color: var(--ink); }
    .icon-btn:focus-visible, .tab:focus-visible, .row:focus-visible, .ind:focus-visible, .row-act:focus-visible { outline: 3px solid var(--ssaka); outline-offset: 2px; }

    .toast { position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(10px); background: #1a1a1a; color: #fff; padding: 12px 18px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 32px); z-index: 30; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="top-in">
      <div class="logo" id="topTitle">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#F23A4E"/><path d="M9 9.5h14a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3H13l-3.5 3v-3H9a3 3 0 0 1-3-3v-6a3 3 0 0 1 3-3z" fill="#fff"/><text x="16" y="19.3" text-anchor="middle" font-size="9" font-weight="900" fill="#F23A4E" font-family="Apple SD Gothic Neo, Noto Sans KR, sans-serif">싸</text></svg>
        <h1>홈</h1>
      </div>
      <div class="top-act">
        <a class="icon-btn" href="../make/" aria-label="새 카드 만들기"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M12 9v6M9 12h6"/></svg></a>
      </div>
    </div>
  </header>

  <!-- 홈 -->
  <main class="view" id="v-home"></main>
  <!-- 받은 카드 -->
  <main class="view" id="v-inbox" hidden></main>
  <!-- 예약 -->
  <main class="view" id="v-resv" hidden></main>
  <!-- 더보기 -->
  <main class="view" id="v-more" hidden></main>
</div>

<nav class="tabs" aria-label="메뉴">
  <div class="tabs-in" role="tablist">
    <button class="tab" role="tab" data-v="home" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>홈</button>
    <button class="tab" role="tab" data-v="inbox" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 3v-3H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg>받은 카드</button>
    <a class="tab tab-make" href="../make/"><i><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></i>만들기</a>
    <button class="tab" role="tab" data-v="resv" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>예약</button>
    <button class="tab" role="tab" data-v="more" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/></svg>더보기</button>
  </div>
</nav>
<div class="toast" id="toast" role="status"></div>

<script src="../js/designs.js"></script>
<script src="../js/store.js"></script>
<script>
(function () {
  var D = window.SsakaDesigns, S = window.SsakaStore;
  var $ = function (id) { return document.getElementById(id); };
  var TITLES = { home: '홈', inbox: '받은 카드', resv: '예약', more: '더보기' };
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 2000); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function when(ts) {
    if (!ts) return '';
    var d = new Date(ts), now = new Date();
    if (d.toDateString() === now.toDateString()) {
      var h = d.getHours(), m = d.getMinutes();
      return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + (m < 10 ? '0' : '') + m;
    }
    var y = new Date(now); y.setDate(now.getDate() - 1);
    if (d.toDateString() === y.toDateString()) return '어제';
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일';
  }
  function avatar(item) {
    var a = el('span', 'ava');
    var dz = item.design && D.get(item.design);
    if (dz) { a.style.background = dz.colors.accent; a.style.color = dz.colors.onAccent; }
    if (item.image) { var i = el('img'); i.src = item.image; i.alt = ''; i.loading = 'lazy'; a.appendChild(i); }
    else a.textContent = (item.title || '싸').trim().charAt(0);
    return a;
  }
  function cardRow(item, opts) {
    var r = el('a', 'row' + (opts && opts.me ? ' me' : ''));
    r.href = item.url;
    r.appendChild(avatar(item));
    var t = el('span', 'row-txt');
    t.appendChild(el('span', 'row-t', item.title || '이름 없는 카드'));
    t.appendChild(el('span', 'row-s', item.subtitle || (opts && opts.me ? '내 카드' : '')));
    r.appendChild(t);
    var right = el('span', 'row-r');
    if (opts && opts.share) {
      var b = el('button', 'row-act'); b.type = 'button'; b.setAttribute('aria-label', item.title + ' 링크 복사');
      b.innerHTML = '<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
      b.addEventListener('click', function (e) {
        e.preventDefault(); e.stopPropagation();
        (navigator.clipboard ? navigator.clipboard.writeText(item.url) : Promise.reject()).then(function () { toast('링크를 복사했어요'); }, function () { prompt('링크를 복사하세요', item.url); });
      });
      right.appendChild(b);
    } else {
      right.appendChild(el('span', '', when(item.at)));
      if (item.unread) right.appendChild(el('span', 'new', 'N'));
    }
    r.appendChild(right);
    return r;
  }
  function secHead(title, link) {
    var h = el('div', 'sec-h'); h.appendChild(el('h2', '', title));
    if (link) { var a = el('a', '', link.text); a.href = link.href; h.appendChild(a); }
    return h;
  }
  function empty(title, text, cta) {
    var e = el('div', 'empty'); e.appendChild(el('b', '', title)); e.appendChild(document.createTextNode(text));
    if (cta) { e.appendChild(document.createElement('br')); var a = el('a', '', cta.text); a.href = cta.href; e.appendChild(a); }
    return e;
  }

  // ---------- 홈 ----------
  function renderHome() {
    var v = $('v-home'); v.innerHTML = '';
    var mine = S.mine();
    if (mine.length) {
      v.appendChild(cardRow(mine[0], { me: true, share: true }));
      v.appendChild(el('div', 'divider'));
      v.appendChild(secHead('내가 만든 카드 ' + mine.length, { text: '+ 새로 만들기', href: '../make/' }));
      mine.forEach(function (m) { v.appendChild(cardRow(m, { share: true })); });
    } else {
      var h = el('div', 'hero');
      h.innerHTML = '<b>앱 없이 카톡 한 번에<br>여는 내 카드</b><p>명함 · 가게 홍보 · 모임 공지 · 초대장을 10초 만에 만들어 보내세요.</p>';
      var a = el('a', '', '첫 카드 만들기'); a.href = '../make/'; h.appendChild(a);
      v.appendChild(h);
    }
    var eo = el('a', 'eodiya'); eo.href = '../eodiya/';
    eo.innerHTML = '<i>📍</i><div><b>어디야?</b><span>약속 장소 보내기 · 친구 위치 물어보기</span></div>';
    v.appendChild(eo);
    v.appendChild(el('div', 'divider'));
    v.appendChild(secHead('업종별로 바로 만들기'));
    var g = el('div', 'inds');
    D.INDUSTRIES.forEach(function (ind) {
      var a = el('a', 'ind'); a.href = '../make/?ind=' + ind.id;
      var i = el('i', '', ind.emoji); a.appendChild(i); a.appendChild(document.createTextNode(ind.label));
      g.appendChild(a);
    });
    v.appendChild(g);
  }

  // ---------- 받은 카드 ----------
  function renderInbox() {
    var v = $('v-inbox'); v.innerHTML = '';
    var list = S.inbox();
    if (!list.length) {
      v.appendChild(empty('아직 받은 카드가 없어요', '친구가 보낸 싸카를 열면 여기에 모여요.', null));
      v.appendChild(el('div', 'tip')).innerHTML = '<b>카톡 안에서 연 카드</b>는 카톡 안의 브라우저에 저장돼요. 사파리·크롬에서 다시 열면 여기에도 보여요.';
      return;
    }
    v.appendChild(secHead('받은 카드 ' + list.length));
    list.forEach(function (c) { v.appendChild(cardRow(c)); });
    S.markRead();
    refreshDots();
  }

  // ---------- 예약 ----------
  function fmt(d, t) { if (!d) return ''; var x = new Date(d + 'T00:00:00'); return (x.getMonth() + 1) + '월 ' + x.getDate() + '일(' + DAYS[x.getDay()] + ') ' + (t || ''); }
  function renderResv() {
    var v = $('v-resv'); v.innerHTML = '';
    var list = S.reservations();
    if (!list.length) { v.appendChild(empty('예약 내역이 없어요', '가게 카드에서 "예약하기"를 누르면 여기에 모여요.', null)); return; }
    v.appendChild(secHead('내 예약 ' + list.length));
    list.forEach(function (x) {
      var r = el('div', 'row');
      r.appendChild(avatar({ title: x.shop }));
      var t = el('span', 'row-txt');
      t.appendChild(el('span', 'row-t', x.shop));
      t.appendChild(el('span', 'row-s', fmt(x.date, x.time) + ' · ' + x.people + '명 · ' + x.code));
      r.appendChild(t);
      var right = el('span', 'row-r');
      right.appendChild(el('span', 'tag ' + (x.status === 'canceled' ? 'off' : 'ok'), x.status === 'canceled' ? '취소함' : '확인 대기'));
      if (x.status !== 'canceled' && x.shopPhone) {
        var c = el('button', 'row-act', '취소'); c.type = 'button'; c.style.width = 'auto'; c.style.padding = '0 10px'; c.style.fontWeight = '800'; c.style.fontSize = '13px';
        c.addEventListener('click', function () {
          if (!confirm(fmt(x.date, x.time) + ' 예약을 취소할까요?')) return;
          S.cancelReservation(x.code);
          var ios = /iPhone|iPad|iPod/i.test(navigator.userAgent);
          var msg = '[싸카 예약 취소]\n' + x.shop + '\n예약번호: ' + x.code + '\n' + fmt(x.date, x.time) + ' · ' + x.people + '명\n' + x.name + ' (' + x.phone + ')\n위 예약을 취소합니다.' + (x.deposit ? '\n입금한 예약금 ' + x.deposit.toLocaleString('ko-KR') + '원 환불 부탁드립니다.' : '');
          renderResv();
          toast('취소 문자를 보내면 취소가 끝나요');
          setTimeout(function () { location.href = 'sms:' + x.shopPhone.replace(/[^\d+]/g, '') + (ios ? '&' : '?') + 'body=' + encodeURIComponent(msg); }, 250);
        });
        right.appendChild(c);
      }
      r.appendChild(right);
      v.appendChild(r);
    });
  }

  // ---------- 더보기 ----------
  function renderMore() {
    var v = $('v-more'); v.innerHTML = '';
    var tip = el('div', 'tip');
    tip.innerHTML = '<b>싸카를 앱처럼 쓰기</b><br>아이폰: 사파리 아래 공유 버튼 → "홈 화면에 추가"<br>안드로이드: 크롬 메뉴(⋮) → "홈 화면에 추가"';
    v.appendChild(tip);
    var m = el('div', 'more');
    [['만들기 화면', '../make/', '새 카드'], ['카드 예시 보기', '../demo/?card=actor', '샘플']].forEach(function (x) {
      var a = el('a', ''); a.href = x[1]; a.appendChild(document.createTextNode(x[0])); a.appendChild(el('span', '', x[2])); m.appendChild(a);
    });
    var clear = el('button', ''); clear.type = 'button';
    clear.appendChild(document.createTextNode('이 휴대폰의 기록 지우기')); clear.appendChild(el('span', '', '만든·받은 카드, 예약'));
    clear.addEventListener('click', function () {
      if (!confirm('이 휴대폰에 저장된 만든 카드·받은 카드·예약 기록을 지울까요? 보낸 카드 링크는 그대로 열려요.')) return;
      S.clearAll(); toast('기록을 지웠어요'); renderAll();
    });
    m.appendChild(clear);
    v.appendChild(el('div', 'divider'));
    v.appendChild(m);
  }

  function refreshDots() {
    var tab = document.querySelector('.tab[data-v="inbox"]');
    var dot = tab.querySelector('.dot');
    var n = S.unread();
    if (n && !dot) { dot = el('span', 'dot'); dot.setAttribute('aria-label', '새 카드 ' + n + '개'); tab.appendChild(dot); }
    if (!n && dot) dot.remove();
  }
  function show(name) {
    document.querySelectorAll('.view').forEach(function (x) { x.hidden = x.id !== 'v-' + name; });
    document.querySelectorAll('.tab[data-v]').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.v === name ? 'true' : 'false'); });
    document.querySelector('.top h1').textContent = TITLES[name];
    ({ home: renderHome, inbox: renderInbox, resv: renderResv, more: renderMore })[name]();
    try { history.replaceState(null, '', name === 'home' ? location.pathname : '#' + name); } catch (e) {}
    window.scrollTo(0, 0);
  }
  function renderAll() { show(current); refreshDots(); }
  document.querySelectorAll('.tab[data-v]').forEach(function (t) { t.addEventListener('click', function () { current = t.dataset.v; show(current); }); });
  var current = (location.hash || '').slice(1);
  if (!TITLES[current]) current = 'home';
  renderAll();
  window.addEventListener('pageshow', function (e) { if (e.persisted) renderAll(); });
})();
</script>
</body>
</html>
