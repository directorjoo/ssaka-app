<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#B3132B">
  <title>내 작업 관리 · 싸바</title>
  <link rel="icon" href="/img/favicon.png">
  <link rel="stylesheet" href="/css/brand.css">
  <style>
    * { box-sizing: border-box; } [hidden] { display: none !important; }
    html, body { margin: 0; background: #f7f3ee; color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
    .w { max-width: 640px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 14px calc(100px + env(safe-area-inset-bottom)); }
    h1 { font-size: 24px; margin: 6px 0 4px; letter-spacing: -.02em; padding-right: 108px; }
    .sub { padding-right: 96px; }
    .sub { margin: 0 0 14px; font-size: 15px; color: var(--ink-2); line-height: 1.5; }
    .who { display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; font-size: 16px; font-weight: 700; }
    .who img { width: 34px; height: 34px; }
    .who a { margin-left: auto; color: var(--ssaka-deep); font-size: 15px; text-decoration: none; font-weight: 800; }
    .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0 0 12px; position: sticky; top: 0; z-index: 3; background: #f7f3ee; padding: 6px 0; }
    .tabs button { min-height: 46px; border-radius: 14px; border: 1.5px solid #e3dcd4; background: #fff; font: inherit; font-size: 16px; font-weight: 800; color: #333; cursor: pointer; }
    .tabs button[aria-selected="true"] { background: var(--ssaka); border-color: var(--ssaka); color: #fff; }
    .tabs b { font-size: 14px; opacity: .8; margin-left: 2px; }
    .it { display: grid; grid-template-columns: 64px 1fr; gap: 12px; background: #fff; border-radius: 18px; padding: 12px; margin-bottom: 10px; box-shadow: 0 1px 0 rgba(0,0,0,.04); }
    .th { width: 64px; height: 64px; border-radius: 14px; background: var(--ssaka-soft) center/cover no-repeat; display: grid; place-items: center; font-size: 28px; }
    .tt { font-size: 17px; font-weight: 800; line-height: 1.3; word-break: keep-all; overflow-wrap: anywhere; }
    .ts { font-size: 15px; color: var(--ink-2); margin-top: 3px; line-height: 1.4; }
    .nums { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
    .nums span { font-size: 14px; font-weight: 700; background: #f4efe9; border-radius: 999px; padding: 4px 10px; color: #4a423b; }
    .nums .bad { background: #ffe3e3; color: #a3121f; }
    .acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
    .acts a, .acts button { flex: 1 1 auto; min-height: 42px; display: inline-flex; align-items: center; justify-content: center; border-radius: 12px; border: 1.5px solid #e3dcd4; background: #fff; color: #222; font: inherit; font-size: 15px; font-weight: 800; text-decoration: none; padding: 0 12px; cursor: pointer; }
    .acts .main { background: var(--ssaka-deep); border-color: var(--ssaka-deep); color: #fff; }
    .acts .del { color: #a3121f; flex: 0 0 auto; }
    .grp { margin: 18px 4px 8px; font-size: 15px; font-weight: 800; color: #8a7f76; }
    .empty { background: #fff; border-radius: 18px; padding: 22px 18px; text-align: center; font-size: 16px; line-height: 1.6; color: var(--ink-2); }
    .empty a { display: inline-flex; margin-top: 12px; min-height: 48px; align-items: center; padding: 0 20px; border-radius: 14px; background: var(--ssaka); color: #fff; font-weight: 800; text-decoration: none; }
    .note { font-size: 14px; color: #8a7f76; line-height: 1.55; margin: 14px 4px 0; }
    .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(20,20,20,.92); color: #fff; padding: 11px 18px; border-radius: 14px; font-size: 15px; font-weight: 700; z-index: 50; white-space: nowrap; }
  </style>
</head>
<body>
<div class="w">
  <h1>🗂️ 내 작업 관리</h1>
  <p class="sub">내가 만든 싸바카드와 블로그 글을 한곳에서 보고, 고치고, 지워요.</p>
  <div class="who" id="who"><img src="/img/cherry.webp" alt=""><span id="whoT">불러오는 중…</span><a id="whoA" href="/join/?next=%2Fapp%2Fmanage%2F" hidden>로그인</a></div>
  <div class="tabs" role="tablist">
    <button type="button" role="tab" data-t="cards" aria-selected="true">싸바카드 <b id="nC"></b></button>
    <button type="button" role="tab" data-t="posts" aria-selected="false">블로그 글 <b id="nP"></b></button>
    <button type="button" role="tab" data-t="phone" aria-selected="false">이 폰 기록 <b id="nL"></b></button>
  </div>
  <div id="v-cards"></div>
  <div id="v-posts" hidden></div>
  <div id="v-phone" hidden></div>
</div>
<script src="/js/store.js"></script>
<script src="/js/survey-q.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var S = window.SsakaStore, SV = window.SavaSurvey || { BY: {} };
  var data = { login: 0, cards: [], posts: [] }, tab = 'cards';
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function toast(t) { var d = el('div', 'toast', t); d.setAttribute('role', 'status'); document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2300); }
  function when(t) { if (!t) return ''; var d = new Date(t); return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; }
  function btn(txt, cls, fn) { var b = el('button', cls || '', txt); b.type = 'button'; b.addEventListener('click', fn); return b; }
  function link(txt, href, cls) { var a = el('a', cls || '', txt); a.href = href; return a; }
  function thumb(img, emo) { var t = el('div', 'th'); if (img && (/^(https?:)?\/\//.test(img) || /^\/[^/]/.test(img) || /^data:image\//.test(img))) t.style.backgroundImage = 'url("' + String(img).replace(/"/g, '') + '")'; else t.textContent = emo || '🍒'; return t; }
  function post(body) {
    return fetch('/api/manage', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
  }

  // ---------- 싸바카드 (계정에 묶인 것) ----------
  function paintCards() {
    var v = $('v-cards'); v.innerHTML = '';
    if (!data.login) {
      var e = el('div', 'empty'); e.appendChild(document.createTextNode('카카오로 로그인하면 어느 폰·노트북에서든 내 카드를 모아 보고 고칠 수 있어요.'));
      e.appendChild(document.createElement('br')); e.appendChild(link('🍒 카카오로 로그인', '/join/?next=%2Fapp%2Fmanage%2F'));
      v.appendChild(e);
      v.appendChild(el('p', 'note', '로그인 전에 이 폰에서 만든 카드는 "이 폰 기록"에 있어요. 로그인한 채로 그 카드를 한 번 고치면 계정에 묶여요.'));
      return;
    }
    if (!data.cards.length) { var m = el('div', 'empty', '아직 계정에 묶인 싸바카드가 없어요.'); m.appendChild(document.createElement('br')); m.appendChild(link('🍒 싸바카드 만들기', '/make/')); v.appendChild(m); return; }
    data.cards.forEach(function (c) {
      var it = el('div', 'it');
      it.appendChild(thumb(c.image));
      var tx = el('div');
      tx.appendChild(el('div', 'tt', c.title || '(제목 없음)'));
      tx.appendChild(el('div', 'ts', [c.subtitle, when(c.at) + ' 만듦'].filter(Boolean).join(' · ')));
      var nm = el('div', 'nums');
      nm.appendChild(el('span', '', '👀 이번 주 ' + c.stat.week));
      nm.appendChild(el('span', '', '전체 ' + c.stat.view));
      if (c.stat.act) nm.appendChild(el('span', '', '📞 반응 ' + c.stat.act));
      if (c.blocked) nm.appendChild(el('span', 'bad', '⛔ 신고로 잠김'));
      tx.appendChild(nm); it.appendChild(tx);
      var a = el('div', 'acts');
      a.appendChild(link('열어 보기', '/c/?s=' + c.id));
      a.appendChild(link('✏️ 고치기', '/make/?edit=' + encodeURIComponent(c.d) + '&s=' + c.id, 'main'));
      a.appendChild(link('복사해서 새로', '/make/?copy=' + encodeURIComponent(c.d)));
      a.appendChild(btn('지우기', 'del', function () {
        if (!confirm('"' + (c.title || '이 카드') + '"를 지울까요?\n이미 보낸 링크도 더는 열리지 않아요. 되돌릴 수 없어요.')) return;
        post({ op: 'delcard', id: c.id }).then(function (j) {
          if (!j.ok) return toast('지우지 못했어요');
          data.cards = data.cards.filter(function (x) { return x.id !== c.id; });
          dropLocal(c.id); counts(); paintCards(); toast('지웠어요');
        }).catch(function () { toast('인터넷 연결을 확인해 주세요'); });
      }));
      it.appendChild(a); v.appendChild(it);
    });
    v.appendChild(el('p', 'note', '"고치기"로 바꾼 내용은 이미 카톡으로 보낸 그 링크에도 그대로 반영돼요. 숫자는 손님이 카드를 연 횟수예요(누가 열었는지는 저장하지 않아요).'));
  }
  function dropLocal(id) {
    try { var k = 'ssaka-my-cards-v1', L = JSON.parse(localStorage.getItem(k) || '[]'); localStorage.setItem(k, JSON.stringify(L.filter(function (x) { return x.sid !== id && !(x.url && x.url.indexOf('s=' + id) >= 0); }))); } catch (e) {}
  }

  // ---------- 블로그 글 ----------
  function indName(id) { var x = SV.BY && SV.BY[id]; return x ? (x.e ? x.e + ' ' : '') + x.label : id; }
  function paintPosts() {
    var v = $('v-posts'); v.innerHTML = '';
    if (!data.login) { var e = el('div', 'empty', '로그인하면 업종별로 쓴 블로그 글을 모아 보고 이어서 고칠 수 있어요.'); e.appendChild(document.createElement('br')); e.appendChild(link('🍒 카카오로 로그인', '/join/?next=%2Fapp%2Fmanage%2F')); v.appendChild(e); return; }
    if (!data.posts.length) { var m = el('div', 'empty', '아직 저장된 블로그 글이 없어요.'); m.appendChild(document.createElement('br')); m.appendChild(link('✍️ 블로그 글 쓰기', '/survey/')); v.appendChild(m); return; }
    var by = {};
    data.posts.forEach(function (p) { (by[p.ind] = by[p.ind] || []).push(p); });
    Object.keys(by).forEach(function (ind) {
      v.appendChild(el('div', 'grp', indName(ind) + ' · ' + by[ind].length + '편'));
      by[ind].sort(function (a, b) { return a.n - b.n; }).forEach(function (p) {
        var it = el('div', 'it');
        var th = el('div', 'th', String(p.n)); th.style.fontSize = '22px'; th.style.fontWeight = '900'; th.style.color = 'var(--ssaka-deep)';
        it.appendChild(th);
        var tx = el('div');
        tx.appendChild(el('div', 'tt', p.title || ('글 ' + p.n)));
        tx.appendChild(el('div', 'ts', (p.peek ? p.peek + '… · ' : '') + when(p.at) + ' 고침'));
        it.appendChild(tx);
        var a = el('div', 'acts');
        a.appendChild(link('✏️ 이어서 고치기', '/survey/?ind=' + encodeURIComponent(ind), 'main'));
        a.appendChild(btn('지우기', 'del', function () {
          if (!confirm('"' + (p.title || '이 글') + '"을 지울까요? 되돌릴 수 없어요.')) return;
          post({ op: 'delpost', ind: ind, n: p.n }).then(function (j) {
            if (!j.ok) return toast('지우지 못했어요');
            data.posts = data.posts.filter(function (x) { return !(x.ind === ind && x.n === p.n); });
            counts(); paintPosts(); toast('지웠어요');
          }).catch(function () { toast('인터넷 연결을 확인해 주세요'); });
        }));
        it.appendChild(a); v.appendChild(it);
      });
    });
    v.appendChild(el('p', 'note', '글은 계정에 저장돼서 아이폰·안드로이드·노트북·맥북 어디서든 똑같이 이어서 고칠 수 있어요.'));
  }

  // ---------- 이 폰 기록 (로그인 없이도) ----------
  function paintPhone() {
    var v = $('v-phone'); v.innerHTML = '';
    var mine = S ? S.mine() : [], inbox = S ? S.inbox() : [], rv = S ? S.reservations() : [];
    v.appendChild(el('div', 'grp', '이 폰에서 만든 카드 · ' + mine.length));
    if (!mine.length) v.appendChild(el('div', 'empty', '이 폰에 남은 만든 카드가 없어요.'));
    mine.forEach(function (c) {
      var it = el('div', 'it'); it.appendChild(thumb(c.image));
      var tx = el('div'); tx.appendChild(el('div', 'tt', c.title || '(제목 없음)')); tx.appendChild(el('div', 'ts', [c.subtitle, when(c.at)].filter(Boolean).join(' · '))); it.appendChild(tx);
      var a = el('div', 'acts'); a.appendChild(link('열어 보기', c.url));
      var d = null; try { d = new URL(c.url, location.href).searchParams.get('d'); } catch (e) {}
      if (d) a.appendChild(link('✏️ 고치기', '/make/?edit=' + encodeURIComponent(d), 'main'));
      it.appendChild(a); v.appendChild(it);
    });
    var box = el('div', 'it'); box.style.gridTemplateColumns = '1fr';
    var t = el('div'); t.appendChild(el('div', 'tt', '💌 받은 카드 ' + inbox.length + '장 · 📅 예약 ' + rv.length + '건')); t.appendChild(el('div', 'ts', '이 폰(이 브라우저)에만 저장된 기록이에요.')); box.appendChild(t);
    var a2 = el('div', 'acts'); a2.appendChild(link('받은 카드', '/app/#inbox')); a2.appendChild(link('내 예약', '/app/#resv'));
    a2.appendChild(btn('이 폰 기록 지우기', 'del', function () { if (!confirm('이 폰에 저장된 만든 카드·받은 카드·예약 기록을 지울까요? 보낸 카드 링크는 그대로 열려요.')) return; S && S.clearAll(); counts(); paintPhone(); toast('지웠어요'); }));
    box.appendChild(a2); v.appendChild(box);
  }

  function counts() {
    $('nC').textContent = data.login ? data.cards.length : '';
    $('nP').textContent = data.login ? data.posts.length : '';
    $('nL').textContent = S ? S.mine().length : '';
  }
  function show(t) {
    tab = t;
    document.querySelectorAll('.tabs button').forEach(function (b) { b.setAttribute('aria-selected', b.dataset.t === t ? 'true' : 'false'); });
    ['cards', 'posts', 'phone'].forEach(function (k) { $('v-' + k).hidden = k !== t; });
    ({ cards: paintCards, posts: paintPosts, phone: paintPhone })[t]();
    try { history.replaceState(null, '', '#' + t); } catch (e) {}
  }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { show(b.dataset.t); }); });
  var h = (location.hash || '').slice(1); if (['cards', 'posts', 'phone'].indexOf(h) >= 0) tab = h;

  fetch('/api/manage', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    data = j && j.login ? j : { login: 0, cards: [], posts: [] };
    if (data.login) { $('whoT').textContent = data.user.nick + '님 · 회원번호 ' + data.user.id; $('whoA').hidden = false; $('whoA').textContent = '내 정보'; $('whoA').href = '/join/'; }
    else { $('whoT').textContent = '로그인하지 않았어요'; $('whoA').hidden = false; }
    if (!data.login && tab === 'cards' && S && S.mine().length) tab = 'phone';
    counts(); show(tab);
  }).catch(function () { $('whoT').textContent = '인터넷 연결을 확인해 주세요'; counts(); show('phone'); });
})();
</script>
<script src="/js/home.js?v=11" defer></script>
</body>
</html>
