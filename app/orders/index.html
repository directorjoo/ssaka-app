<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>싸바 · 언니김치 주문</title><link rel="stylesheet" href="../../css/brand.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f2;color:#29231f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.wrap{max-width:600px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px}h1{font-size:24px;margin:0 0 6px}.sub{color:#766e68;font-size:14px;margin:0 0 18px}.card{background:#fff;border:1px solid #eee7e1;border-radius:18px;padding:16px;margin:12px 0}.price{font-size:20px;font-weight:900;color:#8e0f22}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:14px;font-weight:800}.field input,.field textarea,.field select{width:100%;font:inherit;padding:13px;border:1px solid #ddd4ce;border-radius:11px;background:#fff}.choice{display:flex;gap:8px}.choice label{flex:1;padding:12px;border:1px solid #ddd4ce;border-radius:11px;text-align:center}.btn{width:100%;min-height:50px;border:0;border-radius:13px;background:#8e0f22;color:white;font:inherit;font-weight:900;margin-top:8px}.btn.alt{background:#eee9e4;color:#302923}.muted{color:#766e68;font-size:13px;line-height:1.6}.item{border-top:1px solid #eee7e1;padding:14px 0}.row{display:flex;justify-content:space-between;gap:8px}.status{font-weight:900;color:#8e0f22}.detail{font-size:13px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere}.hidden{display:none!important}.err{color:#a11;font-size:13px;white-space:pre-wrap}.success{background:#f2f8f2;border-radius:12px;padding:14px;line-height:1.7}
</style></head><body><main class="wrap">
<h1>🥬 언니김치 주문하기</h1><p class="sub">회원가입 없이 주문할 수 있습니다. 주문번호와 연락처로 주문 상태를 확인하세요.</p>
<section class="card" id="formBox"><div class="price">5kg 한 박스 60,000원 · 배송비 포함</div>
<div class="field"><label>주문 수량</label><div class="choice"><button class="btn alt" type="button" id="minus">−</button><strong id="qty" style="align-self:center;padding:0 14px">1</strong><button class="btn alt" type="button" id="plus">＋</button></div><strong id="total">총 60,000원</strong></div>
<div class="field"><label>주문 방식</label><div class="choice"><label><input type="radio" name="type" value="우리 집 받기" checked> 우리 집 받기</label><label><input type="radio" name="type" value="선물 보내기"> 선물 보내기</label></div></div>
<div class="field"><label>주문자 성함</label><input id="buyer" autocomplete="name" placeholder="성함"></div><div class="field"><label>주문자 연락처</label><input id="phone" autocomplete="tel" inputmode="tel" placeholder="010-0000-0000"></div>
<div id="self"><div class="field"><label>배송 주소</label><textarea id="address" rows="2" placeholder="받으실 주소"></textarea></div></div>
<div id="gift" class="hidden"><div class="field"><label>선물 받는 분 성함</label><input id="recipient" placeholder="받는 분 성함"></div><div class="field"><label>받는 분 연락처</label><input id="recipientPhone" inputmode="tel" placeholder="010-0000-0000"></div><div class="field"><label>선물 배송 주소</label><textarea id="giftAddress" rows="2" placeholder="선물 받으실 주소"></textarea></div><div class="field"><label>선물 메시지</label><textarea id="giftMessage" rows="2" placeholder="전할 말씀 (선택)"></textarea></div></div>
<div class="field"><label>배송 요청사항</label><textarea id="memo" rows="2" placeholder="요청사항 (선택)"></textarea></div>
<div class="field"><label>결제 방법</label><select id="payment"><option value="현금 입금 · 기업은행 05908777304018 · 예금주 지해순">현금 입금 · 기업은행</option><option value="신용카드 원격결제 요청">신용카드 · 별도 안내</option></select></div>
<div class="success">기업은행 <strong>059-087-773040-18</strong><br>예금주 <strong>지해순</strong></div><label class="muted" style="display:flex;gap:8px;align-items:flex-start;margin-top:12px"><input type="checkbox" id="agree" style="width:22px;height:22px;flex:none;margin-top:2px"><span>주문·배송을 위해 이름, 연락처, 주소(선물이면 받는 분 정보)를 모으고 판매자에게 전달하는 데 동의합니다. 거래 기록은 전자상거래법에 따라 5년 보관 후 지웁니다. <a href="/privacy/">개인정보처리방침</a></span></label><button class="btn" id="submit">주문 접수하기</button><p class="muted">회원가입 없이 주문이 접수되며, 주문번호를 꼭 저장해 주세요.</p></section>
<section class="card hidden" id="resultBox"><strong>주문 접수 완료</strong><div id="result"></div><p class="muted">주문번호와 주문자 연락처로 언제든 주문 상태를 확인할 수 있습니다.</p></section>
<section class="card hidden" id="mineBox"><strong>🥬 내 주문</strong><div id="mineList"></div></section><section class="card" id="lookupBox"><strong>주문번호로 확인</strong><div class="field"><label>주문번호</label><input id="lookupNo" placeholder="예: YK-1234567890"></div><div class="field"><label>주문자 연락처</label><input id="lookupPhone" inputmode="tel" placeholder="주문할 때 입력한 번호"></div><button class="btn alt" id="lookup">주문 상태 확인하기</button><div id="lookupResult"></div></section>
<section class="card hidden" id="adminBox"><strong>관리자 주문관리</strong><p class="muted">싸바 관리자 로그인 계정만 전체 주문을 볼 수 있습니다.</p><div id="adminList"></div></section>
<p class="err" id="err"></p><button class="btn alt" onclick="location.href='/app/'">싸바 홈으로</button>
</main><script>
(function(){
const $=id=>document.getElementById(id);let qty=1;
const labels={new:'주문 접수',paid:'입금 확인',preparing:'상품 준비 중',shipped:'발송 완료',done:'배송 완료',canceled:'주문 취소'};
function show(id,on){$(id).classList.toggle('hidden',!on)}function err(s){$('err').textContent=s||''}
async function api(data){const r=await fetch('/api/kimchi-orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){const msg={setup:'지금은 온라인 주문 접수를 준비 중이에요. 위 계좌로 입금하신 뒤 판매자에게 연락해 주세요.',agree:'개인정보 수집·이용에 동의해 주세요.',limit:'오늘 주문 접수 횟수를 넘었어요. 내일 다시 해 주세요.',forbidden:'관리자 권한이 없는 계정입니다.',required:'입력 내용을 확인해 주세요.', 'not-found':'주문번호 또는 연락처가 맞지 않습니다.'};throw Error(msg[j.error]||'요청을 처리하지 못했습니다. ('+(j.error||r.status)+')');}return j;}
function paintQty(){$('qty').textContent=qty;$('total').textContent='총 '+(qty*60000).toLocaleString('ko-KR')+'원'}
function typeChange(){const gift=document.querySelector('input[name=type]:checked').value==='선물 보내기';show('gift',gift);show('self',!gift)}
document.querySelectorAll('input[name=type]').forEach(x=>x.addEventListener('change',typeChange));
$('minus').onclick=()=>{qty=Math.max(1,qty-1);paintQty()};$('plus').onclick=()=>{qty=Math.min(50,qty+1);paintQty()};
function orderData(){const type=document.querySelector('input[name=type]:checked').value;return {buyer:$('buyer').value,phone:$('phone').value,orderType:type,recipient:$('recipient').value,recipientPhone:$('recipientPhone').value,address:type==='선물 보내기' ? $('giftAddress').value : $('address').value,giftMessage:$('giftMessage').value,memo:$('memo').value,payment:$('payment').value,quantity:qty};}
$('submit').onclick=async()=>{err('');try{if(!$('agree').checked){err('개인정보 수집·이용에 동의해 주세요.');$('agree').focus();return;}const j=await api({action:'create',agree:true,order:orderData()});show('resultBox',true);$('result').innerHTML='<div class="success"><strong>주문이 정상 접수되었습니다.</strong><br>주문번호 <strong>'+j.orderNo+'</strong><br>주문 금액 <strong>'+j.order.amount.toLocaleString('ko-KR')+'원</strong><br>현재 상태 <strong>주문 접수</strong><br><button class="btn alt" id="copyNo" type="button">주문번호 복사</button></div>';$('copyNo').onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(j.orderNo);};$('lookupNo').value=j.orderNo;$('lookupPhone').value=$('phone').value;saveMine({id:j.orderNo,phone:$('phone').value,created:j.created});loadMine();window.scrollTo({top:0,behavior:'smooth'});}catch(e){err(e.message)}};
$('lookup').onclick=async()=>{err('');try{const j=await api({action:'lookup',orderNo:$('lookupNo').value.trim(),phone:$('lookupPhone').value});const x=j.item,o=x.order;$('lookupResult').textContent='';const d=document.createElement('div');d.className='item';const b=document.createElement('strong');b.className='status';b.textContent=labels[x.status]||x.status;const p=document.createElement('div');p.className='detail';p.textContent='주문번호: '+x.id+'\n주문일: '+new Date(x.created).toLocaleString('ko-KR')+(o.buyer?'\n주문자: '+o.buyer:'')+(o.recipient&&o.orderType==='선물 보내기'?' → 받는 분: '+o.recipient:'')+'\n'+o.orderType+' · '+o.quantity+'박스 · '+Number(o.amount).toLocaleString('ko-KR')+'원\n배송지: '+o.address;d.append(b,p);$('lookupResult').append(d);}catch(e){err(e.message)}};
function adminItem(x){const o=x.order,d=document.createElement('div');d.className='item';const p=document.createElement('div');p.className='detail';p.textContent=x.id+' · '+new Date(x.created).toLocaleString('ko-KR')+'\n주문자: '+o.buyer+' / '+o.phone+'\n'+o.orderType+' · '+o.quantity+'박스 · '+o.amount.toLocaleString('ko-KR')+'원\n'+o.address;const s=document.createElement('select');Object.keys(labels).forEach(k=>{const op=document.createElement('option');op.value=k;op.textContent=labels[k];op.selected=x.status===k;s.append(op)});const b=document.createElement('button');b.className='btn';b.textContent='상태 저장';b.onclick=async()=>{try{await api({action:'status',id:x.id,status:s.value});await loadAdmin()}catch(e){err(e.message)}};d.append(p,s,b);return d;}
async function loadAdmin(){const j=await api({action:'list'});show('adminBox',true);$('adminList').replaceChildren();j.items.forEach(x=>$('adminList').append(adminItem(x)));if(!j.items.length)$('adminList').textContent='주문이 없습니다.';}
const MK='sava-my-orders';
function saveMine(x){try{const a=JSON.parse(localStorage.getItem(MK)||'[]').filter(y=>y.id!==x.id);a.unshift(x);localStorage.setItem(MK,JSON.stringify(a.slice(0,30)));}catch(e){}}
function orderItem(x){const o=x.order,d=document.createElement('div');d.className='item';const b=document.createElement('strong');b.className='status';b.textContent=labels[x.status]||x.status;const p=document.createElement('div');p.className='detail';p.textContent='주문번호: '+x.id+'\n주문일: '+new Date(x.created).toLocaleString('ko-KR')+(o.buyer?'\n주문자: '+o.buyer:'')+(o.recipient&&o.orderType==='선물 보내기'?' → 받는 분: '+o.recipient:'')+'\n'+o.orderType+' · '+o.quantity+'박스 · '+Number(o.amount).toLocaleString('ko-KR')+'원\n배송지: '+o.address;d.append(b,p);return d;}
async function loadMine(){
 const seen={},list=[];
 try{const r=await fetch('/api/kimchi-orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'mine'})});const j=await r.json();(j.items||[]).forEach(x=>{seen[x.id]=1;list.push(x);});}catch(e){}
 let local=[];try{local=JSON.parse(localStorage.getItem(MK)||'[]');}catch(e){}
 for(const x of local){if(seen[x.id])continue;try{const r=await fetch('/api/kimchi-orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'lookup',orderNo:x.id,phone:x.phone})});const j=await r.json();if(j.ok){seen[x.id]=1;list.push(j.item);}}catch(e){}}
 list.sort((a,b)=>b.created-a.created);
 show('mineBox',list.length>0);$('mineList').replaceChildren(...list.map(orderItem));
}
async function start(){loadMine();const params=new URLSearchParams(location.search);if(params.get('admin')==='1'){try{const me=await fetch('/api/auth/me',{cache:'no-store'}).then(r=>r.json());if(me.user){try{await loadAdmin();}catch(x){err(x.message+'\n내 싸바 회원번호: '+me.user.id+' (Cloudflare 설정 SAVA_ADMIN_UID 에 이 번호를 넣으면 관리자가 됩니다)');}}else err('관리자는 먼저 싸바에 로그인해 주세요.');}catch(e){err('관리자 확인을 할 수 없습니다.');}}const draft=sessionStorage.getItem('sava-kimchi-draft');if(draft){try{const d=JSON.parse(draft);['buyer','phone','recipient','recipientPhone','giftMessage','memo','payment'].forEach(k=>{if($(k)&&d[k]!=null)$(k).value=d[k]});if(d.orderType){document.querySelector('input[name=type][value="'+d.orderType+'"]').checked=true;typeChange()}if(d.address){if(d.orderType==='선물 보내기')$('giftAddress').value=d.address;else $('address').value=d.address;}qty=Math.max(1,Math.min(50,Number(d.quantity)||1));paintQty();sessionStorage.removeItem('sava-kimchi-draft');}catch(e){}}}
start();
})();
</script></body></html>
