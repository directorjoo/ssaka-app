<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  function myName() { try { var me = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); return me.from || ''; } catch (e) { return ''; } }

  function share(o) {

  }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
  function showOut() { $('out').hidden = false; setTimeout(function () { $('out').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300); }

  /* ---------- 바둑 규칙 (9줄, 테두리 붙인 판) ---------- */
  var N = 9, W = N + 2, SZ = W * W, DIRS = [1, -1, W, -W], DIAG = [W + 1, W - 1, -W + 1, -W - 1];
  function idx(x, y) { return (y + 1) * W + (x + 1); }
  var mk = new Int32Array(SZ), lm = new Int32Array(SZ), stamp = 0, gst = new Int16Array(SZ), gN = 0;
  function group(b, p) {
    stamp++; var c = b[p], n = 0, libs = 0; gst[n++] = p; mk[p] = stamp;
    for (var i = 0; i < n; i++) { var q = gst[i]; for (var d = 0; d < 4; d++) { var r = q + DIRS[d], v = b[r]; if (v === 0) { if (lm[r] !== stamp) { lm[r] = stamp; libs++; } } else if (v === c && mk[r] !== stamp) { mk[r] = stamp; gst[n++] = r; } } }
    gN = n; return libs;
  }
  function newState() { var b = new Int8Array(SZ); for (var i = 0; i < SZ; i++) { var x = i % W, y = (i / W) | 0; b[i] = (x === 0 || y === 0 || x === W - 1 || y === W - 1) ? 3 : 0; } return { b: b, ko: -1, cap: [0, 0, 0] }; }
  function copy(s) { return { b: s.b.slice(), ko: s.ko, cap: s.cap.slice() }; }
  // 둘 수 있으면 두고 true, 안 되면 판을 그대로 두고 false
  function play(s, p, col) {
    var b = s.b; if (p === s.ko || b[p] !== 0) return false;
    var opp = 3 - col, captured = 0, lastCap = -1; b[p] = col;
    for (var d = 0; d < 4; d++) { var r = p + DIRS[d]; if (b[r] === opp && group(b, r) === 0) { captured += gN; lastCap = r; for (var i = 0; i < gN; i++) b[gst[i]] = 0; } }
    var libs = group(b, p);
    if (libs === 0) { b[p] = 0; return false; }
    s.ko = (captured === 1 && gN === 1 && libs === 1) ? lastCap : -1;
    s.cap[col] += captured; return true;
  }
  function isEye(b, p, col) {
    for (var d = 0; d < 4; d++) { var v = b[p + DIRS[d]]; if (v !== col && v !== 3) return false; }
    var bad = 0, edge = 0; for (d = 0; d < 4; d++) { var w = b[p + DIAG[d]]; if (w === 3) edge = 1; else if (w === 3 - col) bad++; }
    return edge ? bad === 0 : bad < 2;
  }
  // 빈칸 주인: 이웃이 한 색뿐이면 그 색
  function area(b, own) {
    var sc = 0;
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var p = idx(x, y), v = b[p], o = 0;
      if (v === 1) o = 1; else if (v === 2) o = -1;
      else { var bl = 0, wh = 0; for (var d = 0; d < 4; d++) { var u = b[p + DIRS[d]]; if (u === 1) bl = 1; else if (u === 2) wh = 1; } o = bl && !wh ? 1 : wh && !bl ? -1 : 0; }
      sc += o; if (own) own[p] += o;
    }
    return sc;
  }
  var EMP = new Int16Array(SZ);
  function randomMove(s, col) {
    var b = s.b, n = 0;
    for (var p = W + 1; p < SZ - W - 1; p++) if (b[p] === 0) EMP[n++] = p;
    while (n > 0) { var k = (Math.random() * n) | 0, q = EMP[k]; EMP[k] = EMP[--n]; if (!isEye(b, q, col) && play(s, q, col)) return q; }
    return -1;
  }
  // 무작위로 끝까지 둬 보고 (흑 집 − 백 집 − 덤) 돌려줌
  function playout(s, col, amaf, own) {
    var passes = 0, moves = 0;
    while (passes < 2 && moves < 200) {
      var q = randomMove(s, col);
      if (q < 0) passes++; else { passes = 0; if (amaf && !amaf[q]) amaf[q] = col; }
      col = 3 - col; moves++;
    }
    return area(s.b, own) - komi;
  }

  /* ---------- 체리 생각 (몬테카를로) ---------- */
  function legalList(s, col) {
    var out = [];
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var p = idx(x, y); if (s.b[p] === 0 && p !== s.ko && !isEye(s.b, p, col)) { var t = copy(s); if (play(t, p, col)) out.push(p); } }
    return out;
  }
  function tactic(s, p, col) {
    var b = s.b, bonus = 0, opp = 3 - col;
    for (var d = 0; d < 4; d++) { var r = p + DIRS[d]; if (b[r] === opp && group(b, r) === 1) bonus += .18 + gN * .03; else if (b[r] === col && group(b, r) === 1) bonus += .1 + gN * .03; }
    var t = copy(s); play(t, p, col); var l = group(t.b, p);
    if (l === 1 && t.cap[col] === s.cap[col]) bonus -= .25 + gN * .02;
    var y = ((p / W) | 0) - 1, x = p % W - 1; if (x === 0 || y === 0 || x === N - 1 || y === N - 1) bonus -= movesPlayed < 12 ? .06 : .01;
    return bonus;
  }
  var own = new Float32Array(SZ), ownN = 0;
  function think(s, col, ms) {
    var cands = legalList(s, col), t0 = performance.now(), wins = 0, total = 0;
    own.fill(0); ownN = 0;
    if (!cands.length) return { p: -1, wr: .5 };
    var fw = new Float32Array(SZ), fv = new Float32Array(SZ), aw = new Float32Array(SZ), av = new Float32Array(SZ), amaf = new Int8Array(SZ), o2 = new Float32Array(SZ);
    var ci = 0;
    while (performance.now() - t0 < ms || total < 200) {
      var first = cands[ci++ % cands.length], t = copy(s); amaf.fill(0);
      play(t, first, col); amaf[first] = col;
      o2.fill(0);
      var sc = playout(t, 3 - col, amaf, o2), win = col === 1 ? sc > 0 : sc < 0;
      total++; if (win) wins++; fv[first]++; if (win) fw[first]++;
      for (var i = 0; i < cands.length; i++) { var q = cands[i]; if (amaf[q] === col) { av[q]++; if (win) aw[q]++; } }
      for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var p = idx(x, y); own[p] += o2[p]; }
      ownN++;
      if (total > 6000) break;
    }
    var best = -1, bv = -9, list = [];
    for (i = 0; i < cands.length; i++) {
      q = cands[i]; var v = (fw[q] + aw[q] * .6 + 1) / (fv[q] + av[q] * .6 + 2) + tactic(s, q, col);
      list.push({ p: q, v: v, wr: (fw[q] + 1) / (fv[q] + 2) });
    }
    list.sort(function (a, b) { return b.v - a.v; });
    var pick = list[0];
    if (lvl === 1 && list.length > 3 && Math.random() < .4) pick = list[1 + ((Math.random() * Math.min(4, list.length - 1)) | 0)];
    var settled = list.every(function (m) { return Math.abs(own[m.p] / ownN) > .9; });
    return { p: pick.p, wr: wins / total, settled: settled };
  }

  /* ---------- 화면·진행 ---------- */
  var KEY = 'sava-baduk-v1', rec = load(KEY, { w: 0, l: 0 }), lvl = 2, komi = 6.5, st, hist, snaps, over, undos, busy = false, passes = 0, movesPlayed = 0, final = null;
  var cv = $('cv'), ctx = cv.getContext('2d');
  var cl = +qp.get('l'), cm = +qp.get('m'), cn = (qp.get('n') || '').slice(0, 10);
  if (cm) { $('chal').hidden = false; $('chal').innerHTML = '📮 <b>' + esc(cn || '친구') + '</b>님은 체리를 <b>' + cm + '집</b> 차로 이겼어요! (' + (cl === 1 ? '살살' : '제대로') + ')<br>더 크게 이기면 내가 이겨요'; if (cl === 1 || cl === 2) lvl = cl; }
  function paintBest() { $('best').textContent = (rec.w || rec.l) ? '체리 상대 ' + rec.w + '승 ' + rec.l + '패' : ''; }
  function paintCap() { $('capB').textContent = '⚫ 따낸 돌 ' + st.cap[1]; $('capW').textContent = '⚪ 따낸 돌 ' + st.cap[2]; }
  function reset() {
    komi = lvl === 1 ? 0 : 6.5; st = newState(); hist = []; snaps = []; over = false; undos = 0; busy = false; passes = 0; movesPlayed = 0; final = null;
    $('out').hidden = true; $('msg').textContent = '아무 곳이나 콕! 내가 먼저 둬요';
    document.querySelectorAll('.lv button').forEach(function (x) { x.setAttribute('aria-pressed', +x.dataset.l === lvl ? 'true' : 'false'); });
    paintCap(); draw();
  }
  var S = 0, P = 0, C = 0;
  function size() { var w = cv.clientWidth || 340, d = window.devicePixelRatio || 1; cv.width = w * d; cv.height = w * d; S = w * d; C = S / (N + .2); P = C * .6; C = (S - 2 * P) / (N - 1); draw(); }
  function stone(cx, cy, r, col, alpha) {
    ctx.globalAlpha = alpha || 1;
    var g = ctx.createRadialGradient(cx - r * .35, cy - r * .35, r * .1, cx, cy, r);
    if (col === 1) { g.addColorStop(0, '#666'); g.addColorStop(1, '#111'); } else { g.addColorStop(0, '#fff'); g.addColorStop(1, '#d5d5d5'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
  }
  function draw() {
    if (!S) return; ctx.fillStyle = '#E9C27A'; ctx.fillRect(0, 0, S, S);
    ctx.strokeStyle = '#5A3420'; ctx.lineWidth = Math.max(1, S / 380);
    for (var i = 0; i < N; i++) { ctx.beginPath(); ctx.moveTo(P, P + i * C); ctx.lineTo(S - P, P + i * C); ctx.stroke(); ctx.beginPath(); ctx.moveTo(P + i * C, P); ctx.lineTo(P + i * C, S - P); ctx.stroke(); }
    ctx.fillStyle = '#5A3420'; [[2, 2], [2, 6], [6, 2], [6, 6], [4, 4]].forEach(function (q) { ctx.beginPath(); ctx.arc(P + q[0] * C, P + q[1] * C, C * .1, 0, 7); ctx.fill(); });
    for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) {
      var p = idx(x, y), v = st.b[p], cx = P + x * C, cy = P + y * C;
      if (v === 1 || v === 2) {
        var dead = final && final.owner[p] && final.owner[p] !== v;

        if (dead) { ctx.strokeStyle = '#B3132B'; ctx.lineWidth = C * .08; ctx.beginPath(); ctx.moveTo(cx - C * .2, cy - C * .2); ctx.lineTo(cx + C * .2, cy + C * .2); ctx.moveTo(cx + C * .2, cy - C * .2); ctx.lineTo(cx - C * .2, cy + C * .2); ctx.stroke(); }
      }

  }
  function cherryTurn() {
    busy = true; $('msg').textContent = '🍒 체리가 생각 중…';
    setTimeout(function () {
      var r = think(st, 2, lvl === 1 ? 250 : 1100);
      busy = false;
      if (movesPlayed > 24 && r.wr < .04) { $('msg').textContent = '🍒 체리가 돌을 던졌어요 (기권)'; return finish({ resign: 2 }); }
      if (r.p < 0 || r.settled || (passes > 0 && r.wr > .65)) {
        hist.push({ p: -1, c: 2 }); passes++;
        if (passes >= 2) return finish({});
        $('msg').textContent = '🍒 체리는 한 수 쉬어요. 내 차례 ⚫'; draw(); return;
      }
      play(st, r.p, 2); hist.push({ p: r.p, c: 2 }); passes = 0; movesPlayed++;
      buzz(10); paintCap(); draw(); $('msg').textContent = '내 차례예요 ⚫';
    }, 60);
  }
  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault(); if (over || busy) return;
    var r = cv.getBoundingClientRect(), k = S / r.width, x = Math.round(((e.clientX - r.left) * k - P) / C), y = Math.round(((e.clientY - r.top) * k - P) / C);
    if (x < 0 || y < 0 || x >= N || y >= N) return;
    var p = idx(x, y), before = copy(st);
    if (!play(st, p, 1)) { $('msg').textContent = st.b[p] ? '이미 돌이 있어요' : p === st.ko ? '패! 한 수 다른 데 두고 오세요' : '거긴 들어가면 바로 잡혀요'; buzz(40); return; }
    snaps.push({ s: before, h: hist.length, passes: passes, mp: movesPlayed });
    hist.push({ p: p, c: 1 }); passes = 0; movesPlayed++; buzz(15); paintCap(); draw();
    cherryTurn();
  });
  $('pass').addEventListener('click', function () {
    if (over || busy) return;
    snaps.push({ s: copy(st), h: hist.length, passes: passes, mp: movesPlayed });
    hist.push({ p: -1, c: 1 }); passes++; st.ko = -1;
    if (passes >= 2) return finish({});
    cherryTurn();
  });
  var last = null;
  function finish(o) {
    over = true; var diff, win;
    if (o.resign) { win = o.resign === 2 ? 1 : 2; diff = 0; }
    else {
      // 계가: 남은 판을 여러 번 끝까지 둬 보고 죽은 돌·집을 가림
      var ow = new Float32Array(SZ), n = 0, t0 = performance.now();
      while (performance.now() - t0 < 700 || n < 150) { var t = copy(st); t.ko = -1; playout(t, n % 2 ? 2 : 1, null, ow); n++; if (n > 3000) break; }
      var owner = new Int8Array(SZ), bl = 0, wh = 0;
      for (var y = 0; y < N; y++) for (var x = 0; x < N; x++) { var p = idx(x, y), a = ow[p] / n, v = st.b[p]; owner[p] = a > .3 ? 1 : a < -.3 ? 2 : (v === 1 || v === 2 ? v : 0); if (owner[p] === 1) bl++; else if (owner[p] === 2) wh++; }
      final = { owner: owner, bl: bl, wh: wh };
      diff = bl - wh - komi; win = diff > 0 ? 1 : 2; diff = Math.abs(diff);
    }
    var g, txt;
    if (win === 1) { rec.w++; g = lvl === 2 && !undos ? { e: '🏆', t: '바둑 국수' } : lvl === 2 ? { e: '⚫', t: '바둑 고수' } : { e: '😊', t: '잘했어요' }; txt = o.resign ? '체리가 돌을 던졌어요! 불계승' : diff + '집 차로 체리를 이겼어요!'; $('msg').textContent = '🎉 내가 이겼다!'; }
    else { rec.l++; g = { e: '🍒', t: '체리 승!' }; txt = '아깝다! ' + diff + '집 차로 졌어요'; $('msg').textContent = '🍒 체리가 이겼어요'; }
    var detail = final ? '<div class="s" style="font-size:16px">⚫ ' + final.bl + ' : ⚪ ' + final.wh + (komi ? ' + 덤 ' + komi : '') + '</div>' : '';
    save(KEY, rec); last = { win: win, d: o.resign ? 0 : diff, res: !!o.resign, g: g };
    var vs = cm && win === 1 && cl === lvl && !o.resign ? (diff > cm ? '<div class="s" style="color:#1E7A46">🎉 ' + esc(cn || '친구') + '님보다 크게 이겼어요!</div>' : '<div class="s">😅 ' + esc(cn || '친구') + '님은 ' + cm + '집 차였어요</div>') : '';
    $('result').innerHTML = '<div class="e">' + g.e + '</div><h2>' + g.t + '</h2><div class="s">' + txt + (undos ? ' (무르기 ' + undos + '번)' : '') + '</div>' + detail + vs;
    $('send').textContent = win === 1 ? '💬 친구한테 도전장 보내기' : '💬 친구한테 복수 부탁하기';
    paintBest(); draw(); showOut();
  }
  $('undo').addEventListener('click', function () {
    if (busy || !snaps.length) return;

    undos++; paintCap(); draw(); $('msg').textContent = '↩ 무르기! 내 차례예요';
  });
  $('again').addEventListener('click', reset);
  document.querySelectorAll('.lv button').forEach(function (x) { x.addEventListener('click', function () { if (busy) return; lvl = +x.dataset.l; reset(); }); });

    share({ url: u.href, title: (nm ? nm + ': ' : '') + t, desc: last.win === 1 ? '너는 몇 집 차로 이길래? 체리랑 9줄 바둑 한 판!' : '체리 바둑 생각보다 세요. 네가 대신 이겨 줘!', btn: '⚫ 바둑 두기' });
  });
