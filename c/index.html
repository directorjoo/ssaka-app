<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="../img/favicon.png?v=4">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png?v=4">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>싸바 SAVA</title>
  <!-- 링크만 붙여넣었을 때의 미리보기. "카톡으로 보내기" 버튼으로 보내면 카드별 제목·사진이 들어갑니다 -->
  <meta property="og:title" content="싸바카드가 도착했어요">
  <meta property="og:description" content="눌러서 카드를 열어보세요">
  <meta property="og:image" content="https://sava.kr/img/ssaka-share.png?v=5">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="../demo/css/card.css">
  <link rel="stylesheet" href="../css/sk.css?v=109">
  <link rel="stylesheet" href="../css/sk-world.css?v=11">
<script src="/js/launch.js?v=3"></script>
</head>
<body>
  <main id="app" class="card" aria-live="polite">
    <p class="loading">카드를 불러오는 중…</p>
  </main>
  <div id="toast" class="toast" role="status"></div>
  <script>window.SSAKA_CARDS = '../demo/cards/';</script>
  <script>
  // 11-26 미리보기 빈칸 찾기: 카드를 그리다 멈추면 무슨 오류인지 화면에 적어 둠 (대표님 캡처로 원인 확인)
  window.__savaErr = [];
  window.addEventListener('error', function (e) {
    var m = (e.message || 'error') + (e.filename ? ' @' + String(e.filename).split('/').pop() + ':' + e.lineno : '');
    window.__savaErr.push(m);
    setTimeout(function () {
      var app = document.getElementById('app');
      if (app && (!app.children.length || app.querySelector('.loading'))) app.innerHTML = '<p class="error" style="font:16px sans-serif;padding:24px;color:#B3132B;word-break:break-all">카드를 그리다 멈췄어요 🍒<br><small style="color:#555">' + m.replace(/</g, '&lt;') + '</small></p>';
    }, 0);
  });
  </script>
  <script src="../js/codec.js"></script>
  <script src="../js/inapp.js"></script>
  <script src="../js/designs.js?v=96"></script>
  <script src="../js/render.js?v=93"></script>
  <script src="../js/reserve.js"></script>
  <script src="../js/sound.js"></script>
  <script src="../js/store.js?v=3"></script>
  <script src="../js/roster.js?v=17"></script>
  <script src="../js/dues.js?v=1"></script>
  <script src="../js/album.js?v=2"></script>
  <script src="../demo/js/vcard.js"></script>
  <script src="../demo/js/card.js?v=102"></script>
  <script src="../js/share.js"></script>
<script src="../js/kback.js?v=45"></script>
<script src="/js/translate.js?v=1" defer></script>
<script src="../js/cherry.js?v=1"></script>
</body>
</html>
