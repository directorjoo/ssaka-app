<body>
<div class="wrap">

    <div><span>😊 잘했어요</span><span>5개 이상</span></div>

  <p class="foot">재미로 하는 싸바 놀이예요. 기록은 이 휴대폰에만 남아요.<br><a href="../?story=1">싸바가 뭐지?</a></p>
</div>
<script src="../js/install.js?v=2"></script>
<script src="../js/share.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var qp = new URLSearchParams(location.search);
  function myName() { try { var me = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); return me.from || ''; } catch (e) { return ''; } }
  if ($('me')) $('me').value = myName();
  function saveName() { var n = $('me').value.trim(); if (!n) return ''; try { var me = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); me.from = n; localStorage.setItem('eodiya-me-v1', JSON.stringify(me)); } catch (e) {} return n; }
  function share(o) {
    if (window.SsakaShare) return SsakaShare({ url: o.url, title: o.title, description: o.desc, imageUrl: 'https://sava.kr/img/eodiya-share.png?v=4', imageWidth: 1000, imageHeight: 600, buttonTitle: o.btn || '나도 해 보기', installTitle: '싸바 설치하기' });
    if (navigator.share) navigator.share({ title: o.title, text: o.desc, url: o.url }).catch(function () {});
  }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
  function showOut() { $('out').hidden = false; setTimeout(function () { $('out').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300); }

  var Q = [["과일", "사과", "시계", "수건", "생강"], ["과일", "포도", "파도", "푸딩", "판단"], ["과일", "수박", "소방", "신발", "새벽"], ["과일", "딸기", "떡국", "따귀", "뜨개"], ["과일", "참외", "차이", "청어", "처음"], ["동물", "사자", "사진", "수저", "시장"], ["동물", "기린", "가로", "거리", "구름"], ["동물", "오리", "우리", "요리", "위로"], ["음식", "김치", "기차", "가치", "공책"], ["음식", "라면", "로마", "루머", "라마"], ["음식", "만두", "마당", "모델", "모두"], ["나라", "일본", "연봉", "이불", "우비"], ["나라", "독일", "도움", "단어", "동요"], ["나라", "미국", "모기", "문고", "머그"], ["나라", "태국", "탁구", "퇴근", "타격"], ["도시", "부산", "버스", "박수", "보석"], ["도시", "여수", "우산", "의사", "요술"], ["도시", "순천", "사촌", "상추", "식초"], ["도시", "광주", "가지", "감자", "거짓"], ["채소", "오이", "우유", "아이", "여우"], ["직업", "가수", "감사", "교실", "간식"], ["직업", "배우", "바위", "병원", "비용"], ["직업", "감독", "고등", "기도", "계단"], ["운동", "축구", "친구", "창고", "출근"], ["운동", "야구", "악기", "연극", "아기"], ["운동", "당구", "단골", "대구", "도구"], ["운동", "등산", "도시", "단속", "대사"], ["꽃", "장미", "재미", "지문", "주말"], ["꽃", "국화", "공항", "계획", "고향"], ["꽃", "백합", "방학", "보험", "비행"], ["탈것", "택시", "털실", "탄산", "통신"], ["바다 생물", "문어", "마음", "모양", "미용"], ["바다 생물", "꼬막", "꼬마", "꾸밈", "꿀물"], ["음식", "홍어", "호응", "회의", "행운"]];
  var KEY = 'sava-chosung-v1', best = load(KEY, null), list = [], qi = 0, sc = 0, t0 = 0, tick = null, qT = null, qStart = 0, lock = false;
  function cho(w) { var L = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ'; return w.split('').map(function (c) { return L[Math.floor((c.charCodeAt(0) - 0xAC00) / 588)]; }).join(''); }
  function paintBest() { $('best').textContent = best ? '내 최고 ' + best.c + '개 · ' + best.s + '초' : ''; }
  function grade(c) { return c >= 10 ? { e: '🎓', t: '초성 박사' } : c >= 8 ? { e: '🧠', t: '척척박사' } : c >= 5 ? { e: '😊', t: '잘했어요' } : { e: '🌱', t: '한 번 더!' }; }
  var cc = +qp.get('c'), cs = +qp.get('s'), cn = (qp.get('n') || '').slice(0, 10);
  if (qp.has('c')) { $('chal').hidden = false; $('chal').innerHTML = '📮 <b>' + esc(cn || '친구') + '</b>님 기록: <b>' + cc + '개</b> 맞힘 · ' + cs + '초<br>더 많이(같으면 더 빨리) 맞히면 내가 이겨요'; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function start() {
    list = shuffle(Q.slice()).slice(0, 10); qi = 0; sc = 0; t0 = Date.now(); $('sc').textContent = '0'; $('out').hidden = true;
    $('go').hidden = true; $('qbox').hidden = false; clearInterval(tick);
    tick = setInterval(function () { $('tm').textContent = Math.floor((Date.now() - t0) / 1000); }, 250);
    ask();
  }
  function ask() {
    var q = list[qi]; lock = false;
    $('qn').textContent = (qi + 1) + ' / 10'; $('cat').textContent = '힌트: ' + q[0]; $('cho').textContent = cho(q[1]);
    var ch = $('ch'); ch.innerHTML = '';
    shuffle(q.slice(1)).forEach(function (w) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = w;
      b.addEventListener('click', function () { pick(b, w === q[1]); }); ch.appendChild(b);
    });
    var bar = $('bar'); bar.style.transition = 'none'; bar.style.transform = 'scaleX(1)'; void bar.offsetWidth;
    bar.style.transition = 'transform 10s linear'; bar.style.transform = 'scaleX(0)';
    clearTimeout(qT); qT = setTimeout(function () { pick(null, false); }, 10000);
  }
  function pick(b, ok) {
    if (lock) return; lock = true; clearTimeout(qT);
    var ans = list[qi][1];
    Array.prototype.forEach.call($('ch').children, function (x) { if (x.textContent === ans) x.classList.add('ok'); });
    if (ok) { sc++; $('sc').textContent = sc; buzz(25); } else { if (b) b.classList.add('no'); buzz(150); }
    setTimeout(function () { qi++; if (qi < 10) ask(); else end(); }, ok ? 650 : 1100);
  }
  var last = null;
  function end() {
    clearInterval(tick); $('qbox').hidden = true;
    var s = Math.round((Date.now() - t0) / 1000), g = grade(sc); last = { c: sc, s: s, g: g };
    var nb = !best || sc > best.c || (sc === best.c && s < best.s); if (nb) { best = { c: sc, s: s }; save(KEY, best); }
    var win = '';
    if (qp.has('c')) { var me = sc * 1000 - s, you = cc * 1000 - cs; win = me > you ? '<div class="s" style="color:#1E7A46">🎉 ' + esc(cn || '친구') + '님을 이겼어요!</div>' : me === you ? '<div class="s">🤝 비겼어요!</div>' : '<div class="s">😅 ' + esc(cn || '친구') + '님이 한 수 위!</div>'; }
    $('result').innerHTML = '<div class="e">' + g.e + '</div><h2>' + g.t + '</h2><div class="s">10문제 중 ' + sc + '개 · ' + s + '초' + (nb ? ' · 🏆 내 최고!' : '') + '</div>' + win;
    $('go').hidden = false; $('go').textContent = '🔁 새 문제로 한 판 더!'; paintBest(); showOut();
  }
  $('go').addEventListener('click', start);
  $('send').addEventListener('click', function () {
    if (!last) return; var nm = saveName(), u = new URL('https://sava.kr/chosung/');
    u.searchParams.set('c', last.c); u.searchParams.set('s', last.s); if (nm) u.searchParams.set('n', nm);
    share({ url: u.href, title: (nm ? nm + ': ' : '') + '🔤 초성 퀴즈 ' + last.c + '개! ' + last.g.e + ' ' + last.g.t, desc: '10문제 중 ' + last.c + '개 맞혔어요. ㅅㄱ = 사과? 시계? 너도 풀어 봐!', btn: '🔤 도전하기' });
  });
  paintBest();

})();
</script>
