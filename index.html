<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주경중 감독 - 모바일 프로필 명함</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(20, 20, 20, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            padding: 32px 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.8);
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .title-sub {
            font-size: 14px;
            color: #d1d5db;
            margin-bottom: 20px;
            font-weight: 400;
        }
        .bio {
            font-size: 13px;
            color: #9ca3af;
            line-height: 1.5;
            margin-bottom: 24px;
            padding: 0 10px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-primary {
            background: rgba(255, 255, 255, 0.9);
            color: #111111;
        }
        .btn-primary:hover {
            background: #ffffff;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 프로필 사진 (필요시 수정 가능) -->
        <img src="bg.jpg" alt="주경중 감독" class="profile-img">
        
        <h1>주경중 감독</h1>
        <div class="title-sub">영화감독 / 제작자</div>
        
        <div class="bio">
            즐겁고 행복한 세상을 위해 우리 모두 함께 해요!!<br>여수국제웹페스티벌 조직위원장
        </div>

        <div class="btn-group">
            <!-- 1. 연락처 자동 저장 (vCard 직접 연동) -->

                📇 연락처 저장하기
            </a>

            <!-- 2. 공식 홈페이지 -->
            <a href="https://yeosuiff.com" target="_blank" class="btn btn-secondary">
                🌐 공식 홈페이지
            </a>

            <!-- 3. 네이버 블로그 검색 -->
            <a href="https://m.search.naver.com/search.naver?where=m_blog&query=%EC%A3%BC%EA%B2%BD%EC%A4%91+site%3Ablog.naver.com" target="_blank" class="btn btn-secondary">
                ✍️ 네이버 블로그 검색
            </a>

            <!-- 4. 네이버 뉴스 검색 -->

                📰 네이버 뉴스 검색
            </a>
        </div>
    </div>

</body>
</html>
