<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 카카오톡 / SNS 링크 공유 시 미리보기 (Open Graph) 최적화 -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://directorjoo.github.io/ssaka-app/">
    <meta property="og:title" content="주경중 감독 - 싸바카드">
        <meta property="og:description" content="여수국제영화제 준비위원장 · 영화 &lt;동승&gt; 감독">
    <meta property="og:image" content="https://directorjoo.github.io/ssaka-app/bg2.jpg?v=13">
    <meta property="og:image:width" content="1080">
    <meta property="og:image:height" content="1080">

    <title>주경중 감독 - 싸바카드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Card Container */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background-color: #fff;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        /* Main Banner Image */
        .banner-img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Overlay Transparent Buttons Container */
        .overlay-buttons {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 22%;
            display: flex;
        }
        /* Individual Transparent Clickable Area */
        .touch-area {
            flex: 1;
            height: 100%;
            display: block;
            text-decoration: none;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0.3);
        }

        /* 슬림해진 팝업 레이어 스타일 */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: #fff;
            width: 85%;
            max-height: 50%;
            border-radius: 16px;
            padding: 24px 20px 20px 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        /* 우측 상단 X 닫기 버튼 */
        .modal-close-x {
            position: absolute;
            top: 12px;
            right: 16px;
            font-size: 22px;
            font-weight: bold;
            color: #888;
            cursor: pointer;
            background: none;
            border: none;
            line-height: 1;
        }
        .modal-close-x:hover {
            color: #000;
        }
        .modal-title {
            font-size: 19px;
            font-weight: bold;
            color: #111;
            margin-bottom: 12px;
        }
        .modal-desc {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: keep-all;
        }
        .modal-link-btn {
            display: block;
            background: #03cf5d;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        /* 이미지 + 투명 버튼을 한 묶음으로 (아래에 버튼이 추가돼도 위치 고정) */
        .banner-wrap { position: relative; }
        /* 카톡으로 보내기 버튼 */
        .share-bar {
            display: block;
            width: 100%;
            border: 0;
            background: #fee500;
            color: #191919;
            font-size: 17px;
            font-weight: 800;
            padding: 18px 12px;
            cursor: pointer;
            font-family: inherit;
        }
        .share-bar:active { background: #f2d900; }
    </style>
</head>
<body>

<div class="card-container">
    <!-- 메인 배너 이미지 (bg2.jpg) -->
    <div class="banner-wrap">
    <img src="bg2.jpg" alt="주경중 감독 - 싸바카드" class="banner-img">

    <!-- 배너 그림 하단 투명 터치 영역 (4개 버튼) -->
    <div class="overlay-buttons">
        <!-- 1. 연락처 저장: 같은 폴더의 joo.vcf 파일을 내려받음 (내용 수정은 joo.vcf에서) -->
        <a href="joo.vcf" download="주경중_감독.vcf" id="saveContact" class="touch-area" aria-label="연락처 및 명함URL 저장"></a>

        <!-- 2. 블로그 주경중 검색 (팝업창) -->
        <div class="touch-area" onclick="openModal('blogModal')" aria-label="블로그 검색"></div>

        <!-- 3. 네이버 뉴스 주경중 동대문 검색 (팝업창) -->
        <div class="touch-area" onclick="openModal('newsModal')" aria-label="네이버 뉴스 검색"></div>

        <!-- 4. 여수국제영화제 홈페이지 이동 (팝업창) -->
        <div class="touch-area" onclick="openModal('homeModal')" aria-label="홈페이지 바로가기"></div>
    </div>

    </div>

    <!-- 카톡으로 보내기 (무료 공유) -->
    <button type="button" class="share-bar" onclick="SsakaShare()">💬 이 카드 카톡으로 보내기</button>

    <!-- 팝업창 1: 블로그 안내 -->
    <div id="blogModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close-x" onclick="closeModal('blogModal')">✕</button>
            <div class="modal-title">네이버 블로그 검색</div>
            <div class="modal-desc">주경중 감독의 최신 소식 및 블로그 검색 결과를 확인하시겠습니까?</div>
            <a href="https://search.naver.com/search.naver?query=%EC%A3%BC%EA%B2%BD%EC%A4%91" target="_blank" class="modal-link-btn">네이버 블로그 바로가기</a>
        </div>
    </div>

    <!-- 팝업창 2: 네이버 뉴스 안내 -->
    <div id="newsModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close-x" onclick="closeModal('newsModal')">✕</button>
            <div class="modal-title">네이버 뉴스 검색</div>
            <div class="modal-desc">주경중 감독의 최신 뉴스를 확인하시겠습니까?</div>
            <a href="https://search.naver.com/search.naver?where=news&query=%EC%A3%BC%EA%B2%BD%EC%A4%91%20%EB%8F%99%EB%8C%80%EB%AC%B8" target="_blank" class="modal-link-btn" style="background:#0066cc;">네이버 뉴스 바로가기</a>
        </div>
    </div>

    <!-- 팝업창 3: 공식 홈페이지 안내 -->
    <div id="homeModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close-x" onclick="closeModal('homeModal')">✕</button>
            <div class="modal-title">공식 홈페이지 이동</div>
            <div class="modal-desc">여수국제영화제 홈페이지로 이동하시겠습니까?</div>
            <a href="http://Yeosuiff.com" target="_blank" class="modal-link-btn" style="background:#8a2be2;">홈페이지 바로가기</a>
        </div>
    </div>
</div>

<script>
    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
    }
    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }
</script>

<script src="js/share.js"></script>
<script src="js/inapp.js"></script>
<script>
    // 연락처 저장: 카톡 안에서는 막혀 있어서 사파리·크롬으로 넘겨 저장
    (function () {
        var a = document.getElementById('saveContact');
        if (!a || !window.SsakaInApp) return;
        function save() {
            if (SsakaInApp.isIOS) location.href = 'joo.vcf';   // 아이폰: 연락처 화면이 바로 열림
            else a.click();                                    // 안드로이드: 파일로 내려받기
        }
        a.addEventListener('click', function (e) {
            if (SsakaInApp.isKakao) {
                e.preventDefault();
                SsakaInApp.openExternal(SsakaInApp.withSaveFlag(location.origin + location.pathname));
            } else if (SsakaInApp.isIOS) {
                e.preventDefault();
                location.href = 'joo.vcf';
            }
        });
        if (SsakaInApp.takeSaveFlag()) setTimeout(save, 600);
    })();
</script>
</body>
</html>
