<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영화감독 주경중 - 프로필 명함</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 40px 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        .profile-header h1 {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .profile-header p {
            font-size: 14px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 32px;
        }
        .links-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px 20px;
            background: #ffffff;
            color: #1e293b;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .link-btn:active {
            transform: scale(0.98);
            background: #f8fafc;
        }
        .link-btn.highlight {
            background: #2563eb;
            color: #ffffff;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }
        .link-btn.highlight:active {
            background: #1d4ed8;
        }
        .link-btn.kakao {
            background: #fee500;
            color: #000000;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(254, 229, 0, 0.4);
        }
    </style>
</head>
<body>
    <div class="card-container">
        <div class="profile-header">
            <h1 id="user-name">주경중 감독</h1>
            <p id="user-bio">영화감독 · 프로듀서 · 제작자</p>
        </div>
        <div class="links-group">
            <a href="https://yeosuiff.com" class="link-btn" target="_blank">🌐 공식 홈페이지 바로가기</a>
            <a href="https://blog.naver.com/directorjoo" class="link-btn" target="_blank">📝 네이버 블로그 바로가기</a>
            <a href="https://m.search.naver.com/search.naver?where=m_news&query=%EC%A3%BC%EA%B2%BD%EC%A4%91%20-%EC%82%AC%EA%B8%B0" class="link-btn" target="_blank">📰 네이버 뉴스 보도기사 보기</a>
            <a href="#" class="link-btn highlight" onclick="downloadVCard(); return false;">🎴 내 연락처 전화번호에 자동 저장</a>
            <a href="tel:01058705815" class="link-btn">📞 주경중 감독에게 바로 전화하기</a>
            <a href="#" class="link-btn kakao" onclick="shareCard(); return false;">💬 카카오톡 / 명함 공유하기</a>
        </div>
    </div>

    <script>
        // 연락처 자동 저장 (vCard 다운로드) 기능
        function downloadVCard() {
            const vcardData = 
`BEGIN:VCARD
VERSION:3.0
FN:주경중 감독
TITLE:영화감독 / 프로듀서 / 제작자
TEL;TYPE=CELL:01058705815
URL;TYPE=WORK:https://yeosuiff.com
NOTE:싸카(SSAKA) 모바일 명함 연락처
END:VCARD`;

            const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', '주경중_감독_연락처.vcf');
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // 명함 공유 기능
        function shareCard() {
            if (navigator.share) {
                navigator.share({
                    title: '영화감독 주경중 모바일 명함',
                    text: '주경중 감독의 프로필 명함입니다.',
                    url: window.location.href
                });
            } else {
                navigator.clipboard.writeText(window.location.href);
                alert('명함 주소가 복사되었습니다. 카카오톡에 붙여넣기 해주세요!');
            }
        }
    </script>
</body>
</html>
