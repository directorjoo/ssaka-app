<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 카카오톡 / SNS 링크 공유 시 미리보기 (Open Graph) 설정 -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="주경중 감독 - 싸바카드">
    <meta property="og:description" content="주경중 감독 모바일 명함">
    <meta property="og:image" content="https://directorjoo.github.io/bg2.jpg">
    <meta property="og:image:width" content="800">
    <meta property="og:image:height" content="800">

    <title>주경중 감독 - 싸바카드</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        /* Card Container */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            background-color: #fff;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        /* Main Banner Image */
        .banner-img {
            width: 100%;
            height: auto;
            display: block;
        }
        /* Overlay Transparent Buttons Container */
        .overlay-buttons {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 22%;
            display: flex;
        }
        /* Individual Transparent Clickable Area */
        .touch-area {
            flex: 1;
            height: 100%;
            display: block;
            text-decoration: none;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: rgba(255, 255, 255, 0.3);
        }

        /* 팝업 레이어 스타일 */
        .modal-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-box {
            background: #fff;
            width: 100%;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }
        .modal-close-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
        }
        .modal-title {
            font-size: 18px;
            font-weight: bold;
            color: #111;
            margin-bottom: 10px;
        }
        .modal-desc {
            font-size: 14px;
            color: #555;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .modal-link-btn {
            display: block;
            background: #03cf5d;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="card-container">
    <!-- 메인 배너 이미지 (bg2.jpg) -->
    <img src="bg2.jpg" alt="주경중 감독 - 싸바카드" class="banner-img">

    <!-- 배너 그림 하단 투명 터치 영역 (4개 버튼) -->
    <div class="overlay-buttons">
        <!-- 1. 전화번호 저장 (이전과 동일한 아이폰 한글 깨짐 및 '알 수 없음' 제거 vCard) -->
        <a href="data:text/vcard;charset=utf-8;base64,QkVHSU46VkNBUkQNClZFUlNJT046My4wDQpOTjp3cnU7IO2gOyEuOuhnCDrg7TrjIDri6g7OztODANQ0ZOOua2gOyEuOuhnCDrg7TrjIDri6gNCk9SRzrv77sIO2gOyEuOuhnCDrg7TrjIDri6gNCnRlbjowMTA1ODcwNTgxNQ0KRU5EOlZDQVJE" download="주경중_감독.vcf" class="touch-area" aria-label="전화번호 저장"></a>

        <!-- 2. 블로그 주경중 검색 (팝업 띄우기) -->
        <div class="touch-area" onclick="openModal('blogModal')" aria-label="블로그 검색"></div>

        <!-- 3. 네이버 뉴스 주경중 동대문 검색 (팝업 띄우기) -->
        <div class="touch-area" onclick="openModal('newsModal')" aria-label="네이버 뉴스 검색"></div>

        <!-- 4. 홈페이지 이동 (팝업 띄우기) -->
        <div class="touch-area" onclick="openModal('homeModal')" aria-label="홈페이지 바로가기"></div>
    </div>

    <!-- 팝업창 1: 블로그 안내 -->
    <div id="blogModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('blogModal')">✕ 명함으로 돌아가기</button>
            <div class="modal-title">네이버 블로그 검색</div>
            <div class="modal-desc">주경중 감독의 최신 소식 및 블로그 검색 결과를 확인하시겠습니까?</div>
            <a href="https://search.naver.com/search.naver?query=%EC%A3%BC%EA%B2%BD%EC%A4%91" target="_blank" class="modal-link-btn">네이버 블로그 검색 결과 보기</a>
        </div>
    </div>

    <!-- 팝업창 2: 네이버 뉴스 안내 -->
    <div id="newsModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('newsModal')">✕ 명함으로 돌아가기</button>
            <div class="modal-title">네이버 뉴스 검색</div>
            <div class="modal-desc">주경중 감독 동대문 관련 최신 뉴스 기사를 확인하시겠습니까?</div>
            <a href="https://search.naver.com/search.naver?where=news&query=%EC%A3%BC%EA%B2%BD%EC%A4%91%20%EB%8F%99%EB%8C%80%EB%AC%B8" target="_blank" class="modal-link-btn" style="background:#0066cc;">네이버 뉴스 바로가기</a>
        </div>
    </div>

    <!-- 팝업창 3: 공식 홈페이지 안내 -->
    <div id="homeModal" class="modal-overlay">
        <div class="modal-box">
            <button class="modal-close-btn" onclick="closeModal('homeModal')">✕ 명함으로 돌아가기</button>
            <div class="modal-title">공식 홈페이지 이동</div>
            <div class="modal-desc">주경중 감독 공식 홈페이지(Yeosuiff.com)로 이동하시겠습니까?</div>
            <a href="http://Yeosuiff.com" target="_blank" class="modal-link-btn" style="background:#8a2be2;">홈페이지 바로가기</a>
        </div>
    </div>
</div>

<script>
    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
    }
    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }
</script>

</body>
</html>
