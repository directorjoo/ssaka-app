<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주경중 감독 - 모바일 프로필 명함</title>
    
    <!-- 카카오톡 공유 썸네일(OG 태그) 설정 -->
    <meta property="og:title" content="영화감독 주경중 - 공식 프로필 명함">
    <meta property="og:description" content="여수국제영화제준비위원장 공식 모바일 명함입니다.">
    <meta property="og:image" content="https://directorjoo.github.io/ssaka-app/thumb.jpg">
    <meta property="og:url" content="https://directorjoo.github.io/ssaka-app/">
    <meta property="og:type" content="website">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #111;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 명함 전체 프레임 컨테이너 */
        .card-container {
            position: relative;
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1 / 1;
            background-image: url('bg2.jpg'); /* 캔바에서 만든 전체 이미지 파일명 */
            background-size: cover;
            background-position: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        /* 하단 4개 버튼을 위한 투명 터치 영역 스타일 */
        .touch-link {
            position: absolute;
            bottom: 3%; /* 하단 배치 위치 */
            width: 22%; /* 4개 버튼 너비 배분 */
            height: 20%; /* 높이 설정 */
            cursor: pointer;
            z-index: 10;
        }

        /* 각 버튼별 좌측 위치(left) 개별 지정 */
        .btn-vcard { left: 4%; }   /* 1번째: 연락처 저장 (곰돌이 아이콘 영역) */
        .btn-blog { left: 28%; }   /* 2번째: 블로그 바로가기 */
        .btn-news { left: 52%; }   /* 3번째: 뉴스 검색 */
        .btn-home { left: 76%; }   /* 4번째: 홈페이지 바로가기 */
    </style>
</head>
<body>

    <div class="card-container">
        <!-- 1. 연락처 자동 저장 (vCard) -->
        <a href="data:text/vcard;charset=utf-8,%F%FE%FFBEGIN%3AVCARDS%0AVERSION%3A3.0%0AFN%3A%EC%A3%BC%EA%B2%BD%EC%A4%91%20%EA%B0%90%EB%8F%85%0ATITLE%3A%EC%97%85%EC%88%98%EA%B5%AD%EC%3%BC%EC%A0%9C%EC%98%81%ED%99%94%EC%A0%9C%EC%A4%80%EB%B9%84%EC%9C%84%EC%9B%90%EC%9E%A5%0ATEL%3A01058705815%0AURL%3Ahttps%3A%2F%2Fyeosuiff.com%0AEND%3AVCARD" download="주경중_감독.vcf" class="touch-link btn-vcard" title="연락처 저장"></a>

        <!-- 2. 블로그 주소 -->
        <a href="https://m.search.naver.com/search.naver?where=m_blog&query=%EC%A3%BC%EA%B2%BD%EC%A4%91+site%3Ablog.naver.com" target="_blank" class="touch-link btn-blog" title="블로그"></a>

        <!-- 3. 뉴스 검색 URL -->
        <a href="https://m.search.naver.com/search.naver?where=m_news&query=%EC%A3%BC%EA%B2%BD%EC%A4%91" target="_blank" class="touch-link btn-news" title="뉴스 검색"></a>

        <!-- 4. 홈페이지 바로가기 -->
        <a href="https://yeosuiff.com" target="_blank" class="touch-link btn-home" title="홈페이지"></a>
    </div>

</body>
</html>
