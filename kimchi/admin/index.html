<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>언니김치 주문관리 · 싸바</title><link rel="stylesheet" href="../../css/brand.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f7f5f2;color:#29231f;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}.w{max-width:760px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px 40px}h1{font-size:23px;margin:0 0 6px}.sub{color:#766e68;font-size:13px;margin:0 0 16px}.login{display:flex;gap:8px}input,select{font:inherit;min-height:46px;border:1px solid #ddd4ce;border-radius:11px;padding:0 12px;background:#fff}input{min-width:0;flex:1}button{font:inherit;font-weight:800;border:0;border-radius:11px;padding:0 14px;min-height:44px;background:#7f1d1d;color:white}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.pill{background:#fff;border:1px solid #e8e0da;border-radius:12px;padding:10px 13px;font-size:13px}.item{background:#fff;border:1px solid #eee7e1;border-radius:16px;padding:14px;margin:10px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.no{font-weight:900;color:#7f1d1d}.meta{font-size:12px;color:#81766f;margin:5px 0 10px}.details{font-size:14px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.actions{display:flex;gap:7px;align-items:center;margin-top:12px}.actions select{flex:1}.actions button{min-height:40px}.empty{padding:25px;text-align:center;color:#766e68}.err{color:#a11;font-size:13px;margin-top:8px}
</style></head><body><main class="w"><h1>🥬 언니김치 주문관리</h1><p class="sub">관리자 전용 · 주문자 정보는 암호화되어 저장됩니다.</p><div class="login"><input id="key" type="password" placeholder="관리자 비밀번호" autocomplete="current-password"><button id="open">주문내역 보기</button></div><div id="err" class="err"></div><div id="summary" class="summary" hidden></div><div id="list"></div></main><script>
(function(){var $=id=>document.getElementById(id),items=[],labels={new:'접수',paid:'입금 확인',preparing:'준비 중',shipped:'발송 완료',done:'배송 완료',canceled:'취소'};try{$('key').value=sessionStorage.getItem('sava-adm')||'';}catch(e){}
async function call(data){var r=await fetch('../../api/kimchi-orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.assign({admin:$('key').value.trim()},data))});var j=await r.json().catch(()=>({}));if(!r.ok||!j.ok)throw new Error(j.error==='key'?'관리자 비밀번호가 맞지 않습니다.':j.error==='setup'?'서버 암호화 설정이 필요합니다.':'요청을 처리하지 못했습니다.');return j;}
function paint(){var L=$('list');L.textContent='';$('summary').hidden=false;var counts={new:0,paid:0,preparing:0,shipped:0,done:0,canceled:0};items.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);$('summary').innerHTML='';[['전체',items.length],['접수',counts.new],['입금 확인',counts.paid],['준비 중',counts.preparing],['발송',counts.shipped]].forEach(x=>{var s=document.createElement('span');s.className='pill';s.textContent=x[0]+' '+x[1]+'건';$('summary').appendChild(s);});
if(!items.length){L.textContent='아직 접수된 주문이 없습니다.';L.className='empty';return;}L.className='';
items.forEach(x=>{var o=x.order,d=document.createElement('article');d.className='item';var top=document.createElement('div');top.className='top';var no=document.createElement('span');no.className='no';no.textContent=x.id;var st=document.createElement('strong');st.textContent=labels[x.status]||x.status;top.append(no,st);var meta=document.createElement('div');meta.className='meta';meta.textContent=new Date(x.created).toLocaleString('ko-KR')+' · '+o.orderType;var detail=document.createElement('div');detail.className='details';detail.textContent='주문자: '+o.buyer+' / '+o.phone+'\n'+(o.orderType==='선물 보내기'?'받는 분: '+o.recipient+' / '+o.recipientPhone+'\n':'')+'배송 주소: '+o.address+'\n수량: '+o.quantity+'박스 · '+Number(o.amount).toLocaleString('ko-KR')+'원\n결제: '+o.payment+'\n요청: '+(o.memo||'없음')+(o.giftMessage?'\n선물 메시지: '+o.giftMessage:'');var acts=document.createElement('div');acts.className='actions';var sel=document.createElement('select');Object.keys(labels).forEach(k=>{var op=document.createElement('option');op.value=k;op.textContent=labels[k];op.selected=x.status===k;sel.appendChild(op);});var btn=document.createElement('button');btn.textContent='상태 저장';btn.onclick=async()=>{try{await call({action:'status',id:x.id,status:sel.value});await load();}catch(e){$('err').textContent=e.message;}};acts.append(sel,btn);d.append(top,meta,detail,acts);L.appendChild(d);});}
async function load(){try{sessionStorage.setItem('sava-adm',$('key').value.trim());$('err').textContent='';var j=await call({action:'list'});items=j.items||[];paint();}catch(e){$('err').textContent=e.message;}}
$('open').onclick=load;$('key').onkeydown=e=>{if(e.key==='Enter')load();};if($('key').value)load();})();</script></body></html>
