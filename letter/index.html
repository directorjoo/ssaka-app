<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B3132B">
  <title>싸바 아침카드</title>
  <meta property="og:title" content="💌 싸바 아침카드 — 오늘 바로 쓸 수 있는 정보만">
  <meta property="og:description" content="어르신은 건강, 대표님은 매출, 배우는 오디션. 매일 아침 쓸모 있는 것만 골라 드려요.">
  <meta property="og:image" content="https://sava.kr/img/eodiya-hi.png?v=1">
  <link rel="icon" href="../img/favicon.png?v=3">
  <link rel="stylesheet" href="../css/brand.css">
  <style>
    * { box-sizing: border-box; } [hidden] { display: none !important; }
    html, body { margin: 0; background: #FFF8F3; color: var(--ink); font-family: var(--font); }
    .w { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 14px calc(120px + env(safe-area-inset-bottom)); }
    h1 { margin: 8px 0 2px; font-size: 27px; font-weight: 900; letter-spacing: -.03em; padding-right: 100px; }
    .sub { margin: 0 0 12px; color: var(--ink-2); font-size: 15px; }
    .who { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 18px; background: #F3ECE6; }
    .who button { min-height: 56px; border: 0; border-radius: 14px; background: none; font: inherit; font-size: 16.5px; font-weight: 900; color: #6b5a50; cursor: pointer; line-height: 1.15; }
    .who button small { display: block; font-size: 12.5px; font-weight: 700; opacity: .8; }
    .who button[aria-pressed="true"] { background: #fff; color: var(--ssaka); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
    .cities { display: grid; gap: 5px; margin: 10px 0 0; padding: 8px; border-radius: 18px; background: #fff; border: 1.5px solid #efe3da; }
    .cities .row { display: grid; grid-template-columns: 50px repeat(5, 1fr); gap: 5px; align-items: center; }
    .cities .row span { font-size: 14.5px; font-weight: 900; color: #8E0A1C; letter-spacing: -.03em; line-height: 1.1; word-break: keep-all; }
    .cities button { min-height: 38px; padding: 0; border-radius: 12px; border: 1.5px solid #e9dcd2; background: #FFF8F3; font: inherit; font-size: 15px; font-weight: 800; color: #5a4a42; cursor: pointer; }
    .cities button[aria-pressed="true"] { background: #1A4FB0; border-color: #1A4FB0; color: #fff; }
    .paper { position: relative; margin-top: 14px; padding: 22px 18px 18px; border-radius: 22px; background: #fff; box-shadow: 0 1px 0 #efe3da, 0 14px 30px -20px rgba(80,30,20,.45); }
    .paper::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px; border-radius: 22px 22px 0 0; background: repeating-linear-gradient(135deg, #B3132B 0 14px, #fff 14px 22px, #1A4FB0 22px 36px, #fff 36px 44px); }
    .paper.writing::before { height: 10px; animation: mail 0.9s linear infinite; }
    @keyframes mail { from { background-position: 0 0; } to { background-position: 62.2254px 0; } }
    .paper.writing .msg { animation: breathe 1.6s ease-in-out infinite; }
    .pen { display: inline-block; font-size: 26px; animation: pen 0.7s ease-in-out infinite alternate; transform-origin: 20% 90%; }
    @keyframes pen { from { transform: translateX(-6px) rotate(-8deg); } to { transform: translateX(6px) rotate(8deg); } }
    @keyframes breathe { 50% { opacity: .55; } }
    .dots i { font-style: normal; animation: dot 1.2s infinite; opacity: .2; }
    .dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes dot { 30% { opacity: 1; } 60%, 100% { opacity: .2; } }
    .date { color: var(--ink-2); font-size: 14.5px; font-weight: 800; }
    .hello { margin: 6px 0 14px; font-size: 22px; font-weight: 900; letter-spacing: -.03em; line-height: 1.4; word-break: keep-all; }
    .it { display: grid; grid-template-columns: 40px 1fr; gap: 10px; padding: 13px 0; border-top: 1px solid #f3ebe5; }
    .it i { font-style: normal; font-size: 28px; line-height: 1.1; text-align: center; }
    .it b { display: block; font-size: 18px; font-weight: 900; letter-spacing: -.02em; }
    .it p { margin: 4px 0 0; font-size: 16.5px; line-height: 1.6; word-break: keep-all; }
    .sum { margin: 10px 0 4px; font-size: 17px; line-height: 1.75; word-break: keep-all; }
    .src { margin-top: 16px; padding-top: 12px; border-top: 2px solid #f0e4dc; font-size: 14px; font-weight: 800; color: #8a7f78; }
    .gl { margin-top: 12px; font-size: 14.5px; font-weight: 900; color: #B3132B; }
    .li { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 12px 0; border-top: 1px solid #f3ebe5; color: inherit; text-decoration: none; }
    .li i { font-style: normal; font-size: 22px; line-height: 1.3; text-align: center; }
    .li b { display: block; font-size: 16.5px; font-weight: 800; line-height: 1.45; color: #1A4FB0; word-break: keep-all; }
    .li small { display: block; margin-top: 3px; font-size: 14px; color: #8a7f78; }
    .go { margin-top: 14px; padding: 12px 14px; background: #fbf5f1; border-radius: 12px; }
    .go b { display: block; font-size: 15px; margin-bottom: 4px; }
    .go a { display: block; padding: 7px 0; color: #B3132B; font-size: 15.5px; font-weight: 800; text-decoration: none; }
    .it a { display: inline-block; margin-top: 6px; color: #1A4FB0; font-size: 14.5px; font-weight: 800; text-decoration: none; }
    .sign { margin-top: 12px; padding-top: 12px; border-top: 1px dashed #e9cdb5; text-align: right; color: #8E0A1C; font-weight: 900; }
    .msg { padding: 40px 6px; text-align: center; color: var(--ink-2); font-size: 16px; line-height: 1.6; }
    .acts { display: grid; gap: 8px; margin-top: 14px; }
    .acts button, .acts a { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 58px; border: 0; border-radius: 18px; font: inherit; font-size: 18px; font-weight: 900; text-decoration: none; cursor: pointer; }
    .k { background: #FEE500; color: #191919; }
    .l { background: #F3ECE6; color: #5a4a42; font-size: 16px !important; min-height: 50px !important; }
    .sv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
    .sv a { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 52px; border-radius: 16px; font-size: 17px; font-weight: 900; text-decoration: none; }
    .sv .hm { background: #B3132B; color: #fff; box-shadow: 0 3px 0 #7E0C1E; }
    .sv .wh { background: #fff; color: #B3132B; border: 2px solid #B3132B; }
    .sv .mk { grid-column: 1 / -1; background: #FFF3EE; color: #8E0A1C; border: 2px dashed #B3132B; font-size: 16.5px; }
    .rcv .who, .rcv .cities { display: none !important; }
    .rcv .sub { margin-bottom: 0; }
    .note { margin: 14px 4px 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; word-break: keep-all; }
  </style>
</head>
<body>
<div class="w">
  <h1>💌 싸바 아침카드</h1>
  <p class="sub">오늘 바로 쓸 수 있는 것만. 단톡방에 한 번 눌러 보내세요.</p>
  <div class="who" id="who"></div>
  <div class="cities" id="cities"></div>
  <div class="sv" id="svTop" hidden><a class="hm" href="/">🏠 싸바 홈</a><a class="wh" href="/?story=1">🍒 싸바가 뭐지?</a></div>
  <article class="paper writing" id="paper"><div class="msg">카드를 만드는 중이에요…</div></article>
  <div class="sv" id="svBot" hidden><a class="hm" href="/">🏠 싸바 홈</a><a class="wh" href="/?story=1">🍒 싸바가 뭐지?</a><a class="mk" id="svMake" href="/make/">✨ 싸바에서 내 카드 만들어 보세요</a></div>
  <div class="acts">
    <button type="button" class="k" id="send">💬 단톡방에 보내기</button>
    <a class="l" href="../today/">☀️ 오늘의 싸바 더 보기</a>
  </div>
  <p class="note">뉴스는 제목과 원문 링크만 모아 오고, 카드는 AI가 오늘 자료로 정리해요. 신청·지원 조건은 꼭 원문에서 확인해 주세요.</p>
</div>
<script src="../js/share.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var WHO = [['senior', '💊 어르신', '건강'], ['boss', '💰 대표님', '매출'], ['actor', '🎬 배우', '오디션']];
  // 17개 광역자치단체를 권역별로 묶어 한눈에
  var GROUPS = [['수도권', ['서울', '경기', '인천']], ['강원·충청', ['강원', '대전', '세종', '충북', '충남']], ['호남·제주', ['광주', '전북', '전남', '제주']], ['영남', ['부산', '대구', '울산', '경북', '경남']]];
  var CITIES = [].concat.apply([], GROUPS.map(function (g) { return g[1]; }));
  var OLD = { 여수: '전남', 순천: '전남', 목포: '전남', 전주: '전북' };
  var qs = new URLSearchParams(location.search), k = qs.get('k'), city = qs.get('city');
  try { k = k || localStorage.getItem('sava-letter-k'); city = city || localStorage.getItem('sava-letter-city'); } catch (e) {}
  if (!WHO.some(function (w) { return w[0] === k; })) k = 'boss';
  city = OLD[city] || city;
  if (CITIES.indexOf(city) < 0) city = '광주';
  var last = null;
  // 받는 사람 화면(카톡으로 받은 링크 ?r=1): 위의 어르신·대표님·배우·지역 고르기는 감추고 카드만 보여 줌
  var rcv = qs.get('r') === '1';
  if (rcv) {
    document.body.classList.add('rcv');
    $('svTop').hidden = false; $('svBot').hidden = false;
    document.querySelector('.sub').textContent = '오늘 바로 쓸 수 있는 것만 골라 보내 드려요.';
    $('send').textContent = '💬 나도 단톡방에 보내기';
  }
  function bar() {
    var w = $('who'); w.innerHTML = '';
    WHO.forEach(function (x) { var b = document.createElement('button'); b.type = 'button'; b.innerHTML = x[1] + '<small>' + x[2] + '</small>'; b.setAttribute('aria-pressed', x[0] === k ? 'true' : 'false'); b.addEventListener('click', function () { k = x[0]; go(); }); w.appendChild(b); });
    var c = $('cities'); c.innerHTML = ''; c.hidden = k === 'actor';
    GROUPS.forEach(function (g) {
      var row = document.createElement('div'); row.className = 'row';
      var lb = document.createElement('span'); lb.textContent = g[0]; row.appendChild(lb);
      g[1].forEach(function (n) { var b = document.createElement('button'); b.type = 'button'; b.textContent = n; b.setAttribute('aria-pressed', n === city ? 'true' : 'false'); b.addEventListener('click', function () { city = n; go(); }); row.appendChild(b); });
      c.appendChild(row);
    });
  }
  function go() {
    if (!rcv) try { localStorage.setItem('sava-letter-k', k); localStorage.setItem('sava-letter-city', city); } catch (e) {}
    history.replaceState(null, '', '?k=' + k + (k === 'actor' ? '' : '&city=' + encodeURIComponent(city)) + (rcv ? '&r=1' : ''));
    var MK = { senior: ['greeting', '💌 싸바에서 안부 카드 만들어 보세요'], boss: ['restaurant', '✨ 싸바에서 우리 가게 카드 만들어 보세요'], actor: ['actor', '🎬 싸바에서 내 프로필 만들어 보세요'] }[k];
    $('svMake').href = '/make/?ind=' + MK[0]; $('svMake').textContent = MK[1];
    bar(); last = null;
    var p = $('paper'); p.classList.add('writing'); p.innerHTML = '<div class="msg"><span class="pen">✍️</span><br>오늘 카드를 만드는 중이에요<span class="dots"><i>.</i><i>.</i><i>.</i></span><br><small>처음엔 20초쯤 걸릴 수 있어요</small></div>';
    var want = k + city;
    fetch('/api/letter?k=' + k + '&city=' + encodeURIComponent(city)).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (d) {
      if (want !== k + city) return; last = d;
      var dt = new Date(d.date + 'T00:00:00'), DAYS = '일월화수목금토';
      var h = '<div class="date">' + (dt.getMonth() + 1) + '월 ' + dt.getDate() + '일 ' + DAYS[dt.getDay()] + '요일 · ' + esc(WHO.filter(function (w) { return w[0] === k; })[0][1]) + ' 아침카드</div>';
      h += '<div class="hello">' + esc(d.hello) + '</div>';
      if (d.list) {
        if (d.summary) h += '<p class="sum">' + esc(d.summary) + '</p>';
        if (d.items.length) h += '<div class="src">출처 · 제목을 누르면 원문이 열려요</div>';
        var pg = '';
        h += d.items.length ? d.items.map(function (x) { var g = x.g && x.g !== pg ? '<div class="gl">' + esc(x.g) + '</div>' : ''; pg = x.g || pg; return g + '<a class="li" href="' + esc(x.url) + '" target="_blank" rel="noopener"><i>' + esc(x.icon || '•') + '</i><span><b>' + esc(x.title) + '</b>' + (x.body ? '<small>' + esc(x.body) + '</small>' : '') + '</span></a>'; }).join('') : '<div class="msg">오늘은 새 소식이 없어요. 아래 바로가기에서 확인해 보세요.</div>';
        if (d.links && d.links.length) h += '<div class="go"><b>바로가기</b>' + d.links.map(function (x) { return '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">' + esc(x.t) + ' ›</a>'; }).join('') + '</div>';
      } else
      h += d.items.map(function (x) { return '<div class="it"><i>' + esc(x.icon || '•') + '</i><div><b>' + esc(x.title) + '</b><p>' + esc(x.body) + '</p>' + (x.url ? '<a href="' + esc(x.url) + '" target="_blank" rel="noopener">원문 보기 ›</a>' : '') + '</div></div>'; }).join('');
      h += '<div class="sign">— 🍒 싸바 드림</div>';
      p.classList.remove('writing'); p.innerHTML = h;
    }).catch(function () { if (want === k + city) { p.classList.remove('writing'); } if (want === k + city) p.innerHTML = '<div class="msg">카드를 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.</div>'; });
  }
  $('send').addEventListener('click', function () {
    var who = WHO.filter(function (w) { return w[0] === k; })[0];
    var url = location.origin + '/letter/?k=' + k + (k === 'actor' ? '' : '&city=' + encodeURIComponent(city)) + '&r=1';
    var desc = last && last.summary ? (last.hello + ' ' + last.summary) : last ? (last.hello + ' · ' + last.items.slice(0, 3).map(function (x) { return x.icon + ' ' + x.title; }).join(' · ')) : '오늘 바로 쓸 수 있는 정보만 골라 드려요';
    var opt = { title: '💌 싸바 아침카드 · ' + who[1] + ' ' + who[2], description: desc.slice(0, 120), url: url, buttonTitle: '카드 열기', noButtons: true };
    if (window.SsakaShare) SsakaShare(opt); else if (navigator.share) navigator.share({ title: opt.title, text: desc, url: url });
  });
  go();
})();
</script>
<script src="/js/home.js?v=10" defer></script>
</body>
</html>
