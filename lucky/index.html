<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var KEY = 'sava-lucky-v1';
  var st = { bank: 0, plays: 0, best: {} };
  try { var sv = JSON.parse(localStorage.getItem(KEY) || 'null'); if (sv) st = Object.assign(st, sv); } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
  try { var me = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); if (me.from) $('me').value = me.from; } catch (e) {}
  $('me').addEventListener('change', function () {
    try { var o = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); o.from = $('me').value.trim(); localStorage.setItem('eodiya-me-v1', JSON.stringify(o)); } catch (e) {}
  });

  // ---------- 오늘의 숫자 (한국 날짜 기준, 전국 같은 숫자 · 일요일은 7.77) ----------
  var POOL = [3140, 5550, 8280, 1000, 2580, 9990, 3330, 5250, 7070, 1230, 8880, 2020, 6060, 4320, 1110, 2220, 9090, 5670, 3690, 1350];
  function kstDay() { var d = new Date(Date.now() + 9 * 3600000); return { n: Math.floor(d.getTime() / 86400000), w: d.getUTCDay(), m: d.getUTCMonth() + 1, d: d.getUTCDate() }; }
  var K = kstDay();
  var DAY = K.w === 0 ? 7770 : POOL[((K.n * 7) % POOL.length + POOL.length) % POOL.length];
  function fmt(ms) { return (ms / 1000).toFixed(2); }
  $('dayNum').textContent = K.m + '월 ' + K.d + '일 · ' + fmt(DAY) + '초';

  var tab = '777', mode = 'see';
  function target() { return tab === '777' ? 7000 : DAY; }
  function bestKey() { return (tab === '777' ? '777' : 'd' + K.n) + '-' + mode; }
  function paintTarget() { $('tgt').textContent = fmt(target()); $('tgtBig').textContent = fmt(target()); }

  // ---------- 도전장으로 들어온 경우 ----------
  var q = new URLSearchParams(location.search);
  var chal = null;
  if (q.get('r')) {
    chal = { r: +q.get('r'), t: +(q.get('t') || 7000), m: q.get('m') === 'blind' ? 'blind' : 'see', n: (q.get('n') || '').slice(0, 10) };
    if (chal.t !== 7000) { if (chal.t === DAY) tab = 'day'; else chal.t = 7000; }
    mode = chal.m;
    var diff = Math.abs(chal.r - chal.t);
    var c = $('chal'); c.hidden = false;
    c.innerHTML = '';
    var b1 = document.createElement('b'); b1.textContent = (chal.n || '친구') + '님';
    c.appendChild(b1);
    c.appendChild(document.createTextNode('의 도전장 🍒 ' + (chal.m === 'blind' ? '눈 감고 ' : '') + fmt(chal.t) + '초 목표에 ' + fmt(chal.r) + '초 (' + (diff === 0 ? '잭팟!' : fmt(diff) + '초 차이') + '). 이 기록 깰 수 있어요?'));
  }

  function press(group, attr, val) { document.querySelectorAll(group + ' button').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset[attr] === val ? 'true' : 'false'); }); }
  function syncButtons() { press('.tabs', 'tab', tab); press('.modes', 'mode', mode); paintTarget(); }
  document.querySelectorAll('.tabs button').forEach(function (b) { b.addEventListener('click', function () { if (running) return; tab = b.dataset.tab; syncButtons(); reset(); }); });
  document.querySelectorAll('.modes button').forEach(function (b) { b.addEventListener('click', function () { if (running) return; mode = b.dataset.mode; syncButtons(); reset(); }); });
  syncButtons();

  function bank() { $('bank').innerHTML = '<small>내 체리 (재미용)</small>' + won(st.bank); }
  function won(n) {
    if (n >= 1e12) return (n / 1e12).toFixed(n % 1e12 ? 1 : 0) + '조';
    if (n >= 1e8) return Math.floor(n / 1e8).toLocaleString() + '억' + (n % 1e8 >= 1e4 ? ' ' + Math.floor((n % 1e8) / 1e4).toLocaleString() + '만' : '');
    if (n >= 1e4) return Math.floor(n / 1e4).toLocaleString() + '만';
    return n.toLocaleString();
  }
  bank();

  // ---------- 소리 (직접 합성 · 저작권 걱정 없음) ----------
  var AC = null;
  function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
  function tone(f, t0, dur, type, vol, slideTo) {
    var a = ac(); if (!a) return;
    var o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
    o.type = type || 'sawtooth'; o.frequency.setValueAtTime(f, a.currentTime + t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + t0 + dur);
    lp.type = 'lowpass'; lp.frequency.value = 2600;
    g.gain.setValueAtTime(0.0001, a.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, a.currentTime + t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + t0 + dur);
    o.connect(lp); lp.connect(g); g.connect(a.destination); o.start(a.currentTime + t0); o.stop(a.currentTime + t0 + dur + 0.05);
  }
  function noise(t0, dur, vol, hp) {
    var a = ac(); if (!a) return;
    var len = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    var s = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();
    f.type = 'highpass'; f.frequency.value = hp || 1200; g.gain.value = vol || 0.3;
    s.buffer = buf; s.connect(f); f.connect(g); g.connect(a.destination); s.start(a.currentTime + t0);
  }
  var SND = {
    tick: function () { tone(1400, 0, 0.05, 'square', 0.06); },
    stop: function () { tone(880, 0, 0.08, 'square', 0.08); },
    fanfare: function () { // 빰빠바밤~ 빠바밤!
      var N = [523, 523, 523, 659, 784, 659, 784, 1047];
      var T = [0, .12, .24, .36, .62, .86, .98, 1.12];
      N.forEach(function (f, i) { tone(f, T[i], i === 7 ? 1.3 : .2, 'sawtooth', .16); tone(f / 2, T[i], i === 7 ? 1.3 : .2, 'square', .06); });
      [1047, 1319, 1568].forEach(function (f) { tone(f, 1.12, 1.3, 'triangle', .1); });
      for (var i = 0; i < 26; i++) tone(1800 + Math.random() * 1800, 1.2 + i * 0.07, .12, 'triangle', .07); // 금화 짤랑짤랑
      noise(1.12, 1.4, .18, 3000);
    },
    big: function () { [659, 784, 1047, 1319].forEach(function (f, i) { tone(f, i * .1, .35, 'sawtooth', .14); }); for (var i = 0; i < 8; i++) tone(2000 + Math.random() * 1500, .4 + i * .06, .1, 'triangle', .07); },
    clap: function () { for (var i = 0; i < 9; i++) noise(i * 0.09 + Math.random() * 0.03, 0.08, 0.35, 1500); },
    ok: function () { tone(660, 0, .12, 'triangle', .14); tone(880, .12, .2, 'triangle', .14); },
    wah: function () { tone(392, 0, .3, 'sawtooth', .13, 370); tone(370, .32, .3, 'sawtooth', .13, 349); tone(349, .64, .7, 'sawtooth', .13, 260); } // 뿌뿌뿌~
  };

  // ---------- 체리 비 ----------
  var cv = $('fx'), cx = cv.getContext('2d'), parts = [], raf = 0;
  var cherry = new Image(); cherry.src = '../img/cherry.svg';
  function fit() { var r = window.devicePixelRatio || 1; cv.width = innerWidth * r; cv.height = innerHeight * r; cx.setTransform(r, 0, 0, r, 0, 0); }
  fit(); addEventListener('resize', fit);
  function rain(n, gold) {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var i = 0; i < n; i++) parts.push({ x: Math.random() * innerWidth, y: -40 - Math.random() * innerHeight * .8, vy: 2 + Math.random() * 4, vx: (Math.random() - .5) * 2, r: Math.random() * 6.28, vr: (Math.random() - .5) * .2, s: 22 + Math.random() * 22, coin: gold && Math.random() < .45 });
    if (!raf) loop();
  }
  function loop() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(function (p) { return p.y < innerHeight + 60; });
    parts.forEach(function (p) {
      p.y += p.vy; p.x += p.vx; p.vy += .06; p.r += p.vr;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r);
      if (p.coin) { cx.fillStyle = '#FFD24A'; cx.beginPath(); cx.ellipse(0, 0, p.s * .42, p.s * .42 * Math.abs(Math.cos(p.r * 2)) + 2, 0, 0, 6.28); cx.fill(); cx.strokeStyle = '#B8860B'; cx.lineWidth = 2; cx.stroke(); }
      else if (cherry.complete) cx.drawImage(cherry, -p.s / 2, -p.s / 2, p.s, p.s);
      cx.restore();
    });
    raf = parts.length ? requestAnimationFrame(loop) : 0;
    if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
  }

  // ---------- 게임 ----------
  var running = false, t0 = 0, frame = 0, lastSec = -1, armedAt = 0, last = null;
  function show(ms) {
    var s = Math.floor(ms / 1000), r = Math.floor((ms % 1000) / 10);
    $('clock').innerHTML = s + '.<span class="ms">' + String(r).padStart(2, '0') + '</span>';
  }
  function tickLoop() {
    var e = performance.now() - t0;
    if (mode === 'blind' && e > 3000) { $('clock').classList.add('hide'); $('clock').innerHTML = '?.<span class="ms">??</span>'; $('hint').textContent = '🙈 속으로 세어 보세요…'; }
    else show(e);
    var sec = Math.floor(e / 1000); if (sec !== lastSec && sec > 0 && (mode !== 'blind' || e <= 3000)) SND.tick(); lastSec = sec;
    if (e > 30000) { stopAt(performance.now()); return; }
    frame = requestAnimationFrame(tickLoop);
  }
  function reset() {
    running = false; cancelAnimationFrame(frame);
    $('clock').classList.remove('hide'); show(0);
    $('go').textContent = '시작'; $('go').classList.remove('run');
    $('hint').textContent = mode === 'blind' ? '3초 뒤엔 숫자가 사라져요. 몸속 시계를 믿으세요!' : '시작을 누르고, 목표 숫자에 멈춰!';
  }
  function start() {
    ac();
    $('result').classList.remove('show', 'jack');
    running = true; lastSec = 0; t0 = performance.now(); armedAt = t0 + 400;
    $('go').textContent = '멈춰!'; $('go').classList.add('run');
    $('hint').textContent = '목표 ' + fmt(target()) + '초에 누르세요';
    frame = requestAnimationFrame(tickLoop);
  }
  function stopAt(ts) {
    running = false; cancelAnimationFrame(frame);
    var ms = Math.max(0, Math.floor((ts - t0) / 10) * 10); // 100분의 1초 단위 (초시계처럼 버림)
    $('clock').classList.remove('hide'); show(ms); SND.stop();
    $('go').textContent = '다시 시작'; $('go').classList.remove('run');
    judge(ms);
  }
  // 손가락이 닿은 그 순간의 시각(event.timeStamp)으로 잼 — 화면 그리는 시간과 무관
  $('go').addEventListener('pointerdown', function (e) {
    e.preventDefault();
    var ts = (e.timeStamp && e.timeStamp > 1e3 && e.timeStamp < performance.now() + 50) ? e.timeStamp : performance.now();
    if (running) { if (ts < armedAt) return; stopAt(ts); }
    else start();
  });
  $('go').addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); var ts = performance.now(); if (running) { if (ts >= armedAt) stopAt(ts); } else start(); } });

  function judge(ms) {
    var tgt = target(), d = Math.abs(ms - tgt), blind = mode === 'blind';
    var tier;
    if (d === 0) tier = blind ? { b: '👑', t: '전설의 잭팟!!', w: 1e11, s: 'fanfare', n: 400 } : { b: '💰', t: '잭팟!!!', w: 1e10, s: 'fanfare', n: 300 };
    else if (d <= 10) tier = { b: '🎉', t: blind ? '눈 감고 대박!' : '대박!', w: blind ? 1e9 : 1e8, s: 'big', n: 90 };
    else if (d <= 50) tier = { b: '👏', t: '아깝다!', w: blind ? 1e7 : 1e6, s: 'clap', n: 24 };
    else if (d <= 200) tier = { b: '🙂', t: '괜찮네!', w: blind ? 1e5 : 1e4, s: 'ok', n: 6 };
    else tier = { b: '😅', t: ms > tgt ? '몸속 시계 고장?' : '너무 급했어요!', w: 0, s: 'wah', n: 0 };
    st.plays++; st.bank += tier.w;
    var k = bestKey(), prev = st.best[k], newBest = prev == null || d < Math.abs(prev - tgt);
    if (newBest) st.best[k] = ms;
    save(); bank();
    last = { ms: ms, d: d, t: tgt, m: mode, tier: tier };

    var r = $('result');
    $('rBadge').textContent = tier.b; $('rTitle').textContent = tier.t;
    $('rNum').innerHTML = '<b>' + fmt(ms) + '초</b> · ' + (d === 0 ? '오차 0.00초!' : fmt(d) + '초 차이');
    $('rWin').textContent = tier.w ? '+' + won(tier.w) + ' 체리' : '체리 0개 · 다시 도전!';
    var bk = st.best[k];
    $('rBest').textContent = newBest && prev != null ? '🏆 내 최고 기록 경신!' : '내 최고 기록 ' + fmt(bk) + '초 (' + fmt(Math.abs(bk - tgt)) + '초 차이)';
    if (chal && chal.t === tgt && chal.m === mode) {
      var cd = Math.abs(chal.r - chal.t);
      $('rBest').textContent += d < cd ? ' · ' + (chal.n || '친구') + '님 기록 격파! 😎' : d === cd ? ' · ' + (chal.n || '친구') + '님과 동점!' : ' · ' + (chal.n || '친구') + '님한테 아직 졌어요';
    }
    r.classList.toggle('jack', d <= 10);
    r.classList.add('show');
    SND[tier.s]();
    if (tier.n) rain(tier.n, d === 0);
    if (d === 0) { $('flash').classList.remove('on'); void $('flash').offsetWidth; $('flash').classList.add('on'); $('wrap').classList.add('shake'); setTimeout(function () { $('wrap').classList.remove('shake'); }, 600); if (navigator.vibrate) navigator.vibrate([80, 60, 80, 60, 300]); }
    setTimeout(function () { r.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 250);
  }

  $('again').addEventListener('click', function () { $('result').classList.remove('show'); reset(); $('stage').scrollIntoView({ behavior: 'smooth', block: 'center' }); });

  $('send').addEventListener('click', function () {
    if (!last) return;
    var name = $('me').value.trim();
    var u = new URL('https://sava.kr/lucky/');
    u.searchParams.set('r', last.ms); if (last.t !== 7000) u.searchParams.set('t', last.t);
    if (last.m === 'blind') u.searchParams.set('m', 'blind'); if (name) u.searchParams.set('n', name);
    var who = name ? name + ': ' : '';
    var title = last.d === 0 ? who + '💰 ' + (last.m === 'blind' ? '눈 감고 ' : '') + '잭팟 터졌다! ' + fmt(last.ms) + '초' : who + '🍒 ' + fmt(last.ms) + '초! ' + fmt(last.d) + '초 차이로 잭팟 놓침';
    var desc = (last.m === 'blind' ? '[눈 감고] ' : '') + '목표 ' + fmt(last.t) + '초에 딱 맞추면 잭팟 100억 체리. 너는 몇 초?';
    if (window.SsakaShare) SsakaShare({ url: u.href, title: title, description: desc, imageUrl: 'https://sava.kr/img/lucky-share.png?v=2', imageWidth: 800, imageHeight: 800, buttonTitle: '내가 잭팟 터뜨리기', installTitle: '싸바 설치하기' });
  });

  if (window.SsakaInstall) SsakaInstall.chip($('chipBox'), '싸바 홈 화면에 추가');
  reset();
})();
</script>
