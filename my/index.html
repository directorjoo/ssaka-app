<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <meta name="theme-color" content="#B3132B">
  <meta name="robots" content="noindex">
  <title>내 싸바</title>
  <link rel="icon" href="/img/favicon.png?v=4">
  <!-- 11-26 대표님: 관리자가 보내 준 앱만 보이는 '내 싸바'. 네 가지 다 보이는 싸바 홈(/app/)은 관리자만 -->
  <script src="/js/gate.js?v=1"></script>
  <script>
    (function () {
      var G = window.SavaGate; if (!G || G.full()) return;
      var a = G.list();
      if (a.length === 1) location.replace(G.APPS[a[0]].url); // 받은 앱이 하나면 바로 그 앱으로
    })();
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { background: linear-gradient(180deg, #FFFFFF 0%, #FFF8EF 45%, #FCEEDC 100%); color: #1A1A1A; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; word-break: keep-all; }
    .w { max-width: 520px; margin: 0 auto; padding: calc(64px + env(safe-area-inset-top)) 18px 40px; }
    h1 { margin: 0 0 6px; font-size: 30px; font-weight: 900; letter-spacing: -0.04em; }
    h1 b { color: #B3132B; }
    .lead { margin: 0 0 22px; font-size: 16px; font-weight: 700; color: #6B5A4A; line-height: 1.5; }
    .app { display: flex; align-items: center; gap: 16px; margin: 0 0 12px; padding: 16px; border-radius: 22px; background: #fff; border: 1px solid #F0E4D6; box-shadow: 0 10px 24px -18px rgba(110, 40, 20, .5); text-decoration: none; color: inherit; }
    .app:active { transform: scale(.98); }
    .app img { flex: none; width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 3px 8px rgba(0, 0, 0, .18); }
    .app b { display: block; font-size: 21px; font-weight: 900; letter-spacing: -0.03em; }
    .app span { display: block; margin-top: 3px; font-size: 15px; font-weight: 700; color: #7A6A5A; }
    .app em { margin-left: auto; font-style: normal; font-size: 22px; font-weight: 900; color: #B3132B; }
    .empty { padding: 26px 20px; border-radius: 22px; background: linear-gradient(90deg, #F7CF4E 0%, #FFE58A 55%, #FFF3C4 100%); border: 1px solid #EDB52E; font-size: 17px; font-weight: 800; line-height: 1.6; color: #3B2A06; text-align: center; }
    .empty small { display: block; margin-top: 6px; font-size: 15px; font-weight: 700; color: #4A3104; }
    .story { display: block; margin: 22px auto 0; width: fit-content; padding: 12px 22px; border-radius: 999px; background: linear-gradient(180deg, #C8243C, #B3132B); color: #fff; font-size: 16px; font-weight: 800; text-decoration: none; }
    .adm { margin-top: 26px; padding: 14px 16px; border-radius: 18px; background: #FFF6D9; border: 1.5px solid #F5D46B; font-size: 15px; font-weight: 700; color: #5A4310; }
    .adm a { color: #B3132B; font-weight: 900; }
  </style>
</head>
<body>
<main class="w">
  <h1>내 <b>싸바</b></h1>
  <p class="lead" id="lead">받은 앱을 눌러서 여세요.</p>
  <div id="apps"></div>
  <div class="adm" id="adm" hidden>🔑 관리자 폰이에요. 네 가지가 다 보이는 <a href="/app/">싸바 전체 홈 ›</a></div>
</main>
<script>
  (function () {
    var G = window.SavaGate, box = document.getElementById('apps');
    var ids = G.full() ? Object.keys(G.APPS) : G.list();
    if (G.full()) document.getElementById('adm').hidden = false;
    if (!ids.length) {
      document.getElementById('lead').textContent = '';
      box.innerHTML = '<div class="empty">아직 받은 앱이 없어요.<small>카톡으로 받은 싸바 링크를 눌러 주세요.</small></div>';
      return;
    }
    ids.forEach(function (id) {
      var a = G.APPS[id], el = document.createElement('a');
      el.className = 'app'; el.href = a.url;
      el.innerHTML = '<img alt="" src="' + a.icon + '"><div><b></b><span></span></div><em aria-hidden="true">›</em>';
      el.querySelector('b').textContent = a.name; el.querySelector('span').textContent = a.sub;
      box.appendChild(el);
    });
  })();
</script>
<script src="/js/home.js?v=17" defer data-home="/my/"></script>
</body>
</html>
