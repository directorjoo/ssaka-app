<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var qp = new URLSearchParams(location.search);
  function myName() { try { var me = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); return me.from || ''; } catch (e) { return ''; } }
  if ($('me')) $('me').value = myName();
  function saveName() { var n = $('me').value.trim(); if (!n) return ''; try { var me = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); me.from = n; localStorage.setItem('eodiya-me-v1', JSON.stringify(me)); } catch (e) {} return n; }
  function share(o) {

    if (navigator.share) navigator.share({ title: o.title, text: o.desc, url: o.url }).catch(function () {});
  }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function load(k, d) { try { var v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }
  function fmt(n) { return n.toLocaleString('ko-KR'); }

  var N = 7, FR = ['🍒', '🍓', '🍋', '🍇', '🍊', '🍏'], TIME = 60;
  var KEY = 'sava-pang-v1', best = load(KEY, 0), g, state = 'ready', score = 0, left = TIME, combo = 0, sel = null, idle = 0, hint = null, lastT = 0, swapA = null, swapB = null, pops = [];
  var cv = $('cv'), ctx = cv.getContext('2d'), S = 0, C = 0;
  var cs = +qp.get('s'), cn = (qp.get('n') || '').slice(0, 10);
  if (cs) { $('chal').hidden = false; $('chal').innerHTML = '📮 <b>' + esc(cn || '친구') + '</b>님은 <b>' + fmt(cs) + '점</b>! 이길 수 있을까요?'; }
  function paintBest() { $('best').textContent = best ? '내 최고 ' + fmt(best) + '점' : ''; }
  function tile(t) { return { t: t, sp: 0, x: 0, y: 0, s: 1, die: 0 }; }
  function rnd() { return (Math.random() * FR.length) | 0; }
  function fill() {
    g = [];
    for (var r = 0; r < N; r++) { g.push([]); for (var c = 0; c < N; c++) { var t; do { t = rnd(); } while ((c >= 2 && g[r][c - 1].t === t && g[r][c - 2].t === t) || (r >= 2 && g[r - 1][c].t === t && g[r - 2][c].t === t)); var o = tile(t); o.x = c; o.y = r - N - 1 - Math.random(); g[r].push(o); } }
    if (!findMove()) fill();
  }
  // 줄 맞은 칸 찾기
  function matches() {
    var hit = [], runs = [], r, c, k;
    for (r = 0; r < N; r++) { hit.push([]); for (c = 0; c < N; c++) hit[r].push(0); }
    for (r = 0; r < N; r++) for (c = 0; c < N;) { k = c; while (k < N && g[r][k] && g[r][c] && g[r][k].t === g[r][c].t) k++; if (k - c >= 3) { runs.push({ r: r, c: c, n: k - c, h: 1 }); for (var i = c; i < k; i++) hit[r][i] = 1; } c = Math.max(k, c + 1); }
    for (c = 0; c < N; c++) for (r = 0; r < N;) { k = r; while (k < N && g[k][c] && g[r][c] && g[k][c].t === g[r][c].t) k++; if (k - r >= 3) { runs.push({ r: r, c: c, n: k - r, h: 0 }); for (i = r; i < k; i++) hit[i][c] = 1; } r = Math.max(k, r + 1); }
    return { hit: hit, runs: runs };
  }
  function swapT(a, b) { var t = g[a.r][a.c]; g[a.r][a.c] = g[b.r][b.c]; g[b.r][b.c] = t; }
  function findMove() {
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) for (var d = 0; d < 2; d++) {
      var b = d ? { r: r + 1, c: c } : { r: r, c: c + 1 }; if (b.r >= N || b.c >= N) continue;
      var a = { r: r, c: c }; swapT(a, b); var ok = matches().runs.length > 0; swapT(a, b); if (ok) return [a, b];
    }
    return null;
  }
  function settled() { for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) { var o = g[r][c]; if (!o || o.die || Math.abs(o.x - c) > .01 || Math.abs(o.y - r) > .01) return false; } return true; }
  function resolve() {
    var m = matches(); if (!m.runs.length) return false;
    combo++; var made = [], cnt = 0, r, c;
    m.runs.forEach(function (run) {
      if (run.n < 4) return;
      var pr = run.r + (run.h ? 0 : (run.n / 2 | 0)), pc = run.c + (run.h ? (run.n / 2 | 0) : 0);
      [swapA, swapB].forEach(function (s) { if (s && m.hit[s.r][s.c] && (run.h ? s.r === run.r && s.c >= run.c && s.c < run.c + run.n : s.c === run.c && s.r >= run.r && s.r < run.r + run.n)) { pr = s.r; pc = s.c; } });
      made.push({ r: pr, c: pc, t: g[pr][pc].t }); left = Math.min(TIME, left + 1.5);
    });
    // 번개 과일이 터지면 가로·세로 전부
    var q = []; for (r = 0; r < N; r++) for (c = 0; c < N; c++) if (m.hit[r][c] && g[r][c].sp) q.push([r, c]);
    while (q.length) { var p = q.pop(); for (var i = 0; i < N; i++) [[p[0], i], [i, p[1]]].forEach(function (z) { if (!m.hit[z[0]][z[1]]) { m.hit[z[0]][z[1]] = 1; if (g[z[0]][z[1]].sp) q.push(z); } }); }
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) if (m.hit[r][c]) { g[r][c].die = 1; cnt++; }
    made.forEach(function (mm) { var o = tile(mm.t); o.sp = 1; o.x = mm.c; o.y = mm.r; o.keep = 1; g[mm.r][mm.c].next = o; });
    var gain = cnt * 10 * combo; score += gain; pops.push({ x: (swapB || { c: 3 }).c, y: (swapB || { r: 3 }).r, t: '+' + gain + (combo > 1 ? ' 콤보' + combo : ''), a: 1 });
    $('score').textContent = fmt(score) + '점'; if (combo > 1) $('msg').textContent = combo + '연속 팡! 🎉'; buzz(combo > 1 ? 30 : 15);
    return true;
  }
  function gravity() {
    for (var c = 0; c < N; c++) {
      var col = []; for (var r = N - 1; r >= 0; r--) { var o = g[r][c]; if (o.die) { if (o.next) col.push(o.next); } else col.push(o); }
      var k = 0; for (r = N - 1; r >= 0; r--) { if (k < col.length) g[r][c] = col[k++]; else { var n = tile(rnd()); n.x = c; n.y = -1 - (k++ - col.length); g[r][c] = n; } }
    }
  }
  function step(dt) {
    var anyDie = false;
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) { var o = g[r][c];
      if (o.die) { o.s -= dt * 5; if (o.s > 0) anyDie = true; continue; }
      var sp = dt * 12; o.x += Math.max(-sp, Math.min(sp, c - o.x)); o.y += Math.max(-sp, Math.min(sp, r - o.y));
    }
    if (state === 'busy') {
      if (anyDie) return;
      var dead = false; for (r = 0; r < N; r++) for (c = 0; c < N; c++) if (g[r][c].die) dead = true;
      if (dead) { gravity(); return; }
      if (!settled()) return;
      if (resolve()) return;
      if (swapA && combo === 0) { swapT(swapA, swapB); swapA = swapB = null; $('msg').textContent = '그 자리는 안 맞아요 😅'; buzz(40); return; }
      swapA = swapB = null; combo = 0; state = left > 0 ? 'play' : 'end'; idle = 0;
      if (state === 'end') return end();
      if (!findMove()) { $('msg').textContent = '🔀 맞출 데가 없어서 섞었어요'; fill(); }
    }
  }
  function size() { var w = cv.clientWidth || 340, d = window.devicePixelRatio || 1; cv.width = w * d; cv.height = w * d; S = w * d; C = S / N; }
  function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function draw(now) {
    if (!S) return; ctx.clearRect(0, 0, S, S);
    for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) { ctx.fillStyle = (r + c) % 2 ? 'rgba(255,255,255,.92)' : 'rgba(255,241,243,.95)'; rr(c * C + 2, r * C + 2, C - 4, C - 4, C * .18); ctx.fill(); }
    if (sel) { ctx.strokeStyle = '#B3132B'; ctx.lineWidth = C * .07; rr(sel.c * C + 4, sel.r * C + 4, C - 8, C - 8, C * .18); ctx.stroke(); }
    var hb = hint && idle > 5 ? 1 + Math.sin(now / 120) * .08 : 1;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, S, S); ctx.clip();
    for (r = 0; r < N; r++) for (c = 0; c < N; c++) { var o = g[r][c]; if (o.s <= 0) continue;
      var sc = o.s * (hint && idle > 5 && ((hint[0].r === r && hint[0].c === c) || (hint[1].r === r && hint[1].c === c)) ? hb : 1), cx = (o.x + .5) * C, cy = (o.y + .5) * C;
      if (o.sp) { ctx.fillStyle = 'rgba(255,196,0,' + (.55 + Math.sin(now / 150) * .25) + ')'; ctx.beginPath(); ctx.arc(cx, cy, C * .46 * sc, 0, 7); ctx.fill(); }
      ctx.font = Math.round(C * .66 * sc) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.fillText(FR[o.t], cx, cy + C * .03);
      if (o.sp) { ctx.font = Math.round(C * .32) + 'px "Apple Color Emoji","Noto Color Emoji",sans-serif'; ctx.fillText('⚡', cx + C * .28, cy - C * .28); }
    }
    ctx.restore();
    pops = pops.filter(function (p) { return p.a > 0; });
    pops.forEach(function (p) { ctx.globalAlpha = Math.max(0, p.a); ctx.fillStyle = '#B3132B'; ctx.strokeStyle = '#fff'; ctx.lineWidth = C * .08; ctx.font = '900 ' + Math.round(C * .4) + 'px sans-serif'; var y = (p.y + .5) * C - (1 - p.a) * C; ctx.strokeText(p.t, (p.x + .5) * C, y); ctx.fillText(p.t, (p.x + .5) * C, y); ctx.globalAlpha = 1; p.a -= .02; });
  }
  function loop(now) {
    var dt = Math.min(.05, (now - lastT) / 1000 || 0); lastT = now;
    if (state === 'play' || state === 'busy') {
      left -= dt; idle += dt; if (left < 0) left = 0;
      $('time').textContent = '⏱ ' + Math.ceil(left); $('tbar').style.width = (left / TIME * 100) + '%';
      $('tbar').style.background = left < 10 ? '#B3132B' : '#FFC400';
      if (left <= 0 && state === 'play') { state = 'end'; end(); }
    }
    if (g) { step(dt); draw(now); }
    requestAnimationFrame(loop);
  }
  function trySwap(a, b) {
    if (state !== 'play' || left <= 0) return; if (Math.abs(a.r - b.r) + Math.abs(a.c - b.c) !== 1) return;
    swapT(a, b); swapA = a; swapB = b; combo = 0; sel = null; idle = 0; hint = findMove(); state = 'busy'; $('msg').textContent = ' ';
  }

  cv.addEventListener('pointerdown', function (e) { e.preventDefault(); if (state !== 'play') return; var p = cell(e); if (p.r < 0 || p.c < 0 || p.r >= N || p.c >= N) return; down = p; try { cv.setPointerCapture(e.pointerId); } catch (x) {} });

  });
  function start() {

  }
  var last = null;
  function grade(s) { return s >= 8000 ? { e: '👑', t: '팡팡 여왕' } : s >= 5000 ? { e: '💎', t: '팡팡 고수' } : s >= 2500 ? { e: '🍒', t: '팡팡 체리' } : { e: '🌱', t: '팡팡 새싹' }; }

    last = { s: score, g: gr }; $('msg').textContent = '⏰ 끝!';
    var vs = cs ? (score > cs ? '<div class="s" style="color:#1E7A46">🎉 ' + esc(cn || '친구') + '님(' + fmt(cs) + '점)을 이겼어요!</div>' : '<div class="s">😅 ' + esc(cn || '친구') + '님은 ' + fmt(cs) + '점이었어요</div>') : '';

  });
