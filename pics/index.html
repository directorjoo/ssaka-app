<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#B3132B">
  <title>사진이 왔어요 · 싸바</title>
  <meta property="og:title" content="사진이 왔어요 📷">
  <meta property="og:description" content="눌러서 보기">
  <meta property="og:image" content="https://sava.kr/img/today-share.jpg?v=1">
  <meta property="og:type" content="website">
  <link rel="icon" href="../img/favicon.png?v=3">
  <link rel="stylesheet" href="../css/brand.css">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #fff; color: var(--ink); font-family: var(--font); }
    [hidden] { display: none !important; }
    .w { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom)); }
    .who { font-size: 15px; font-weight: 800; color: var(--ink-2); }
    h1 { margin: 2px 0 6px; font-size: 30px; font-weight: 900; letter-spacing: -.03em; color: #14823C; }
    .tip { margin: 0 0 14px; font-size: 14px; color: var(--ink-2); }
    .list { display: grid; gap: 12px; }
    .ph { position: relative; border-radius: 18px; overflow: hidden; background: #f3f3f5; }
    .ph img { display: block; width: 100%; height: auto; }
    .ph span { position: absolute; left: 10px; top: 10px; padding: 3px 10px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 13px; font-weight: 800; }
    .msg { padding: 30px 16px; border-radius: 18px; background: #f5f5f7; text-align: center; font-size: 16px; font-weight: 700; color: var(--ink-2); word-break: keep-all; }
    .go { display: block; margin-top: 18px; min-height: 58px; line-height: 58px; border-radius: 18px; background: var(--ssaka); color: #fff; text-align: center; font-size: 18px; font-weight: 900; text-decoration: none; }
  </style>
<script src="/js/launch.js?v=3"></script>
</head>
<body>
<div class="w">
  <div class="who" id="who"></div>
  <h1 id="h">📷 사진이 왔어요</h1>
  <p class="tip">사진을 꾹 누르면 내 폰에 저장할 수 있어요.</p>
  <div class="list" id="list"><div class="msg">불러오는 중…</div></div>
  <a class="go" id="goMk" href="../eodiya/">💬 나도 싸바? 보내기</a>
  <script>if (window.SAVA_QUIET) document.getElementById('goMk').style.display = 'none';</script>
</div>
<script src="../js/codec.js"></script>
<script src="../js/kback.js?v=44"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  function show(c) {
    var L = $('list'); L.innerHTML = '';
    var ps = c && Array.isArray(c.p) ? c.p.filter(function (u) { return /^https:\/\/[a-z0-9.-]*kakaocdn\.net\//i.test(u); }).slice(0, 9) : [];
    if (!ps.length) { L.innerHTML = '<div class="msg">사진을 찾을 수 없어요. 시간이 오래 지나 지워졌을 수 있어요.</div>'; return; }
    if (c.from) $('who').textContent = String(c.from).slice(0, 12) + '님이 보냈어요';
    $('h').textContent = '📷 사진 ' + ps.length + '장';
    document.title = '사진 ' + ps.length + '장 · 싸바';
    ps.forEach(function (u, i) {
      var d = document.createElement('div'); d.className = 'ph';
      var im = document.createElement('img'); im.src = u; im.alt = '사진 ' + (i + 1); im.loading = i < 2 ? 'eager' : 'lazy';
      im.onerror = function () { d.innerHTML = '<div class="msg">이 사진은 지워졌어요</div>'; };
      d.appendChild(im);
      if (ps.length > 1) { var s = document.createElement('span'); s.textContent = (i + 1) + ' / ' + ps.length; d.appendChild(s); }
      L.appendChild(d);
    });
  }
  var d = q.get('d'), s = q.get('s');
  if (d && window.SsakaCodec) return show(SsakaCodec.decode(d));
  if (s && /^[A-Za-z0-9]{6,12}$/.test(s)) {
    fetch('../api/card/' + s).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      show(j && j.d && window.SsakaCodec ? SsakaCodec.decode(j.d) : null);
    }).catch(function () { show(null); });
    return;
  }
  show(null);
})();
</script>
<script src="/js/translate.js?v=1" defer></script>
</body>
</html>
