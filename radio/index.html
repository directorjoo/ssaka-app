<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <meta name="theme-color" content="#B3132B">
  <title>라디오 · TV · 싸바</title>
  <meta property="og:title" content="📻 라디오 · 📺 TV 바로 듣고 보기 · 싸바">
  <meta property="og:description" content="KBS·MBC·SBS·CBS·국악방송 라디오와 24시간 뉴스를 한 번에. 가입·로그인 없이 싸바에서 바로 들어요.">
  <meta property="og:image" content="https://sava.kr/img/today-share.jpg?v=1">
  <link rel="icon" href="../img/favicon.png?v=4">
  <link rel="stylesheet" href="../css/brand.css">
  <style>
    * { box-sizing: border-box; } [hidden] { display: none !important; }
    html, body { margin: 0; background: #FFF8F3; color: var(--ink); font-family: var(--font); }
    .w { max-width: 520px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); }
    h1 { margin: 8px 0 4px; font-size: 28px; font-weight: 900; letter-spacing: -.03em; }
    .sub { margin: 0 0 6px; color: var(--ink-2); font-size: 15.5px; line-height: 1.6; word-break: keep-all; }
    h2 { display: flex; align-items: center; gap: 8px; margin: 26px 2px 10px; font-size: 21px; font-weight: 900; letter-spacing: -.02em; }
    .list { display: grid; gap: 10px; }
    .ch { display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 12px; padding: 12px 12px 12px 12px; border-radius: 20px; background: #fff; box-shadow: 0 1px 0 #efe3da, 0 6px 16px -12px rgba(80,30,20,.35); }
    .ch .logo { display: grid; place-items: center; width: 56px; height: 56px; border-radius: 16px; color: #fff; font-weight: 900; font-size: 15px; letter-spacing: -.04em; text-align: center; line-height: 1.05; }
    .ch b { display: block; font-size: 18.5px; font-weight: 900; letter-spacing: -.03em; }
    .ch span { display: block; margin-top: 2px; color: var(--ink-2); font-size: 14.5px; line-height: 1.4; word-break: keep-all; }
    .ch .btns { display: flex; flex-direction: column; gap: 6px; }
    .ch a.play { display: inline-flex; align-items: center; justify-content: center; gap: 4px; min-width: 76px; min-height: 44px; padding: 0 12px; border-radius: 14px; background: var(--ssaka); color: #fff; text-decoration: none; font-weight: 900; font-size: 16px; }
    .ch a.app { display: inline-flex; align-items: center; justify-content: center; min-height: 34px; padding: 0 10px; border-radius: 12px; border: 1.5px solid #eadbd0; color: #6b5a50; text-decoration: none; font-weight: 800; font-size: 13.5px; }
    .tv .ch a.play { background: #1A4FB0; }
    .now { position: sticky; top: 0; z-index: 5; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin: 14px 0 0; padding: 14px 14px 14px 18px; border-radius: 22px; background: #B3132B; color: #fff; box-shadow: 0 10px 24px -14px rgba(120,10,30,.7); }
    .now b { display: block; font-size: 20px; font-weight: 900; letter-spacing: -.03em; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .now span { display: block; margin-top: 2px; font-size: 14.5px; opacity: .95; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .now button { min-width: 84px; min-height: 52px; border: 0; border-radius: 16px; background: #FFD400; color: #3a0a12; font: 900 18px var(--font); }
    .ch button.play { display: inline-flex; align-items: center; justify-content: center; min-width: 76px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 14px; background: var(--ssaka); color: #fff; font: 900 16px var(--font); }
    .ch.on { outline: 3px solid #FFD400; }
    .ch.on button.play { background: #3a0a12; }
    .note { margin: 22px 4px 0; color: var(--ink-2); font-size: 14px; line-height: 1.65; word-break: keep-all; }
  </style>
</head>
<body>
<div class="w">
  <h1>📻 라디오 · 📺 TV</h1>
  <p class="sub">라디오는 ▶ 듣기만 누르면 싸바 안에서 바로 나와요. 가입·로그인 필요 없어요. 한 번 들은 채널은 다음에 맨 위 단추 하나로 이어 들을 수 있어요.</p>

  <div class="now" id="now" hidden>
    <div><b id="nowName"></b><span id="nowState"></span></div>
    <button type="button" id="nowBtn">▶ 듣기</button>
  </div>
  <audio id="au" playsinline preload="none"></audio>

  <h2>📻 라디오</h2>
  <div class="list" id="radio"></div>

  <h2>📺 TV · 24시간 뉴스</h2>
  <div class="list tv" id="tv"></div>

  <p class="note">라디오는 방송사가 인터넷으로 내보내는 소리를 싸바에서 그대로 틀어 드려요. 혹시 소리가 안 나오면 방송사 듣기 화면으로 바로 넘겨 드려요. TV는 방송사 화면이 새 창으로 열리니, 그 창을 닫거나(✕) ‘뒤로’를 누르면 싸바로 돌아와요.</p>
</div>
<script>
(function () {
  var ua = navigator.userAgent, ios = /iPhone|iPad|iPod/i.test(ua), and = /Android/i.test(ua);
  // [채널 id, 이름, 설명, 로고 글자, 로고 색, 안 될 때 열 방송사 듣기 화면]
  var RADIO = [
    ['cbs939', 'CBS 음악FM', '93.9MHz · 가요·팝·클래식', 'CBS<br>93.9', '#e4572e', 'https://www.cbs.co.kr/'],
    ['kbs2fm', 'KBS 쿨FM', 'FM 89.1MHz · 가요·팝', 'KBS<br>쿨FM', '#1d3f8f', 'https://onair.kbs.co.kr/index.html?sname=onair&stype=live&ch_code=25'],
    ['kbs1r', 'KBS 1라디오 (AM)', 'AM 711kHz · 뉴스·시사', 'KBS<br>AM', '#1d3f8f', 'https://onair.kbs.co.kr/index.html?sname=onair&stype=live&ch_code=21'],
    ['mbcfm4u', 'MBC FM4U', '91.9MHz · 가요·팝', 'MBC<br>FM4U', '#111', 'https://mini.imbc.com/'],
    ['mbcsfm', 'MBC 표준FM', '95.9MHz · 시사·가요', 'MBC<br>표준', '#111', 'https://mini.imbc.com/'],
    ['sbspower', 'SBS 파워FM', '107.7MHz · 가요·팝', 'SBS<br>파워', '#0a7a3f', 'https://www.sbs.co.kr/radio/gorealra.html'],
    ['sbslove', 'SBS 러브FM', '103.5MHz · 시사·가요', 'SBS<br>러브', '#0a7a3f', 'https://www.sbs.co.kr/radio/gorealra.html'],
    ['cbs981', 'CBS 표준FM', '98.1MHz · 시사·교양', 'CBS<br>98.1', '#e4572e', 'https://www.cbs.co.kr/'],
    ['ebsfm', 'EBS FM', '104.5MHz · 교육·영어', 'EBS<br>FM', '#6b8e23', 'https://www.ebs.co.kr/onair'],
    ['gugak', '국악방송', '99.1MHz · 우리 소리', '국악<br>99.1', '#7a5a2a', 'https://www.gugakfm.co.kr/']
  ];
  var TV = [
    // 기본 넷(대표님 11-22: KBS·MBC·SBS·YTN) + 싸바가 더한 채널(종편·보도·교육은 유튜브 공식 생방송 찾기 — 로그인 없이 나옴)
    ['KBS 1TV · 2TV', 'KBS 온에어 (지역에 따라 일부 프로그램 제한)', 'KBS', '#1d3f8f', 'https://onair.kbs.co.kr', '928368733', 'KBS'],
    ['MBC', 'MBC 온에어 (로그인 안 하면 미리보기만 — 무료 가입하면 계속)', 'MBC', '#111', 'https://onair.imbc.com', '600780511', 'MBC'],
    ['SBS', 'SBS 온에어 (로그인 안 하면 미리보기만 — 무료 가입하면 계속)', 'SBS', '#0a7a3f', 'https://www.sbs.co.kr/live', '', 'SBS'],
    ['YTN 24시간 뉴스', '공식 홈페이지 생방송', 'YTN', '#0b4ea2', 'https://www.ytn.co.kr/_hd/hd_live.html', '353117998', 'YTN'],
    ['연합뉴스TV', '24시간 뉴스 · 유튜브 생방송', '연합<br>TV', '#00539b', 'https://www.youtube.com/results?search_query=' + encodeURIComponent('연합뉴스TV 생방송') + '&sp=EgJAAQ%253D%253D', '', ''],
    ['JTBC 뉴스', '유튜브 생방송', 'JTBC', '#222', 'https://www.youtube.com/results?search_query=' + encodeURIComponent('JTBC 뉴스 생방송') + '&sp=EgJAAQ%253D%253D', '', ''],
    ['MBN 뉴스', '유튜브 생방송', 'MBN', '#e1251b', 'https://www.youtube.com/results?search_query=' + encodeURIComponent('MBN 뉴스 생방송') + '&sp=EgJAAQ%253D%253D', '', ''],
    ['채널A 뉴스', '유튜브 생방송', '채널A', '#004a99', 'https://www.youtube.com/results?search_query=' + encodeURIComponent('채널A 뉴스 생방송') + '&sp=EgJAAQ%253D%253D', '', ''],
    ['TV조선 뉴스', '유튜브 생방송', 'TV<br>조선', '#c8102e', 'https://www.youtube.com/results?search_query=' + encodeURIComponent('TV조선 뉴스 생방송') + '&sp=EgJAAQ%253D%253D', '', ''],
    ['EBS', 'EBS 온에어 · 교육·다큐', 'EBS', '#6b8e23', 'https://www.ebs.co.kr/onair', '', ''],
    ['유튜브 생방송 뉴스', '지금 생방송 중인 뉴스 채널 모두 찾기', '▶︎', '#e62117', 'https://www.youtube.com/results?search_query=' + encodeURIComponent('뉴스 생방송') + '&sp=EgJAAQ%253D%253D', '', '']
  ];
  function appUrl(id, name) {
    if (ios && id) return 'https://apps.apple.com/kr/app/id' + id;
    if (and && name) return 'https://play.google.com/store/search?q=' + encodeURIComponent(name) + '&c=apps';
    if (id) return 'https://apps.apple.com/kr/app/id' + id;
    return '';
  }
  function $(id) { return document.getElementById(id); }
  var au = $('au'), hls = null, cur = null, rows = {}, tries = 0;
  function save(id) { try { localStorage.setItem('sava-radio', id); } catch (e) {} }
  function last() { try { return localStorage.getItem('sava-radio') || ''; } catch (e) { return ''; } }
  function byId(id) { return RADIO.filter(function (c) { return c[0] === id; })[0]; }
  function state(t) { $('nowState').textContent = t; }
  function mark() {
    Object.keys(rows).forEach(function (k) { rows[k].classList.toggle('on', !!cur && k === cur[0]); rows[k].querySelector('.play').textContent = cur && k === cur[0] && !au.paused ? '■ 끄기' : '▶ 듣기'; });
    $('nowBtn').textContent = au.paused ? '▶ 듣기' : '■ 끄기';
  }
  function stop() { try { au.pause(); } catch (e) {} if (hls) { hls.destroy(); hls = null; } au.removeAttribute('src'); try { au.load(); } catch (e) {} }
  // hls.js — 아이폰은 필요 없고, 안드로이드·컴퓨터에서 소리 주소를 못 틀 때만 불러옴
  function loadHls() {
    if (window.Hls) return Promise.resolve(window.Hls);
    return new Promise(function (ok, no) { var s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js'; s.onload = function () { ok(window.Hls); }; s.onerror = no; document.head.appendChild(s); });
  }
  function fallback(c) {
    stop(); mark();
    var st = $('nowState'); st.textContent = '지금 싸바에서 안 나와요 · ';
    if (c[5]) { var a = document.createElement('a'); a.href = c[5]; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '방송사 화면에서 듣기 ›'; a.style.cssText = 'color:#FFD400;font-weight:900'; st.appendChild(a); }
  }
  // 생방송 맞추기(11-22 대표님: KBS FM 틀면 지난 방송이 나옴) — 방송사가 몇 시간치 '다시 듣기 창'을 같이 주면
  // 아이폰은 그 맨 앞(지난 방송)부터 틂 → 들을 수 있는 끝(지금 생방송)에서 3초 앞으로 옮김
  var liveDone = 0;
  function toLive() {
    try {
      var sk = au.seekable; if (!sk || !sk.length) return false;
      var end = sk.end(sk.length - 1); if (!isFinite(end) || end <= 0) return false;
      if (end - au.currentTime > 20) au.currentTime = Math.max(sk.start(sk.length - 1), end - 3);
      return true;
    } catch (e) { return false; }
  }
  function liveSoon(my) { liveDone = 0; [0, 400, 1200, 2500, 5000].forEach(function (t) { setTimeout(function () { if (my === tries && !liveDone && toLive()) liveDone = 1; }, t); }); }
  au.addEventListener('loadedmetadata', function () { if (!liveDone && toLive()) liveDone = 1; });
  function play(c) {
    stop(); cur = c; save(c[0]); tries++; var my = tries;
    $('now').hidden = false; $('nowName').textContent = '📻 ' + c[1]; state('🍒 채널 맞추는 중…'); mark();
    fetch('/api/radio?ch=' + c[0]).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
      if (my !== tries) return;
      if (!j.url) throw 0;
      var native = au.canPlayType('application/vnd.apple.mpegurl');
      liveSoon(my);
      if (native) { au.src = j.url; return au.play(); }
      return loadHls().then(function (H) {
        if (!H || !H.isSupported()) { au.src = j.url; return au.play(); }
        hls = new H({ startPosition: -1, liveSyncDurationCount: 3, liveMaxLatencyDurationCount: 10 }); hls.loadSource(j.url); hls.attachMedia(au);
        hls.on(H.Events.LEVEL_LOADED, function (e, d) { if (my === tries && d && d.details && d.details.live && hls && hls.liveSyncPosition && hls.liveSyncPosition - au.currentTime > 20) au.currentTime = hls.liveSyncPosition; });
        hls.on(H.Events.ERROR, function (e, d) { if (d && d.fatal && my === tries) fallback(c); });
        return au.play();
      });
    }).then(function () { if (my === tries) { state(c[2] + ' · 듣는 중'); mark(); } })
      .catch(function (e) {
        if (my !== tries) return;
        if (e && e.name === 'NotAllowedError') { state('▶ 듣기를 한 번 더 눌러 주세요'); mark(); return; }
        fallback(c);
      });
  }
  au.addEventListener('error', function () { if (cur && au.getAttribute('src')) fallback(cur); });
  au.addEventListener('playing', function () { if (cur) state(cur[2] + ' · 듣는 중'); mark(); });
  au.addEventListener('pause', mark);
  $('nowBtn').addEventListener('click', function () { if (!cur) return; if (au.paused) play(cur); else { stop(); state('꺼졌어요 · ▶ 누르면 다시 들어요'); mark(); } });

  function row(c) {
    var d = document.createElement('div'); d.className = 'ch';
    var lg = document.createElement('div'); lg.className = 'logo'; lg.style.background = c[4]; lg.innerHTML = c[3];
    var tx = document.createElement('div'); var b = document.createElement('b'); b.textContent = c[1]; var s = document.createElement('span'); s.textContent = c[2]; tx.appendChild(b); tx.appendChild(s);
    var bt = document.createElement('div'); bt.className = 'btns';
    var p = document.createElement('button'); p.type = 'button'; p.className = 'play'; p.textContent = '▶ 듣기';
    p.addEventListener('click', function () { if (cur && cur[0] === c[0] && !au.paused) { stop(); state('꺼졌어요 · ▶ 누르면 다시 들어요'); mark(); } else play(c); });
    bt.appendChild(p);
    d.appendChild(lg); d.appendChild(tx); d.appendChild(bt); rows[c[0]] = d; return d;
  }
  function tvRow(c) {
    var d = document.createElement('div'); d.className = 'ch';
    var lg = document.createElement('div'); lg.className = 'logo'; lg.style.background = c[3]; lg.innerHTML = c[2];
    var tx = document.createElement('div'); var b = document.createElement('b'); b.textContent = c[0]; var s = document.createElement('span'); s.textContent = c[1]; tx.appendChild(b); tx.appendChild(s);
    var bt = document.createElement('div'); bt.className = 'btns';
    var au2 = appUrl(c[5], c[6]);
    var p = document.createElement('a'); p.className = 'play'; p.href = c[4]; p.target = '_blank'; p.rel = 'noopener'; p.textContent = '▶ 보기'; bt.appendChild(p);
    if (au2) { var a = document.createElement('a'); a.className = 'app'; a.href = au2; a.target = '_blank'; a.rel = 'noopener'; a.textContent = '앱 받기'; bt.appendChild(a); }
    d.appendChild(lg); d.appendChild(tx); d.appendChild(bt); return d;
  }
  // 지난번 들은 채널을 맨 위로 (?ch=cbs939 로 열면 그 채널)
  var want = new URLSearchParams(location.search).get('ch') || last();
  var first = byId(want);
  var list = first ? [first].concat(RADIO.filter(function (c) { return c !== first; })) : RADIO;
  var r = $('radio'), t = $('tv');
  list.forEach(function (c) { r.appendChild(row(c)); });
  TV.forEach(function (c) { t.appendChild(tvRow(c)); });
  if (first) { cur = first; $('now').hidden = false; $('nowName').textContent = '📻 ' + first[1]; state('지난번 듣던 채널 · ▶ 누르면 바로 나와요'); mark(); }
})();
</script>
<script src="/js/home.js?v=15" defer></script>
</body>
</html>
