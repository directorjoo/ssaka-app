<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <title>체리랑 가위바위보 — 싸바</title>
  <meta name="description" content="싸바 체리를 몇 번 연속 이길 수 있을까? 지면 끝!">
  <meta name="theme-color" content="#B3132B">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sava.kr/rps/">
  <meta property="og:title" content="✊ 체리랑 가위바위보 — 몇 연승?">
  <meta property="og:description" content="싸바 체리를 몇 번 연속 이길 수 있을까? 지면 끝!">
  <meta property="og:image" content="https://sava.kr/img/eodiya-share.png?v=4">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../img/favicon.png?v=4">
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png?v=4">
  <meta name="apple-mobile-web-app-title" content="싸바">
  <style>
    :root { --bg: #B3132B; --ink: #1E1E1E; --font: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
    [hidden] { display: none !important; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; background: var(--bg); color: #fff; font-family: var(--font); -webkit-font-smoothing: antialiased; }
    body { min-height: 100svh; background: linear-gradient(180deg,#C2172F 0%,#B3132B 40%,#A0101F 100%); background-attachment: fixed; }
    .wrap { max-width: 480px; margin: 0 auto; padding: calc(10px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); }
    .top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
    .top a { display: flex; align-items: center; gap: 6px; color: #fff; text-decoration: none; font-weight: 900; font-size: 17px; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .top a img { width: 26px; height: 26px; }
    .top .best { font-size: 15px; font-weight: 800; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .hero { text-align: center; margin-top: 14px; }
    .hero .ic { font-size: 60px; line-height: 1; }
    .hero h1 { margin: 8px 0 0; font-size: 34px; font-weight: 900; letter-spacing: -0.04em; text-shadow: 0 2px 4px rgba(0,0,0,.3); }
    .hero p { margin: 8px 0 0; font-size: 17px; line-height: 1.55; word-break: keep-all; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .chal { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.95); color: var(--ink); font-size: 16px; font-weight: 700; line-height: 1.5; text-align: center; word-break: keep-all; }
    .go { display: grid; place-items: center; width: 100%; min-height: 68px; margin-top: 14px; border: 0; border-radius: 20px; background: #fff; color: #B3132B; font: inherit; font-size: 21px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 24px -14px rgba(0,0,0,.6); }
    .ghost { display: grid; place-items: center; width: 100%; min-height: 54px; margin-top: 8px; border: 0; border-radius: 16px; background: rgba(255,255,255,.18); color: #fff; font: inherit; font-size: 17px; font-weight: 800; cursor: pointer; }
    .kakao { display: grid; place-items: center; width: 100%; min-height: 58px; margin-top: 8px; border: 0; border-radius: 16px; background: #FEE500; color: #3a1d1d; font: inherit; font-size: 18px; font-weight: 900; cursor: pointer; }
    .result { margin-top: 16px; padding: 20px 16px 16px; border-radius: 24px; background: #fff; color: var(--ink); text-align: center; animation: pop .4s cubic-bezier(.2,1.4,.4,1); }
    @keyframes pop { from { transform: scale(.88); opacity: 0; } to { transform: none; opacity: 1; } }
    .result .e { font-size: 54px; line-height: 1; }
    .result h2 { margin: 8px 0 2px; font-size: 28px; font-weight: 900; color: #B3132B; }
    .result .s { font-size: 18px; font-weight: 800; color: #666; }
    .name { display: flex; gap: 8px; align-items: center; margin-top: 12px; font-size: 16px; font-weight: 800; }
    .name input { flex: 1; min-height: 46px; padding: 0 12px; border: 0; border-radius: 12px; background: #fff; color: var(--ink); font: inherit; font-size: 16px; }
    .ranks { margin-top: 18px; padding: 14px; border-radius: 18px; background: rgba(0,0,0,.16); }
    .ranks h3 { margin: 0 0 6px; font-size: 15px; font-weight: 900; }
    .ranks div { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid rgba(255,255,255,.2); font-size: 16px; }
    .ranks div:first-of-type { border-top: 0; }
    .ranks div span:last-child { font-weight: 800; }
    .more { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .more a { display: grid; place-items: center; min-height: 52px; border-radius: 14px; background: rgba(255,255,255,.18); color: #fff; text-decoration: none; font-weight: 800; font-size: 16px; }
    .foot { margin-top: 16px; text-align: center; font-size: 14px; line-height: 1.6; word-break: keep-all; }
    .foot a { color: #fff; }
    
    .arena { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin-top: 18px; padding: 18px 10px; border-radius: 24px; background: rgba(0,0,0,.16); text-align: center; }
    .arena .who { font-size: 16px; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .arena .h { font-size: clamp(60px, 20vw, 88px); line-height: 1.15; }
    .arena .vs { font-size: 20px; font-weight: 900; }
    .arena .h.shake { animation: shake .18s ease-in-out infinite alternate; }
    @keyframes shake { from { transform: translateY(-8px) rotate(-6deg); } to { transform: translateY(6px) rotate(6deg); } }
    .call { margin-top: 12px; min-height: 40px; text-align: center; font-size: 26px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,.35); }
    .streak { text-align: center; margin-top: 4px; font-size: 19px; font-weight: 900; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
    .hands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .hands button { min-height: 96px; border: 0; border-radius: 20px; background: #fff; color: #B3132B; font: inherit; font-size: 17px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 20px -14px rgba(0,0,0,.6); }
    .hands button i { display: block; font-style: normal; font-size: 44px; line-height: 1.1; }
    .hands button:disabled { opacity: .55; }

    @media (prefers-reduced-motion: reduce) { .result, * { animation: none !important; } }
  </style>
<script src="/js/launch.js?v=3"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="../eodiya/#play"><img src="../img/cherry.webp" alt="">싸바 놀이터</a><span class="best" id="best"></span></div>

  <div class="hero">
    <div class="ic" aria-hidden="true">✊✌️🖐️</div>
    <h1>체리랑 가위바위보</h1>
    <p>싸바 체리를 몇 번 연속 이길 수 있을까?<br>비기면 다시, 지면 끝!</p>
  </div>
  <div class="chal" id="chal" hidden></div>
  <div class="arena" aria-live="polite">
    <div><div class="who" id="meName">나</div><div class="h" id="hMe">❔</div></div>
    <div class="vs">VS</div>
    <div><div class="who">🍒 체리</div><div class="h" id="hCpu">❔</div></div>
  </div>
  <div class="call" id="call">아래에서 하나 고르세요!</div>
  <div class="streak" id="streak">연승 0</div>
  <div class="hands" id="hands">
    <button type="button" data-h="0"><i>✊</i>바위</button>
    <button type="button" data-h="1"><i>✌️</i>가위</button>
    <button type="button" data-h="2"><i>🖐️</i>보</button>
  </div>
  <div id="out" hidden>
    <div class="result" id="result"></div>
    <label class="name">내 이름 <input id="me" maxlength="10" placeholder="도전장에 보일 이름"></label>
    <button type="button" class="kakao" id="send">💬 친구한테 도전장 보내기</button>
    <button type="button" class="ghost" id="again">🔁 다시 도전</button>
  </div>
  <div class="ranks">
    <h3>🏅 연승 등급</h3>
    <div><span>👑 가위바위보 신</span><span>7연승 이상</span></div>
    <div><span>🔥 승부사</span><span>4연승 이상</span></div>
    <div><span>😎 제법인데</span><span>2연승 이상</span></div>
    <div><span>🌱 체리가 이김</span><span>0~1승</span></div>
  </div>

  <div class="more"><a href="../lucky/">🎰 럭키 7초</a><a href="../fly/">🪰 파리 잡기</a></div>
  <p class="foot">재미로 하는 싸바 놀이예요. 기록은 이 휴대폰에만 남아요.<br><a href="../?story=1">싸바가 뭐지?</a></p>
</div>
<script src="../js/install.js?v=2"></script>
<script src="../js/share.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var qp = new URLSearchParams(location.search);
  function myName() { try { var me = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); return me.from || ''; } catch (e) { return ''; } }
  if ($('me')) $('me').value = myName();
  function saveName() { var n = $('me').value.trim(); if (!n) return ''; try { var me = JSON.parse(localStorage.getItem('eodiya-me-v1') || '{}'); me.from = n; localStorage.setItem('eodiya-me-v1', JSON.stringify(me)); } catch (e) {} return n; }
  function share(o) {
    if (window.SsakaShare) return SsakaShare({ url: o.url, title: o.title, description: o.desc, imageUrl: 'https://sava.kr/img/eodiya-share.png?v=4', imageWidth: 1000, imageHeight: 600, buttonTitle: o.btn || '나도 해 보기', installTitle: '싸바 설치하기' });
    if (navigator.share) navigator.share({ title: o.title, text: o.desc, url: o.url }).catch(function () {});
  }
  function esc(t) { return String(t || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var H = ['✊', '✌️', '🖐️'], NM = ['바위', '가위', '보'], KEY = 'sava-rps-v1';
  var win = 0, busy = false, best = 0; try { best = +localStorage.getItem(KEY) || 0; } catch (e) {}
  function paintBest() { $('best').textContent = best ? '내 최고 ' + best + '연승' : ''; }
  paintBest();
  if (myName()) $('meName').textContent = myName();
  function grade(w) { return w >= 7 ? { e: '👑', t: '가위바위보 신' } : w >= 4 ? { e: '🔥', t: '승부사' } : w >= 2 ? { e: '😎', t: '제법인데' } : { e: '🌱', t: '체리가 이겼어요' }; }
  var cw = +qp.get('w'), cn = (qp.get('n') || '').slice(0, 10);
  if (qp.has('w')) { $('chal').hidden = false; $('chal').innerHTML = '📮 <b>' + esc(cn || '친구') + '</b>님은 체리를 <b>' + cw + '연승</b>!<br>더 많이 이기면 내가 이겨요'; }
  function setBtns(on) { document.querySelectorAll('#hands button').forEach(function (b) { b.disabled = !on; }); }
  function play(me) {
    if (busy) return; busy = true; setBtns(false);
    $('hMe').textContent = '✊'; $('hCpu').textContent = '✊'; $('hMe').classList.add('shake'); $('hCpu').classList.add('shake');
    var words = ['가위!', '바위!', '보!'], k = 0; $('call').textContent = words[0];
    var t = setInterval(function () {
      k++; if (k < 3) { $('call').textContent = words[k]; return; }
      clearInterval(t);
      var cpu = Math.floor(Math.random() * 3);
      $('hMe').classList.remove('shake'); $('hCpu').classList.remove('shake');
      $('hMe').textContent = H[me]; $('hCpu').textContent = H[cpu];
      // 0바위 1가위 2보 : 바위>가위, 가위>보, 보>바위
      var r = me === cpu ? 0 : ((me === 0 && cpu === 1) || (me === 1 && cpu === 2) || (me === 2 && cpu === 0)) ? 1 : -1;
      if (r === 0) { $('call').textContent = '🤝 비겼어요! 다시!'; }
      else if (r === 1) { win++; $('call').textContent = '🎉 이겼어요!'; if (navigator.vibrate) navigator.vibrate(40); }
      else { $('call').textContent = '😵 졌어요… 체리는 ' + NM[cpu]; }
      $('streak').textContent = '연승 ' + win;
      busy = false;
      if (r === -1) over(); else setBtns(true);
    }, 380);
  }
  var last = null;
  function over() {
    var g = grade(win), nb = win > best; last = { w: win, g: g };
    if (nb) { best = win; try { localStorage.setItem(KEY, String(best)); } catch (e) {} paintBest(); }
    var vs = qp.has('w') ? (win > cw ? '<div class="s" style="color:#3BA55C">🎉 ' + esc(cn || '친구') + '님을 이겼어요!</div>' : win === cw ? '<div class="s">🤝 똑같아요!</div>' : '<div class="s">😅 ' + esc(cn || '친구') + '님이 ' + (cw - win) + '승 더 많아요</div>') : '';
    $('result').innerHTML = '<div class="e">' + g.e + '</div><h2>' + g.t + '</h2><div class="s">' + win + '연승' + (nb && win ? ' · 🏆 내 최고!' : '') + '</div>' + vs;
    $('out').hidden = false; $('hands').hidden = true;
    setTimeout(function () { $('out').scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
  }
  function reset() { win = 0; $('streak').textContent = '연승 0'; $('call').textContent = '아래에서 하나 고르세요!'; $('hMe').textContent = '❔'; $('hCpu').textContent = '❔'; $('out').hidden = true; $('hands').hidden = false; setBtns(true); }
  document.querySelectorAll('#hands button').forEach(function (b) { b.addEventListener('click', function () { play(+b.dataset.h); }); });
  $('again').addEventListener('click', reset);
  $('send').addEventListener('click', function () {
    if (!last) return; var nm = saveName(), u = new URL('https://sava.kr/rps/');
    u.searchParams.set('w', last.w); if (nm) u.searchParams.set('n', nm);
    share({ url: u.href, title: (nm ? nm + ': ' : '') + '✊ 체리랑 가위바위보 ' + last.w + '연승! ' + last.g.e, desc: '너는 체리를 몇 번 연속 이길 수 있어?', btn: '✊ 도전하기' });
  });

})();
</script>
<script src="/js/home.js?v=11" defer></script>
</body>
</html>
