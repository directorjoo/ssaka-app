<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>html{-webkit-text-size-adjust:100%;text-size-adjust:100%}</style>
  <meta name="theme-color" content="#B3132B">
  <title>싸바스타 · 배우 프로필 접수 · 오디션 공고</title>
  <meta property="og:title" content="⭐ 싸바스타 — 번호 없는 오디션">
  <meta property="og:description" content="배우는 프로필 한 번 올리고 단추 하나로 지원. 연락처는 최종 합격 때만.">
  <meta property="og:url" content="https://sava.kr/star/">
  <meta property="og:image" content="https://sava.kr/img/eodiya-play.png?v=3">
  <link rel="icon" href="../img/favicon.png?v=4">
  <link rel="stylesheet" href="../css/brand.css">
  <!-- 싸바스타 (11-21): 배우 프로필 접수 + 오디션 올리기·지원·심사·발표. 서버는 functions/api/star/[[path]].js -->
  <style>
    * { box-sizing: border-box; } [hidden] { display: none !important; }
    html, body { margin: 0; color: #1A1A1A; font-family: var(--font, 'Pretendard', sans-serif); background: linear-gradient(180deg, #FFFFFF 0%, #FFF8EF 40%, #FCEEDC 100%); min-height: 100%; }
    .w { max-width: 560px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom)); }
    h1 { margin: 6px 0 2px; font-size: 28px; font-weight: 900; letter-spacing: -.035em; padding-right: 90px; }
    h1 b { color: #B3132B; }
    .sub { margin: 0 0 14px; font-size: 16px; color: #6B6259; line-height: 1.5; word-break: keep-all; }
    .tabs { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 0 -16px 16px; padding: 8px 16px; background: rgba(255,250,244,.95); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
    .tabs a { display: grid; place-items: center; gap: 1px; min-height: 56px; padding: 6px 2px; border-radius: 16px; background: #fff; color: #4A4038; text-decoration: none; font-size: 15px; font-weight: 800; text-align: center; line-height: 1.15; box-shadow: 0 6px 16px -12px rgba(90,40,20,.6); }
    .tabs a i { font-style: normal; font-size: 20px; }
    .tabs a.on { background: #B3132B; color: #fff; }
    .card { display: block; margin: 0 0 12px; padding: 16px 16px 14px; border-radius: 20px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 12px 26px -20px rgba(90,40,20,.6); }
    .card h3 { margin: 4px 0 4px; font-size: 19px; font-weight: 800; letter-spacing: -.02em; word-break: keep-all; }
    .card p { margin: 3px 0 0; font-size: 15.5px; color: #4A4038; line-height: 1.5; word-break: keep-all; }
    .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 15px; font-weight: 800; background: #FFF1F3; color: #8E0F22; margin-right: 4px; }
    .pill.g { background: #E8F4EC; color: #17573F; } .pill.k { background: #F1EEEA; color: #6B6259; } .pill.y { background: #FFF4C2; color: #6B4E00; }
    .notice { margin: 0 0 16px; padding: 14px 16px; border-radius: 18px; background: #FFF1F3; color: #6E0A22; font-size: 15.5px; line-height: 1.55; word-break: keep-all; }
    .notice b { color: #B3132B; }
    label.f { display: block; margin: 14px 0 6px; font-size: 17px; font-weight: 800; }
    label.f small { font-weight: 600; color: #8A8178; font-size: 15px; margin-left: 4px; }
    input[type=text], input[type=number], input[type=date], input[type=url], textarea, select { width: 100%; padding: 13px 14px; border: 1.5px solid #333; border-radius: 14px; background: #fff; color: #111; font: inherit; font-size: 17px; }
    textarea { min-height: 110px; line-height: 1.55; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #000; box-shadow: 0 0 0 3px rgba(179,19,43,.15); }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips label { display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; border: 1.5px solid #DDD3C8; border-radius: 999px; background: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    .chips input { width: 18px; height: 18px; accent-color: #B3132B; }
    .chips label:has(input:checked) { border-color: #B3132B; background: #FFF1F3; color: #8E0F22; }
    .btn { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 56px; margin-top: 20px; border: 0; border-radius: 999px; background: #B3132B; color: #fff; font: inherit; font-size: 18px; font-weight: 800; cursor: pointer; text-decoration: none; }
    .btn.lite { background: #fff; color: #B3132B; border: 2px solid #B3132B; }
    .btn.kakao { background: #FEE500; color: #191600; }
    .btn:disabled { opacity: .5; }
    .photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .photos div { position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; background: #F3ECE6 center/cover; }
    .photos button.x { position: absolute; right: 4px; top: 4px; width: 30px; height: 30px; border: 0; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 16px; }
    .photos label.add { display: grid; place-items: center; aspect-ratio: 3 / 4; border: 2px dashed #D9C9BB; border-radius: 14px; color: #8A8178; font-size: 15px; font-weight: 800; text-align: center; cursor: pointer; background: #fff; }
    .photos label.add i { display: block; font-style: normal; font-size: 30px; }
    .toggle { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 14px 16px; border-radius: 16px; background: #fff; font-size: 16px; line-height: 1.45; }
    .toggle input { width: 24px; height: 24px; accent-color: #B3132B; flex: none; }
    .msg { margin-top: 12px; font-size: 16px; font-weight: 700; color: #B3132B; text-align: center; min-height: 22px; }
    .dl { margin: 10px 0 0; padding: 0; }
    .dl div { display: flex; gap: 10px; padding: 9px 0; border-top: 1px solid #F3E8DC; font-size: 16px; line-height: 1.5; }
    .dl dt { flex: none; width: 82px; color: #8A8178; font-weight: 700; }
    .dl dd { margin: 0; word-break: keep-all; white-space: pre-line; }
    .app { display: flex; gap: 12px; align-items: flex-start; }
    .app .ph { flex: none; width: 84px; aspect-ratio: 3 / 4; border-radius: 12px; background: #F3ECE6 center/cover; }
    .app .tx { flex: 1; min-width: 0; }
    .app select { margin-top: 8px; padding: 8px 10px; font-size: 16px; }
    .win { margin: 14px 0; padding: 18px; border-radius: 20px; text-align: center; color: #fff; background: linear-gradient(100deg, #5C0512 0%, #7E0A1C 35%, #B3132B 75%, #D8475E 100%); }
    .win h3 { margin: 0 0 8px; font-size: 20px; }
    .win p { margin: 0; font-size: 18px; font-weight: 800; line-height: 1.6; }
    .empty { padding: 30px 10px; text-align: center; color: #8A8178; font-size: 16px; line-height: 1.6; }
    .sec { margin: 24px 0 10px; font-size: 20px; font-weight: 900; letter-spacing: -.03em; }
    .gal { display: flex; gap: 8px; overflow-x: auto; margin: 10px 0; }
    .gal img { height: 220px; border-radius: 14px; }
  </style>
</head>
<body>
<main class="w">
  <h1>⭐ 싸바<b>스타</b></h1>
  <p class="sub">번호 없는 오디션 — 배우도, 캐스팅 담당도 연락처를 드러내지 않아요.</p>
  <nav class="tabs">
    <a href="#list" data-t="list"><i>🎬</i>오디션<br>공고</a>
    <a href="#profile" data-t="profile"><i>🙋</i>내<br>프로필</a>
    <a href="#post" data-t="post"><i>📣</i>오디션<br>올리기</a>
    <a href="#mine" data-t="mine"><i>📋</i>내 지원<br>내 공고</a>
  </nav>
  <div id="view"></div>
</main>

<script>
(function () {
  var $v = document.getElementById('view');
  var FIELDS = ['영화', '드라마', '연극', '뮤지컬', '광고', '모델', '웹·숏폼', '보조출연'];
  var KINDS = ['영화', '드라마', '연극', '뮤지컬', '광고', '웹·숏폼', '모델', '기타'];
  var ST = ['접수', '1차 합격', '2차 합격', '최종 합격', '불합격'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function api(path, opt) {
    opt = opt || {}; opt.credentials = 'same-origin'; opt.cache = 'no-store';
    if (opt.json) { opt.body = JSON.stringify(opt.json); opt.headers = { 'content-type': 'application/json' }; delete opt.json; }
    return fetch('/api/star/' + path, opt).then(function (r) { return r.json().then(function (j) { if (!r.ok && !j.error) j.error = 'http' + r.status; return j; }); });
  }
  function loginHref() { return '/api/auth/kakao?next=' + encodeURIComponent('/star/' + location.hash); }
  function loginBox(why) {
    return '<div class="notice">' + why + '</div><a class="btn kakao" href="' + loginHref() + '">카카오로 로그인하기</a>';
  }
  function dday(d) {
    if (!d) return '';
    var t = new Date(d + 'T23:59:59+09:00') - new Date(), n = Math.ceil(t / 86400e3);
    return n < 0 ? '마감' : n === 0 ? '오늘 마감' : 'D-' + n;
  }
  function stPill(a) {
    if (a.st === 'announced') return '<span class="pill y">🏆 발표</span>';
    if (a.st === 'closed' || dday(a.deadline) === '마감') return '<span class="pill k">마감</span>';
    return '<span class="pill g">모집 중</span>' + (a.deadline ? '<span class="pill">' + dday(a.deadline) + '</span>' : '');
  }
  function errText(e) {
    return { login: '로그인이 필요해요.', 'no-profile': '먼저 내 프로필을 올려 주세요.', closed: '마감된 오디션이에요.', own: '내가 올린 오디션에는 지원할 수 없어요.', few: '꼭 써야 할 칸을 채워 주세요.', limit: '하루에 올릴 수 있는 공고(5개)를 넘었어요.', size: '사진이 너무 커요.', 'no-db': '잠시 후 다시 해 주세요.' }[e] || '문제가 생겼어요 (' + e + ')';
  }
  function tabOn(t) { document.querySelectorAll('.tabs a').forEach(function (a) { a.classList.toggle('on', a.dataset.t === t); }); }

  // ── 공고 목록
  function viewList() {
    tabOn('list');
    $v.innerHTML = '<div class="notice"><b>배우님</b>은 내 프로필을 한 번 올려 두면, 공고마다 <b>[지원하기]</b> 단추 하나로 끝나요. 결과는 <b>내 지원</b>에서 확인해요.</div><div id="ls" class="empty">불러오는 중…</div>';
    api('auditions').then(function (j) {
      var ls = document.getElementById('ls');
      if (j.error) { ls.textContent = errText(j.error); return; }
      if (!j.list.length) { ls.innerHTML = '아직 올라온 오디션이 없어요.<br>캐스팅 담당이시면 <a href="#post">오디션 올리기</a>로 첫 공고를 올려 주세요.'; return; }
      ls.className = ''; ls.innerHTML = j.list.map(function (a) {
        return '<a class="card" href="#a/' + a.id + '">' + stPill(a) + (a.kind ? '<span class="pill k">' + esc(a.kind) + '</span>' : '') +
          '<h3>' + esc(a.title) + '</h3><p>' + esc(a.org || '') + (a.where ? ' · ' + esc(a.where) : '') + '</p>' +
          (a.who ? '<p>🎭 ' + esc(a.who) + '</p>' : '') + '<p>지원 ' + (a.n || 0) + '명</p></a>';
      }).join('');
    });
  }

  // ── 공고 하나
  function viewAudition(id) {
    tabOn('list');
    $v.innerHTML = '<div class="empty">불러오는 중…</div>';
    api('audition/' + id).then(function (j) {
      if (j.error) { $v.innerHTML = '<div class="empty">' + errText(j.error) + '</div>'; return; }
      var a = j.a, h = '';
      h += '<div class="card">' + stPill(a) + (a.kind ? '<span class="pill k">' + esc(a.kind) + '</span>' : '') + '<h3 style="font-size:23px">' + esc(a.title) + '</h3>';
      h += '<dl class="dl">' + [['제작', a.org], ['모집 배역', a.roles], ['찾는 배우', a.who], ['촬영·공연', a.when], ['장소', a.where], ['출연료', a.pay], ['마감', a.deadline ? a.deadline + ' (' + dday(a.deadline) + ')' : ''], ['심사 순서', a.steps], ['자세히', a.detail]]
        .filter(function (x) { return x[1]; }).map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') + '</dl></div>';
      if (j.winners) h += '<div class="win"><h3>🏆 최종 합격을 축하합니다</h3><p>' + (j.winners.length ? j.winners.map(esc).join(' · ') : '합격자 없음') + '</p></div>';
      if (j.my) {
        h += '<div class="notice">내 결과: <b>' + esc(j.my) + '</b>' + (j.my === '최종 합격' && a.contact ? '<br>📞 캐스팅 담당 연락처: <b>' + esc(a.contact) + '</b><br>연락은 배우님이 정하세요.' : '') + '</div>';
        if (j.my === '접수' && a.st === 'open') h += '<button class="btn lite" id="cancel">지원 취소하기</button>';
      } else if (!j.owner && a.st === 'open' && dday(a.deadline) !== '마감') {
        h += j.login ? '<button class="btn" id="apply">⭐ 이 오디션에 지원하기</button><p class="msg" id="am"></p>' : loginBox('지원하려면 싸바 회원 로그인이 필요해요. 연락처는 아무에게도 보이지 않아요.');
      }
      h += '<button class="btn kakao" id="share">💬 카톡으로 이 공고 알리기</button>';
      if (j.owner) h += ownerPart(a, j.apps || []);
      if (j.admin && !j.owner) h += '<button class="btn lite" id="adel">관리자: 이 공고 지우기</button>';
      $v.innerHTML = h;
      var b;
      if ((b = document.getElementById('apply'))) b.onclick = function () {
        b.disabled = true;
        api('apply', { method: 'POST', json: { aid: a.id } }).then(function (r) {
          if (r.ok) { viewAudition(id); return; }
          b.disabled = false; document.getElementById('am').innerHTML = errText(r.error) + (r.error === 'no-profile' ? ' <a href="#profile">프로필 올리기 ›</a>' : '');
        });
      };
      if ((b = document.getElementById('cancel'))) b.onclick = function () { if (confirmBox('지원을 취소할까요?')) api('apply?aid=' + a.id, { method: 'DELETE' }).then(function () { viewAudition(id); }); };
      document.getElementById('share').onclick = function () {
        var o = { url: 'https://sava.kr/star/#a/' + a.id, title: '⭐ ' + a.title + ' 오디션', description: (a.who || a.roles || '').slice(0, 60) + (a.deadline ? ' · 마감 ' + a.deadline : ''), imageUrl: 'https://sava.kr/img/eodiya-play.png?v=3', imageWidth: 800, imageHeight: 800, buttonTitle: '공고 보기' };
        if (window.SsakaShare) SsakaShare(o); else if (navigator.share) navigator.share({ title: o.title, url: o.url }).catch(function () {});
      };
      if ((b = document.getElementById('adel'))) b.onclick = function () { if (confirmBox('정말 지울까요?')) api('remove', { method: 'POST', json: { type: 'audition', id: a.id } }).then(function () { location.hash = '#list'; }); };
      if (j.owner) bindOwner(a, id);
    });
  }
  function confirmBox(t) { return window.confirm(t); }
  function ownerPart(a, apps) {
    var h = '<h2 class="sec">📋 지원한 배우 ' + apps.length + '명</h2>';
    h += '<div class="notice">심사 결과를 고르면 배우가 <b>내 지원</b>에서 바로 봐요. 다 고른 뒤 <b>[최종 발표하기]</b>를 누르면 공고에 합격자 활동명이 오르고, <b>최종 합격자에게만</b> 공고에 적은 연락처가 보여요.</div>';
    h += apps.length ? apps.map(function (p) {
      return '<div class="card app"><div class="ph" style="background-image:url(' + esc((p.photos || [])[0] || '') + ')"></div><div class="tx">' +
        '<h3>' + esc(p.name || '(프로필 없음)') + '</h3><p>' + [p.sex, p.born ? p.born + '년생' : '', p.height ? p.height + 'cm' : '', p.area].filter(Boolean).map(esc).join(' · ') + '</p>' +
        (p.fields && p.fields.length ? '<p>' + p.fields.map(esc).join(' · ') + '</p>' : '') +
        '<p><a href="#p/' + a.id + '/' + p.uid + '">프로필 자세히 ›</a></p>' +
        '<select data-uid="' + p.uid + '">' + ST.map(function (s) { return '<option' + (s === p.st ? ' selected' : '') + '>' + s + '</option>'; }).join('') + '</select></div></div>';
    }).join('') : '<div class="empty">아직 지원한 배우가 없어요. 카톡으로 공고를 알려 보세요.</div>';
    h += '<a class="btn lite" href="#post/' + a.id + '">✏️ 공고 고치기</a>';
    if (a.st === 'open') h += '<button class="btn lite" data-st="closed">⏸ 접수 마감하기</button>';
    if (a.st !== 'open' && a.st !== 'announced') h += '<button class="btn lite" data-st="open">▶ 다시 접수 받기</button>';
    if (a.st !== 'announced') h += '<button class="btn" data-st="announced">🏆 최종 발표하기</button>';
    return h;
  }
  function bindOwner(a, id) {
    $v.querySelectorAll('select[data-uid]').forEach(function (s) {
      s.onchange = function () { api('result', { method: 'POST', json: { aid: a.id, uid: +s.dataset.uid, st: s.value } }); };
    });
    $v.querySelectorAll('button[data-st]').forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.st === 'announced' && !confirmBox('최종 발표할까요? 공고에 합격자 활동명이 오르고, 합격자에게 연락처가 보여요.')) return;
        api('audition/' + a.id + '/state', { method: 'POST', json: { st: b.dataset.st } }).then(function () { viewAudition(id); });
      };
    });
  }
  // 올린 사람이 지원자 프로필 자세히 보기
  function viewApplicant(aid, uid) {
    tabOn('list');
    api('audition/' + aid).then(function (j) {
      var p = (j.apps || []).filter(function (x) { return String(x.uid) === String(uid); })[0];
      if (!p) { $v.innerHTML = '<div class="empty">볼 수 없는 프로필이에요.</div>'; return; }
      $v.innerHTML = profileCard(p) + '<a class="btn lite" href="#a/' + aid + '">‹ 지원자 목록으로</a>';
    });
  }
  function profileCard(p) {
    return '<div class="card"><h3 style="font-size:23px">' + esc(p.name) + '</h3>' +
      ((p.photos || []).length ? '<div class="gal">' + p.photos.map(function (u) { return '<img src="' + esc(u) + '" alt="">'; }).join('') + '</div>' : '') +
      '<dl class="dl">' + [['성별', p.sex], ['출생', p.born ? p.born + '년' : ''], ['키·몸무게', [p.height ? p.height + 'cm' : '', p.weight ? p.weight + 'kg' : ''].filter(Boolean).join(' · ')], ['지역', p.area], ['분야', (p.fields || []).join(' · ')], ['소속', p.agency], ['특기', p.skill], ['경력', p.career], ['소개', p.intro]]
        .filter(function (x) { return x[1]; }).map(function (x) { return '<div><dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd></div>'; }).join('') + '</dl>' +
      (p.video ? '<a class="btn lite" href="' + esc(p.video) + '" target="_blank" rel="noopener">▶ 연기 영상 보기</a>' : '') + '</div>';
  }

  // ── 내 프로필
  var photos = [];
  function viewProfile() {
    tabOn('profile');
    $v.innerHTML = '<div class="empty">불러오는 중…</div>';
    api('profile').then(function (j) {
      if (!j.login) { $v.innerHTML = loginBox('<b>배우 프로필 접수</b> — 싸바 회원으로 로그인하면 프로필을 한 번 올려 두고, 어떤 오디션이든 단추 하나로 지원할 수 있어요.<br>전화번호·이메일은 받지 않아요.'); return; }
      var p = j.p || {}; photos = (p.photos || []).slice();
      var f = function (k) { return esc(p[k] || ''); };
      $v.innerHTML =
        '<div class="notice">전화번호·이메일은 <b>받지 않아요</b>. 캐스팅 담당에게는 아래 프로필만 보여요.</div>' +
        '<label class="f">활동명 <small>꼭 써 주세요</small></label><input type="text" id="name" maxlength="20" value="' + f('name') + '" placeholder="예: 김싸바">' +
        '<label class="f">프로필 사진 <small>6장까지 · 첫 장이 대표</small></label><div class="photos" id="ph"></div>' +
        '<div class="row2"><div><label class="f">성별</label><select id="sex">' + ['', '여', '남', '기타'].map(function (s) { return '<option' + (s === (p.sex || '') ? ' selected' : '') + ' value="' + s + '">' + (s || '고르세요') + '</option>'; }).join('') + '</select></div>' +
        '<div><label class="f">출생 연도</label><input type="number" id="born" inputmode="numeric" value="' + f('born') + '" placeholder="예: 1998"></div></div>' +
        '<div class="row2"><div><label class="f">키 <small>cm</small></label><input type="number" id="height" inputmode="numeric" value="' + f('height') + '"></div>' +
        '<div><label class="f">몸무게 <small>kg · 선택</small></label><input type="number" id="weight" inputmode="numeric" value="' + f('weight') + '"></div></div>' +
        '<label class="f">활동 지역</label><input type="text" id="area" value="' + f('area') + '" placeholder="예: 서울, 광주">' +
        '<label class="f">하고 싶은 분야 <small>여러 개 골라도 돼요</small></label><div class="chips" id="fields">' + FIELDS.map(function (x) { return '<label><input type="checkbox" value="' + x + '"' + ((p.fields || []).indexOf(x) >= 0 ? ' checked' : '') + '>' + x + '</label>'; }).join('') + '</div>' +
        '<label class="f">소속사 <small>없으면 비워 두세요</small></label><input type="text" id="agency" value="' + f('agency') + '">' +
        '<label class="f">특기</label><input type="text" id="skill" value="' + f('skill') + '" placeholder="예: 사투리(전라도), 수영, 피아노">' +
        '<label class="f">경력</label><textarea id="career" placeholder="예: 2025 단편영화 「○○」 주연&#10;2024 연극 「○○」 조연">' + f('career') + '</textarea>' +
        '<label class="f">자기소개</label><textarea id="intro" placeholder="나를 한두 줄로">' + f('intro') + '</textarea>' +
        '<label class="f">연기 영상 주소 <small>유튜브·비메오·네이버TV</small></label><input type="url" id="video" value="' + f('video') + '" placeholder="https://youtu.be/...">' +
        '<label class="toggle"><input type="checkbox" id="pub"' + (p.pub ? ' checked' : '') + '><span><b>배우 찾기에 공개</b><br>지원하지 않아도 캐스팅 담당이 내 프로필을 볼 수 있어요. (끄면 지원한 공고에만 보여요)</span></label>' +
        '<button class="btn" id="save">⭐ 프로필 저장하기</button><p class="msg" id="pm"></p>';
      drawPhotos();
      document.getElementById('save').onclick = saveProfile;
    });
  }
  function drawPhotos() {
    var box = document.getElementById('ph'); if (!box) return;
    box.innerHTML = photos.map(function (k, i) { return '<div style="background-image:url(/api/star/photo/' + k + '.jpg)"><button class="x" type="button" data-i="' + i + '" aria-label="사진 빼기">✕</button></div>'; }).join('') +
      (photos.length < 6 ? '<label class="add"><span><i>📷</i>사진 넣기</span><input type="file" accept="image/*" multiple hidden id="pf"></label>' : '');
    box.querySelectorAll('button.x').forEach(function (b) { b.onclick = function () { photos.splice(+b.dataset.i, 1); drawPhotos(); }; });
    var pf = document.getElementById('pf'); if (pf) pf.onchange = function () { upPhotos([].slice.call(pf.files, 0, 6 - photos.length)); };
  }
  function shrink(file) {
    return new Promise(function (ok, no) {
      var img = new Image(), u = URL.createObjectURL(file);
      img.onload = function () {
        var s = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
        c.toBlob(function (b) { b ? ok(b) : no(); }, 'image/jpeg', 0.85);
      };
      img.onerror = no; img.src = u;
    });
  }
  function upPhotos(files) {
    var m = document.getElementById('pm'); m.textContent = '사진 올리는 중…';
    files.reduce(function (pr, f) {
      return pr.then(function () { return shrink(f); }).then(function (b) { return fetch('/api/star/photo', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'image/jpeg' }, body: b }).then(function (r) { return r.json(); }); })
        .then(function (j) { if (j.key) { photos.push(j.key); drawPhotos(); } else m.textContent = errText(j.error); });
    }, Promise.resolve()).then(function () { if (m.textContent === '사진 올리는 중…') m.textContent = '사진을 넣었어요. 아래 [프로필 저장하기]를 눌러 주세요.'; }).catch(function () { m.textContent = '사진을 못 올렸어요. 다시 해 주세요.'; });
  }
  function saveProfile() {
    var g = function (id) { return document.getElementById(id).value; };
    var d = { name: g('name'), sex: g('sex'), born: g('born'), height: g('height'), weight: g('weight'), area: g('area'), agency: g('agency'), skill: g('skill'), career: g('career'), intro: g('intro'), video: g('video'), photos: photos,
      fields: [].slice.call(document.querySelectorAll('#fields input:checked')).map(function (x) { return x.value; }) };
    var m = document.getElementById('pm');
    if (!d.name.trim()) { m.textContent = '활동명을 써 주세요.'; document.getElementById('name').focus(); return; }
    if (d.video && !/^https:\/\//.test(d.video)) { m.textContent = '영상 주소는 https:// 로 시작해야 해요.'; return; }
    api('profile', { method: 'PUT', json: { d: d, pub: document.getElementById('pub').checked } }).then(function (j) {
      m.textContent = j.ok ? '저장했어요! 이제 오디션 공고에서 [지원하기]만 누르면 돼요. 🍒' : errText(j.error);
    });
  }

  // ── 오디션 올리기 · 고치기
  function viewPost(id) {
    tabOn('post');
    api('profile').then(function (pj) {
      if (!pj.login) { $v.innerHTML = loginBox('<b>오디션 올리기</b> — 감독·캐스팅 담당·극단·제작사 누구나 무료로 올려요. 지원자 연락처를 받지 않고, 싸바 안에서 1차·2차·최종 심사를 해요.'); return; }
      var go = function (a) {
        a = a || {}; var f = function (k) { return esc(a[k] || ''); };
        $v.innerHTML =
          '<div class="notice">배우 연락처는 받지 않아요. 지원자 프로필은 <b>올린 분만</b> 봐요. 아래 <b>발표 때 공개할 연락처</b>는 <b>최종 합격자에게만</b> 보여요.</div>' +
          '<label class="f">작품 이름 <small>꼭 써 주세요</small></label><input type="text" id="title" maxlength="60" value="' + f('title') + '" placeholder="예: 단편영화 「봄날」">' +
          '<label class="f">분야</label><div class="chips" id="kind">' + KINDS.map(function (x) { return '<label><input type="radio" name="kind" value="' + x + '"' + (a.kind === x ? ' checked' : '') + '>' + x + '</label>'; }).join('') + '</div>' +
          '<label class="f">제작사 · 극단</label><input type="text" id="org" value="' + f('org') + '" placeholder="예: 싸바필름">' +
          '<label class="f">모집 배역 <small>꼭 써 주세요</small></label><textarea id="roles" placeholder="예: 주연 민지(20대 여성, 밝은 대학생)&#10;조연 아버지(50대 남성)">' + f('roles') + '</textarea>' +
          '<label class="f">찾는 배우 <small>한 줄</small></label><input type="text" id="who" value="' + f('who') + '" placeholder="예: 20대 여성, 전라도 사투리 가능자 우대">' +
          '<div class="row2"><div><label class="f">촬영·공연 시기</label><input type="text" id="when" value="' + f('when') + '" placeholder="예: 2027년 2월"></div>' +
          '<div><label class="f">장소</label><input type="text" id="where" value="' + f('where') + '" placeholder="예: 광주"></div></div>' +
          '<div class="row2"><div><label class="f">출연료</label><input type="text" id="pay" value="' + f('pay') + '" placeholder="예: 회차당 협의"></div>' +
          '<div><label class="f">접수 마감</label><input type="date" id="deadline" value="' + f('deadline') + '"></div></div>' +
          '<label class="f">심사 순서</label><input type="text" id="steps" value="' + esc(a.steps || '1차 프로필·사진 → 2차 영상 → 3차 현장 연기 → 최종 발표') + '">' +
          '<label class="f">자세한 내용</label><textarea id="detail" placeholder="작품 소개, 준비할 것 등">' + f('detail') + '</textarea>' +
          '<label class="f">발표 때 공개할 연락처 <small>최종 합격자에게만</small></label><input type="text" id="contact" value="' + f('contact') + '" placeholder="예: 010-0000-0000 또는 이메일">' +
          '<button class="btn" id="go">📣 ' + (id ? '공고 고치기' : '오디션 올리기') + '</button><p class="msg" id="om"></p>';
        document.getElementById('go').onclick = function () {
          var g = function (k) { return document.getElementById(k).value; };
          var k = document.querySelector('#kind input:checked');
          var d = { title: g('title'), kind: k ? k.value : '', org: g('org'), roles: g('roles'), who: g('who'), when: g('when'), where: g('where'), pay: g('pay'), deadline: g('deadline'), steps: g('steps'), detail: g('detail'), contact: g('contact') };
          var m = document.getElementById('om');
          if (!d.title.trim() || !d.roles.trim()) { m.textContent = '작품 이름과 모집 배역은 꼭 써 주세요.'; return; }
          api('audition', { method: 'POST', json: { id: id || 0, d: d } }).then(function (j) {
            if (j.ok) location.hash = '#a/' + j.id; else m.textContent = errText(j.error);
          });
        };
      };
      if (id) api('audition/' + id).then(function (j) { go(j.owner ? j.a : null); }); else go(null);
    });
  }

  // ── 내 지원 · 내 공고
  function viewMine() {
    tabOn('mine');
    api('mine').then(function (j) {
      if (!j.login) { $v.innerHTML = loginBox('로그인하면 내가 지원한 오디션의 결과와, 내가 올린 공고를 한눈에 볼 수 있어요.'); return; }
      var h = '<h2 class="sec">🙋 내가 지원한 오디션</h2>';
      h += j.applied.length ? j.applied.map(function (a) { return '<a class="card" href="#a/' + a.id + '">' + stPill(a) + '<span class="pill">' + esc(a.my) + '</span><h3>' + esc(a.title) + '</h3><p>' + esc(a.org || '') + '</p></a>'; }).join('') : '<div class="empty">아직 지원한 오디션이 없어요. <a href="#list">공고 보러 가기 ›</a></div>';
      h += '<h2 class="sec">📣 내가 올린 공고</h2>';
      h += j.posted.length ? j.posted.map(function (a) { return '<a class="card" href="#a/' + a.id + '">' + stPill(a) + '<h3>' + esc(a.title) + '</h3><p>지원 ' + (a.n || 0) + '명 · 눌러서 심사하기 ›</p></a>'; }).join('') : '<div class="empty">올린 공고가 없어요. <a href="#post">오디션 올리기 ›</a></div>';
      $v.innerHTML = h;
    });
  }

  function route() {
    var h = location.hash.replace(/^#/, ''), m;
    window.scrollTo(0, 0);
    if ((m = /^a\/(\d+)$/.exec(h))) return viewAudition(m[1]);
    if ((m = /^p\/(\d+)\/(\d+)$/.exec(h))) return viewApplicant(m[1], m[2]);
    if ((m = /^post\/(\d+)$/.exec(h))) return viewPost(m[1]);
    if (h === 'profile') return viewProfile();
    if (h === 'post') return viewPost(0);
    if (h === 'mine') return viewMine();
    viewList();
  }
  window.addEventListener('hashchange', route);
  route();
})();
</script>
<script src="/js/share.js?v=3" defer></script>
<script src="/js/home.js?v=13" defer></script>
</body>
