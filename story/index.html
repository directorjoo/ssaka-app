<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B3132B">
  <title>싸바스토리 · 싸바</title>
  <meta property="og:title" content="📖 싸바스토리 — 먼저 건넨 한 마디">
  <meta property="og:description" content="오래 누르지 못한 번호에 먼저 건넨 '싸바? 잘 지내?' 그 한 마디의 이야기들">
  <meta property="og:image" content="https://sava.kr/img/eodiya-hi.png?v=1">
  <link rel="icon" href="../img/favicon.png?v=3">
  <link rel="stylesheet" href="../css/brand.css">
  <style>
    * { box-sizing: border-box; } [hidden] { display: none !important; }
    html, body { margin: 0; background: #FBF7F1; color: var(--ink); font-family: var(--font); }
    .w { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 18px calc(48px + env(safe-area-inset-bottom)); }
    a.back { display: inline-flex; align-items: center; min-height: 44px; color: var(--ink-2); text-decoration: none; font-weight: 700; }
    .hero { padding: 6px 0 10px; }
    .hero .k { font-size: 14px; font-weight: 800; color: var(--ssaka); letter-spacing: .04em; }
    .hero h1 { margin: 4px 0 8px; font-size: 32px; font-weight: 900; letter-spacing: -.03em; }
    .hero p { margin: 0; color: var(--ink-2); font-size: 15.5px; line-height: 1.65; word-break: keep-all; }
    .contest { margin: 18px 0 8px; padding: 18px; border-radius: 20px; background: linear-gradient(135deg, #B3132B, #7d0c1d); color: #fff; }
    .contest .t { font-size: 13px; font-weight: 800; opacity: .85; letter-spacing: .06em; }
    .contest h2 { margin: 4px 0 6px; font-size: 24px; font-weight: 900; }
    .contest p { margin: 0; font-size: 14.5px; line-height: 1.6; opacity: .92; word-break: keep-all; }
    .contest .soon { display: inline-block; margin-top: 12px; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.18); font-size: 13px; font-weight: 800; }
    .write { display: block; width: 100%; min-height: 56px; margin: 12px 0 4px; border: 0; border-radius: 16px; background: var(--ink); color: #fff; font: inherit; font-size: 17px; font-weight: 900; cursor: pointer; }
    .wnote { font-size: 13px; color: var(--ink-2); text-align: center; margin: 4px 0 0; }
    h3 { margin: 30px 0 12px; font-size: 18px; }
    .card { display: block; width: 100%; text-align: left; padding: 18px; margin-bottom: 12px; border: 0; border-radius: 18px; background: #fff; box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 8px 24px -16px rgba(0,0,0,.25); font: inherit; color: inherit; cursor: pointer; }
    .card .tg { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #FBE9EC; color: var(--ssaka); font-size: 12px; font-weight: 800; }
    .card .tt { margin: 8px 0 6px; font-size: 21px; font-weight: 900; }
    .card .ex { margin: 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.6; word-break: keep-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
    article { background: #fff; border-radius: 20px; padding: 26px 22px 22px; box-shadow: 0 8px 30px -18px rgba(0,0,0,.3); }
    article h2 { margin: 0 0 18px; font-size: 30px; font-family: "Noto Serif KR", "AppleMyungjo", serif; font-weight: 900; }
    article p { margin: 0 0 16px; font-size: 17px; line-height: 1.85; word-break: keep-all; font-family: "Noto Serif KR", "AppleMyungjo", serif; }
    article p.line { font-weight: 800; color: var(--ssaka); font-family: var(--font); }
    article .tags { margin-top: 20px; font-size: 13.5px; color: #8A7660; word-break: break-all; }
    article .fic { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .row button, .row a { min-height: 50px; border-radius: 14px; border: 0; font: inherit; font-size: 15px; font-weight: 800; cursor: pointer; display: grid; place-items: center; text-decoration: none; }
    .row .k { background: #FEE500; color: #191919; } .row .l { background: #f0ece6; color: var(--ink); }
    .send { display: block; margin-top: 10px; min-height: 54px; border-radius: 16px; background: var(--ssaka); color: #fff; font-size: 16px; font-weight: 900; text-decoration: none; display: grid; place-items: center; }
    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 11px 16px; border-radius: 14px; background: rgba(20,20,20,.9); color: #fff; font-size: 14px; font-weight: 700; }
  </style>
<script src="/js/launch.js?v=2"></script>
</head>
<body>
<div class="w">
  <div class="back" aria-hidden="true" style="visibility:hidden">·</div>

  <section id="list">
    <div class="hero">
      <div class="k">SAVA STORY</div>
      <h1>📖 싸바스토리</h1>
      <p>오래 누르지 못한 번호에 먼저 건넨 한 마디.<br>"싸바? 잘 지내?" 그 한 마디가 바꾼 이야기들을 모아요.</p>
    </div>
    <div class="contest">
      <div class="t">싸바스토리 공모전</div>
      <h2>먼저 건넨 한 마디</h2>
      <p>오래 연락 못 한 사람에게 먼저 안부를 건넸던 이야기, 혹은 건네고 싶은 이야기를 들려주세요. 실화도, 지어낸 이야기도 좋아요.</p>
      <span class="soon">🗓️ 곧 열려요 · 기간과 상은 곧 알려 드릴게요</span>
    </div>
    <button type="button" class="write" id="write">✍️ 내 이야기 올리기</button>
    <p class="wnote">카카오 로그인이 열리면 바로 올릴 수 있어요</p>
    <h3>이야기</h3>
    <div id="cards"></div>
  </section>

  <section id="read" hidden>
    <article id="art"></article>
    <div class="row"><button type="button" class="k" id="shareK">카톡으로 보내기</button><button type="button" class="l" id="copyL">링크 복사</button></div>
    <a class="send" href="../eodiya/">💬 나도 "싸바? 잘 지내?" 보내기</a>
  </section>
</div>
<script src="stories.js?v=1"></script>
<script src="../js/share.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var L = window.SAVA_STORIES || [];
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function toast(t) { var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function () { d.remove(); }, 2000); }
  function cards() {
    $('cards').innerHTML = L.map(function (s) {
      return '<button type="button" class="card" data-id="' + esc(s.id) + '"><span class="tg">' + esc(s.tag || '싸바스토리') + '</span><div class="tt">' + esc(s.title) + '</div><p class="ex">' + esc(s.paras.slice(0, 2).join(' ')) + '</p></button>';
    }).join('');
    document.querySelectorAll('.card').forEach(function (b) { b.addEventListener('click', function () { location.hash = b.dataset.id; }); });
  }
  function show() {
    var id = location.hash.replace('#', ''), s = L.filter(function (x) { return x.id === id; })[0];
    $('list').hidden = !!s; $('read').hidden = !s;
    if (!s) return;
    document.title = s.title + ' · 싸바스토리';
    $('art').innerHTML = '<h2>' + esc(s.title) + '</h2>' + s.paras.map(function (p) {
      var line = /^싸바[?!]/.test(p) && p.length < 30;
      return '<p' + (line ? ' class="line"' : '') + '>' + esc(p) + '</p>';
    }).join('') + (s.tags ? '<div class="tags">' + esc(s.tags) + '</div>' : '') + (s.fiction ? '<div class="fic">이 이야기는 싸바의 마음을 담아 지어낸 이야기입니다.</div>' : '');
    scrollTo(0, 0);
  }
  $('write').addEventListener('click', function () { toast('카카오 로그인이 열리면 바로 올릴 수 있어요 🍒'); });
  $('copyL').addEventListener('click', function () { var u = location.href; (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { toast('링크를 복사했어요'); }, function () { prompt('이 링크를 복사하세요', u); }); });
  $('shareK').addEventListener('click', function () {
    var id = location.hash.replace('#', ''), s = L.filter(function (x) { return x.id === id; })[0]; if (!s) return;
    if (window.SsakaShare) window.SsakaShare({ title: '📖 싸바스토리 「' + s.title + '」', description: s.paras[0].slice(0, 60), url: location.href.split('#')[0] + '#' + id });
  });
  window.addEventListener('hashchange', show);
  cards(); show();
})();
</script>
<script src="/js/home.js?v=9" defer></script>
</body>
</html>
