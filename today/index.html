<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#B3132B">
  <title>오늘의 싸바 · 뉴스 · 날씨 · 검색어 · 건강 · 혜택</title>
  <meta property="og:title" content="☀️ 오늘의 싸바 — 뉴스 요약 · 날씨 · 인기 검색어 · 건강 · 정부 혜택">
  <meta property="og:description" content="매일 보는 생활 채널을 싸바 안에서 한 번에. 대표님용 아침 뉴스 3줄, 우리 동네 날씨·미세먼지, 오늘의 인기 검색어, 어르신 건강, 정부 혜택.">
  <meta property="og:image" content="https://sava.kr/img/eodiya-hi.png?v=1">
  <link rel="icon" href="../img/favicon.png?v=2">
  <link rel="stylesheet" href="../css/brand.css">
  <style>
    * { box-sizing: border-box; } [hidden] { display: none !important; }
    html, body { margin: 0; background: #FFF8F3; color: var(--ink); font-family: var(--font); }
    .w { max-width: 560px; margin: 0 auto; padding: calc(14px + env(safe-area-inset-top)) 0 calc(110px + env(safe-area-inset-bottom)); }
    .hd { padding: 0 16px; }
    h1 { margin: 8px 0 2px; font-size: 27px; font-weight: 900; letter-spacing: -.03em; padding-right: 100px; }
    .date { color: var(--ink-2); font-size: 15px; font-weight: 700; }
    /* 동그라미 탭 */
    .circles { display: flex; gap: 12px; overflow-x: auto; padding: 14px 16px 10px; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .circles::-webkit-scrollbar { display: none; }
    .cb { flex: none; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 70px; padding: 0; border: 0; background: none; font: inherit; cursor: pointer; scroll-snap-align: start; text-decoration: none; color: var(--ink); }
    .cb i { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; font-style: normal; font-size: 30px; background: #fff; box-shadow: 0 0 0 3px #fff, 0 0 0 5.5px var(--c, #ddd), 0 6px 14px -8px rgba(0,0,0,.4); transition: transform .15s; }
    .cb b { font-size: 13.5px; font-weight: 800; letter-spacing: -.04em; white-space: nowrap; color: #5a4a42; }
    .cb[aria-pressed="true"] i { transform: scale(1.06); background: var(--c); }
    .cb[aria-pressed="true"] b { color: var(--ink); }
    .pane { margin: 4px 14px 0; padding: 18px 16px; border-radius: 22px; background: #fff; box-shadow: 0 1px 0 #efe3da, 0 10px 24px -18px rgba(80,30,20,.4); min-height: 240px; }
    .pane h2 { margin: 0 0 4px; font-size: 22px; font-weight: 900; letter-spacing: -.03em; }
    .pane .src { color: var(--ink-2); font-size: 13.5px; margin-bottom: 12px; }
    .sum { margin: 0 0 14px; padding: 14px 14px 12px; border-radius: 16px; background: #FFF3E6; }
    .sum li { margin: 0 0 6px; font-size: 17px; line-height: 1.5; font-weight: 700; word-break: keep-all; }
    .sum ul { margin: 0; padding-left: 20px; }
    .tip { margin-top: 8px; padding-top: 10px; border-top: 1px dashed #e9cdb5; font-size: 16px; font-weight: 800; color: #B3132B; word-break: keep-all; }
    .sec { margin: 18px 0 6px; font-size: 16px; font-weight: 900; color: #8E0A1C; }
    .nl { list-style: none; margin: 0; padding: 0; }
    .nl li { border-bottom: 1px solid #f3ebe5; }
    .nl a { display: flex; gap: 10px; padding: 11px 2px; color: var(--ink); text-decoration: none; font-size: 16.5px; line-height: 1.45; word-break: keep-all; }
    .nl a em { flex: none; min-width: 26px; font-style: normal; font-weight: 900; color: #B3132B; }
    .nl a small { display: block; margin-top: 2px; color: var(--ink-2); font-size: 13.5px; }
    .rk a em { font-size: 18px; }
    .rk .tr { flex: none; margin-left: auto; align-self: center; padding: 3px 8px; border-radius: 999px; background: #FFF0E6; color: #a14a12; font-size: 12.5px; font-weight: 800; white-space: nowrap; }
    .msg { padding: 30px 6px; text-align: center; color: var(--ink-2); font-size: 16px; line-height: 1.6; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 46px; padding: 0 16px; border-radius: 14px; border: 0; background: var(--ssaka); color: #fff; font: inherit; font-size: 16px; font-weight: 900; text-decoration: none; cursor: pointer; }
    .btn.l { background: #F3ECE6; color: #5a4a42; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .lk { display: block; padding: 12px; border-radius: 16px; background: #FFF8F3; border: 1.5px solid #f0e2d8; color: var(--ink); text-decoration: none; }
    .lk b { display: block; font-size: 16px; font-weight: 900; }
    .lk span { display: block; margin-top: 2px; color: var(--ink-2); font-size: 13px; line-height: 1.4; word-break: keep-all; }
    /* 날씨 */
    .wx-top { display: flex; align-items: center; gap: 14px; }
    .wx-ic { font-size: 64px; line-height: 1; }
    .wx-t { font-size: 52px; font-weight: 900; letter-spacing: -.04em; line-height: 1; }
    .wx-d { color: var(--ink-2); font-size: 16px; font-weight: 700; margin-top: 4px; }
    .wx-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
    .wx-row div { padding: 10px 6px; border-radius: 14px; background: #F4F8FF; text-align: center; }
    .wx-row b { display: block; font-size: 18px; font-weight: 900; }
    .wx-row span { font-size: 13px; color: var(--ink-2); font-weight: 700; }
    .dust { display: inline-block; padding: 1px 8px; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 800; }
    .wear { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #FFF3E6; font-size: 16.5px; font-weight: 800; word-break: keep-all; }
    .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 14px; text-align: center; }
    .week div { padding: 8px 0; border-radius: 12px; background: #FAF6F2; font-size: 13px; font-weight: 800; }
    .week i { display: block; font-style: normal; font-size: 22px; margin: 2px 0; }
    .week small { display: block; color: var(--ink-2); font-weight: 700; }
    .cities { display: flex; gap: 6px; overflow-x: auto; margin: 0 -2px 12px; padding: 2px; scrollbar-width: none; }
    .cities button { flex: none; min-height: 38px; padding: 0 12px; border-radius: 999px; border: 1.5px solid #e9dcd2; background: #fff; font: inherit; font-size: 14.5px; font-weight: 800; color: #5a4a42; cursor: pointer; }
    .cities button[aria-pressed="true"] { background: #1A4FB0; border-color: #1A4FB0; color: #fff; }
    /* 건강 */
    .hcard { padding: 18px 16px; border-radius: 18px; background: linear-gradient(135deg, #E9F7EF, #F5FBF7); }
    .hcard .no { color: #12924a; font-weight: 900; font-size: 14px; }
    .hcard p { margin: 6px 0 0; font-size: 19px; line-height: 1.6; font-weight: 800; word-break: keep-all; }
    .warn { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: #FFF0F0; color: #8E0A1C; font-size: 15px; font-weight: 700; line-height: 1.55; word-break: keep-all; }
    .fx { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .fx div { padding: 12px; border-radius: 14px; background: #F7F7FA; }
    .fx b { display: block; font-size: 15px; } .fx strong { display: block; margin-top: 2px; font-size: 22px; font-weight: 900; letter-spacing: -.02em; }
    .note { margin: 14px 2px 0; color: var(--ink-2); font-size: 13.5px; line-height: 1.6; word-break: keep-all; }
    .pl-bg { position: fixed; inset: 0; z-index: 2147482500; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10,4,6,.86); }
    .pl { width: 100%; max-width: 640px; }
    .pl-t { margin: 0 2px 10px; color: #fff; font-size: 16px; font-weight: 800; line-height: 1.45; word-break: keep-all; }
    .pl-v { position: relative; padding-top: 56.25%; border-radius: 14px; overflow: hidden; background: #000; }
    .pl-v iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .pl-x { display: block; width: 100%; min-height: 58px; margin-top: 14px; border: 0; border-radius: 16px; background: #B3132B; color: #fff; font: inherit; font-size: 18px; font-weight: 900; cursor: pointer; }
    .backbar { margin: 14px 2px 0; padding: 12px 14px; border-radius: 14px; background: #F3ECE6; color: #5a4a42; font-size: 14.5px; line-height: 1.6; word-break: keep-all; }
  </style>
</head>
<body>
<div class="w">
  <div class="hd"><h1>☀️ 오늘의 싸바</h1><div class="date" id="date"></div></div>
  <nav class="circles" id="circles" aria-label="오늘의 채널"></nav>
  <section class="pane" id="pane" aria-live="polite"></section>
  <p class="backbar" style="margin:14px 14px 0">🍒 바깥 사이트는 새 창으로 열려요. 다 보시고 그 창을 닫거나(✕) ‘뒤로’를 누르면 싸바로 돌아와요. 싸바 화면 맨 아래 <b>🏠 홈</b>으로 언제든 처음으로.</p>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var now = new Date(), DAYS = '일월화수목금토';
  $('date').textContent = (now.getMonth() + 1) + '월 ' + now.getDate() + '일 ' + DAYS[now.getDay()] + '요일';
  var C = [
    { k: 'letter', t: '아침편지', i: '💌', c: '#d9466a', href: '../letter/' },
    { k: 'news', t: '뉴스 요약', i: '🗞️', c: '#B3132B' },
    { k: 'wx', t: '날씨', i: '☀️', c: '#1A4FB0' },
    { k: 'google', t: '구글 검색어', i: '🔥', c: '#E8710A' },
    { k: 'yt', t: '유튜브 인기', i: '▶️', c: '#e62117' },
    { k: 'world', t: '세계 방송', i: '🌏', c: '#0b4ea2' },
    { k: 'naver', t: '네이버', i: '🟢', c: '#03C75A' },
    { k: 'health', t: '어르신 건강', i: '💊', c: '#12924a' },
    { k: 'gov', t: '정부 혜택', i: '🎁', c: '#7a3fb0' },
    { k: 'fx', t: '환율', i: '💱', c: '#0e7c86' },
    { k: 'radio', t: '라디오·TV', i: '📻', c: '#6a3a9c', href: '../radio/' }
  ];
  var cur = (location.hash || '').slice(1); try { cur = cur || localStorage.getItem('sava-today') || 'news'; } catch (e) { cur = cur || 'news'; }
  if (!C.some(function (x) { return x.k === cur && !x.href; })) cur = 'news';
  var bar = $('circles');
  C.forEach(function (x) {
    var b = el(x.href ? 'a' : 'button', 'cb'); if (x.href) b.href = x.href; else b.type = 'button';
    b.style.setProperty('--c', x.c); b.dataset.k = x.k;
    var i = el('i', '', x.i), t = el('b', '', x.t); b.appendChild(i); b.appendChild(t);
    if (!x.href) b.addEventListener('click', function () { show(x.k); });
    bar.appendChild(b);
  });
  function paintBar() { bar.querySelectorAll('.cb').forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.k === cur ? 'true' : 'false'); }); }
  var pane = $('pane');
  function msg(t) { pane.innerHTML = '<div class="msg">' + t + '</div>'; }
  function show(k) {
    cur = k; try { localStorage.setItem('sava-today', k); } catch (e) {} history.replaceState(null, '', '#' + k); paintBar();
    ({ news: news, wx: wx, google: google, yt: yt, world: world, naver: naver, health: health, gov: gov, fx: fx })[k]();
  }
  function api(k) { return fetch('/api/today?k=' + k).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }
  function nlist(arr, rank) {
    return '<ul class="nl' + (rank ? ' rk' : '') + '">' + arr.map(function (n, i) {
      return '<li><a href="' + esc(n.url) + '" target="_blank" rel="noopener"><em>' + (i + 1) + '</em><span>' + esc(n.t) + (n.src ? '<small>' + esc(n.src) + '</small>' : '') + '</span></a></li>';
    }).join('') + '</ul>';
  }

  // 🗞️ 뉴스 요약
  function news() {
    msg('오늘 뉴스를 모으는 중이에요…');
    api('news').then(function (d) {
      if (cur !== 'news') return;
      var h = '<h2>🗞️ 오늘의 뉴스</h2><div class="src">' + esc(d.at) + ' 기준 · 제목을 누르면 원문 기사로 가요</div>';
      if (d.sum && d.sum.lines && d.sum.lines.length) h += '<div class="sum"><div class="sec" style="margin-top:0">☕ 대표님 아침 3줄</div><ul>' + d.sum.lines.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('') + '</ul>' + (d.sum.tip ? '<div class="tip">💡 ' + esc(d.sum.tip) + '</div>' : '') + '</div>';
      if (d.biz && d.biz.length) h += '<div class="sec">🏪 자영업·소상공인 소식</div>' + nlist(d.biz);
      h += '<div class="sec">📌 지금 주요 뉴스</div>' + nlist(d.top || []);
      h += '<p class="note">뉴스 제목과 원문 링크는 구글 뉴스에서 모아 와요. ‘아침 3줄’은 AI가 제목만 보고 정리한 것이라, 자세한 내용은 원문에서 확인해 주세요.</p>';
      pane.innerHTML = h;
    }).catch(function () { if (cur === 'news') msg('뉴스를 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  }

  // 🔥 구글 인기 검색어
  function google() {
    msg('구글 인기 검색어를 모으는 중이에요…');
    api('google').then(function (d) {
      if (cur !== 'google') return;
      var h = '<h2>🔥 구글 인기 검색어</h2><div class="src">' + esc(d.at) + ' 기준 · 한국에서 지금 많이 찾는 말</div><ul class="nl rk">';
      h += (d.list || []).map(function (x, i) {
        var u = x.news && x.news.url ? x.news.url : 'https://www.google.com/search?q=' + encodeURIComponent(x.t);
        return '<li><a href="' + esc(u) + '" target="_blank" rel="noopener"><em>' + (i + 1) + '</em><span><b>' + esc(x.t) + '</b>' + (x.news ? '<small>' + esc(x.news.t) + ' · ' + esc(x.news.src) + '</small>' : '') + '</span>' + (x.traffic ? '<span class="tr">검색 ' + esc(x.traffic) + '</span>' : '') + '</a></li>';
      }).join('') + '</ul><p class="note">구글 트렌드의 ‘지금 뜨는 검색어’예요. 누르면 관련 기사로 가요.</p>';
      pane.innerHTML = h;
    }).catch(function () { if (cur === 'google') msg('검색어를 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  }

  // ▶️ 유튜브 인기 (조회수 많은 순)
  function views(n) { return n >= 1e8 ? (Math.round(n / 1e7) / 10) + '억' : n >= 1e4 ? Math.round(n / 1e4).toLocaleString('ko-KR') + '만' : n.toLocaleString('ko-KR'); }
  function yt() {
    msg('유튜브 인기 동영상을 모으는 중이에요…');
    api('yt').then(function (d) {
      if (cur !== 'yt') return;
      if (d.need) { pane.innerHTML = '<h2>▶️ 유튜브 인기</h2><div class="msg">곧 열려요! 유튜브 인기 동영상을 조회수 순으로 보여 드릴게요.</div><div style="text-align:center"><a class="btn l" href="https://www.youtube.com/feed/trending" target="_blank" rel="noopener">유튜브 인기 급상승 바로 가기</a></div>'; return; }
      pane.innerHTML = '<h2>▶️ 유튜브 인기 동영상</h2><div class="src">' + esc(d.at) + ' 기준 · 한국 인기 동영상을 조회수 많은 순으로</div><ul class="nl rk">' +
        (d.list || []).map(function (v, i) { return '<li><a class="ytv" data-id="' + esc(v.id) + '" href="https://www.youtube.com/watch?v=' + encodeURIComponent(v.id) + '" target="_blank" rel="noopener"><em>' + (i + 1) + '</em>' + (v.img ? '<img src="' + esc(v.img) + '" alt="" width="96" height="54" loading="lazy" style="flex:none;border-radius:8px;object-fit:cover">' : '') + '<span>' + esc(v.t) + '<small>' + esc(v.ch) + ' · 조회수 ' + views(v.views) + '회</small></span></a></li>'; }).join('') + '</ul>';
      // 싸바 안에서 바로 재생 (밖으로 나가지 않음)
      pane.querySelectorAll('a.ytv').forEach(function (a) { a.addEventListener('click', function (e) { e.preventDefault(); player(a.dataset.id, a.querySelector('span').firstChild.textContent); }); });
    }).catch(function () { if (cur === 'yt') msg('유튜브 인기 동영상을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  }

  // 싸바 안 동영상 창: 아래 [🍒 싸바로 돌아가기]로 언제든 닫고 돌아옴
  function player(id, title) {
    var bg = el('div', 'pl-bg'); bg.innerHTML = '<div class="pl"><div class="pl-t"></div><div class="pl-v"><iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&playsinline=1&rel=0" title="동영상" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div><button type="button" class="pl-x">🍒 싸바로 돌아가기</button></div>';
    bg.querySelector('.pl-t').textContent = title || '';
    function close() { bg.remove(); document.body.style.overflow = ''; }
    bg.querySelector('.pl-x').addEventListener('click', close); bg.addEventListener('click', function (e) { if (e.target === bg) close(); });
    document.body.appendChild(bg); document.body.style.overflow = 'hidden';
  }

  // 🌏 세계 방송 — 각국 대표 채널 뉴스 제목을 한국어로 + 공식 생방송·오락 채널 바로가기
  var WN = [
    ['CNN', '미국', 'https://edition.cnn.com', '#cc0000'], ['BBC', '영국', 'https://www.bbc.com/news', '#bb1919'], ['NBC', '미국', 'https://www.nbcnews.com', '#0a5dc2'],
    ['NHK', '일본', 'https://www3.nhk.or.jp/nhkworld/', '#333'], ['알자지라', '카타르', 'https://www.aljazeera.com', '#c98a00'], ['France 24', '프랑스', 'https://www.france24.com/en/', '#00a3e0'],
    ['DW', '독일', 'https://www.dw.com/en/', '#05b2fc'], ['Sky News', '영국', 'https://news.sky.com', '#c4161c'], ['CGTN', '중국', 'https://www.cgtn.com', '#d81e05']
  ];
  var WE = [
    ['KBS World', '한국 드라마·예능 (외국어 자막)', 'https://world.kbs.co.kr'], ['아리랑TV', '한국을 세계에 알리는 방송', 'https://www.arirang.com'],
    ['삼성 TV 플러스', '무료 채널 수십 개 (영화·예능)', 'https://www.samsungtvplus.com'], ['유튜브 인기 음악', '지금 세계에서 뜨는 음악', 'https://music.youtube.com/charts']
  ];
  function world() {
    var h = '<h2>🌏 세계 방송</h2><div class="src">각국 대표 채널 뉴스를 한국어로 · 누르면 원문 기사</div><div id="wnl"><div class="msg">세계 뉴스를 한국어로 옮기는 중이에요…</div></div>' +
      '<div class="sec">📺 생방송·뉴스 바로가기</div><div class="grid2" style="grid-template-columns:repeat(3,1fr)">' +
