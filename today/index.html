      var R = j.rates, krw = R.KRW;
      function f(code, unit) { return Math.round(krw / R[code] * unit * 10) / 10; }
      var rows = [['🇺🇸 미국 달러', '1달러', f('USD', 1)], ['🇯🇵 일본 엔', '100엔', f('JPY', 100)], ['🇪🇺 유로', '1유로', f('EUR', 1)], ['🇨🇳 중국 위안', '1위안', f('CNY', 1)], ['🇻🇳 베트남 동', '1만 동', f('VND', 10000)], ['🇹🇭 태국 바트', '1바트', f('THB', 1)]];
      pane.innerHTML = '<h2>💱 오늘의 환율</h2><div class="src">' + esc((j.time_last_update_utc || '').slice(5, 16)) + ' 기준 · 원화로 얼마?</div><div class="fx">' +
        rows.map(function (r) { return '<div><b>' + r[0] + '</b><span style="color:var(--ink-2);font-size:13px">' + r[1] + ' =</span><strong>' + r[2].toLocaleString('ko-KR') + '원</strong></div>'; }).join('') + '</div>' +
        '<p class="note">참고용 기준 환율이에요(ExchangeRate-API). 은행에서 살 때·팔 때는 수수료가 붙어 조금 달라요.</p>';
    }).catch(function () { if (cur === 'fx') msg('환율을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.'); });
  }

  // ★ 지금 보고 있는 탭 하나만 보내기 — 받는 사람은 이 탭부터 보고, 위 동그라미로 싸바 전체를 둘러봄
  var SENDT = { biz: '지금 신청할 수 있는 정부 지원사업, 마감 가까운 순으로 정리돼 있어요', sns: '구글 메일부터 인스타·카톡 채널까지 차례대로 따라 하면 돼요', insure: '보험 파는 곳 아닌 공식 기관 조회로 쓸데없는 보험료 새는지 5분이면 점검돼요', senior: '어르신이 받을 수 있는 혜택 공식 창구 모음이에요', fest: '지금 열리는 전국 축제·행사예요', near: '내 주변 가볼 곳·맛집이에요', health: '날마다 바뀌는 건강 한마디예요' };
  function link() { return 'https://sava.kr/today/?t=' + encodeURIComponent(cur); }
  $('send').addEventListener('click', function () {
    var xx = C.filter(function (x) { return x.k === cur; })[0] || { i: '☀️', t: '오늘의 싸바' };
    var info = { title: xx.i + ' ' + xx.t + ' · 싸바', description: SENDT[cur] || '매일 보는 생활 정보를 싸바 안에서 한 번에', url: link(), imageUrl: 'https://sava.kr/img/today-share.jpg?v=1', imageWidth: 800, imageHeight: 400, buttonTitle: '이 화면 열기', noButtons: true };
    if (window.SsakaShare) window.SsakaShare(info);
    else if (navigator.share) navigator.share({ title: info.title, text: info.description, url: info.url }).catch(function () {});
    else prompt('아래 링크를 복사해서 카톡에 붙여 넣으세요', info.url);
  });
  $('copy').addEventListener('click', function () {
    var u = link();
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(u).then(function () { $('copy').textContent = '✅ 복사됨'; setTimeout(function () { $('copy').textContent = '🔗 링크'; }, 1800); }, function () { prompt('아래 링크를 복사하세요', u); });
    else prompt('아래 링크를 복사하세요', u);
  });
  if (fromLink) {
    $('welcome').hidden = false;
    $('wtop').addEventListener('click', function (e) { e.preventDefault(); scrollTo({ top: 0, behavior: 'smooth' }); });
  }
  paintBar(); show(cur);
  if (fromLink) setTimeout(function () { var w = $('welcome'); if (w.scrollIntoView) w.scrollIntoView({ block: 'start' }); }, 60);
  var a = bar.querySelector('[aria-pressed="true"]'); if (a && a.scrollIntoView) a.scrollIntoView({ inline: 'center', block: 'nearest' });
})();
